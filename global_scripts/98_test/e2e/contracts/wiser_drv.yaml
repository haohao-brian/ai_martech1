      severity: critical

    df_dna_by_customer:
      l2_row_count_min: 5000
      severity: critical

    df_position:
      l2_row_count_min: 20
      severity: critical

  # --- cbz Poisson placeholder (warning — broken template state) ---
  cbz:

    df_cbz_poisson_analysis_alf:
      l2_row_count_min: 1
      severity: warning

    df_cbz_poisson_analysis_hc:
      l2_row_count_min: 1
      severity: warning

    df_cbz_poisson_analysis_sop:
      l2_row_count_min: 1
      severity: warning

  # --- eby Poisson placeholder (warning — same template state) ---
  eby:

    df_eby_poisson_analysis_alf:
      l2_row_count_min: 1
      severity: warning

    df_eby_poisson_analysis_hc:
      l2_row_count_min: 1
