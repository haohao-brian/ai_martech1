#
# Gate: shared/global_scripts/23_deployment/drv_output_shape_gate.R
# Note: WISER's app_config.yaml has no `pipeline.platforms:` section
#   (template stub). Tables in app_data.duckdb appear to be cloned dummy
#   data shared with kitchenMAMA (df_customer_profile 7349 / df_dna_by_customer
#   14260 / df_position 40). Poisson tables exist (df_cbz/eby_poisson_analysis_*)
#   but all 0 rows with `predictor_type = ""` — broken template state.
#
# Severity choices (2026-05-14 baseline):
#   - DNA tables: critical (real numbers from dummy data)
#   - Position: critical (40 rows is meaningful)
#   - Poisson (cbz + eby): WARNING — all currently 0 rows with empty
#     predictor_type. Will fail L2 + L3 on every run; gate surfaces the
#     template-state gap without blocking daily WISER ops.
#
# Sunset: 2026-06-13 (per MP165 v1.3 default)

company: WISER

drv_contracts:

