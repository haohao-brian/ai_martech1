# MP165 Dashboard Presence Contract — D_RACING (技詮賽車精品)
# Spectra change: dashboard-presence-verification
#
# Phase 1 (2026-05-13, refs #653) — new Phase 1 primitives available in
# contracts.R: assert_no_error_text / assert_no_hardcoded_english /
# assert_kpi_no_error_placeholder. Auto-suggested block reserved at end of
# file for Phase 3 adaptive-walker output (spectra change adaptive-dashboard-test-loop).
#
# Active platforms (per D_RACING/app_config.yaml > pipeline > platforms):
#   amz (active)
#
# Threshold notes:
#   - D_RACING brand catalog smaller than QEF; min_brands floor at 3
#     for BrandEdge contracts (vs QEF >= 5). Tune up as catalog grows.
#   - TagPilot / VitalSigns / dashboard_overview thresholds match QEF
#     pattern (KPIs > 0, charts non-empty). Customer count floor lower
#     than QEF.

company: D_RACING

modules:

  brandedge:
    enabled: true
    sub_tabs:

      position:
        active_product_lines: [all]
        contracts:
          - selector: "position-position_table"
            assertion: "row_count_excluding_placeholders >= 3"
            severity: critical
          - selector: "position-brand"
            assertion: "filter_choice_count >= 2"
            severity: critical
          - selector: "position-component_status"
            assertion: "no_red_error_text"
            severity: critical

      positionDNA:
        active_product_lines: [all]
        contracts:
          - selector: "positionDNA-dna_plot"
            assertion: "plotly_non_empty_traces >= 1"
            severity: critical

      positionMS:
        active_product_lines: [all]
        contracts:
          - selector: "positionMS-ms_plot"
            assertion: "plotly_non_empty_traces >= 1"
            severity: warning

  tagpilot:
    enabled: true
    sub_tabs:

      customerValue:
        active_product_lines: [all]
        contracts:
          - selector: "customerValue-kpi_total_customers"
            assertion: "kpi >= 100"
            severity: critical
          - selector: "customerValue-kpi_avg_order_value"
            assertion: "kpi > 0"
            severity: critical
          - selector: "customerValue-pie_value_segments"
            assertion: "plotly_non_empty_traces >= 1"
            severity: critical

      customerActivity:
        active_product_lines: [all]
        contracts:
          - selector: "customerActivity-kpi_avg_cai"
            assertion: "kpi != NA"
            severity: critical

      customerStatus:
        active_product_lines: [all]
        contracts:
          - selector: "customerStatus-pie_nes"
            assertion: "plotly_non_empty_traces >= 1"
            severity: critical

  vitalsigns:
    enabled: true
    sub_tabs:

      customerRetention:
        active_product_lines: [all]
        contracts:
          - selector: "customerRetention-kpi_retention_rate"
            assertion: "kpi > 0"
            severity: warning

  dashboard_overview:
    enabled: true
    sub_tabs:

      overview:
        active_product_lines: [all]
        contracts:
          - selector: "dashboardOverview-kpi_total_revenue"
            assertion: "kpi > 0"
            severity: critical
          - selector: "dashboardOverview-kpi_total_dna_customers"
            assertion: "kpi > 0"
            severity: critical

