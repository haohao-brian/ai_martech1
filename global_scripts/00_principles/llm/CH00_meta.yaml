         - Confirm paths exist and are correct
         - Trace dependency chains when uncertain

    rule_formal: |
      RULE MP029_NO_FAKE_INFO:
      FOR ALL information I before_action(A):
      verify(I) BEFORE execute(A)
      NOT assume(I.exists)
      NOT assume(I.is_used)
      NOT assume(I.path_correct)

    derived_rules:
