chapter: "CH00_meta"
description: "ALL Fundamental Meta-Principles (Complete Set)"
principle_count: 143

# Note: This file contains ALL meta-principles including:
# - MP001-MP109: Core architectural principles
# - MP110-MP118: Security principles (CRITICAL)
# - MP119-MP123: Additional meta-principles
# - MP151-MP152: No-Fallback & Breaking Version (added 2026-02-28)
# - MP153: Data Type Presentation Fidelity (added 2026-03-10)
# - MP154: Side Effect Defense (added 2026-03-14)
# - MP155: Minimize Human Input (added 2026-04-26)
