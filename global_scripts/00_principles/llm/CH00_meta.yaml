  - id: MP165
    type: meta_principle
    name: dashboard_presence_pipeline_acceptance
    display_name: "Dashboard Presence as Pipeline Acceptance"
    one_liner: "Pipeline acceptance contract SHALL extend from database-write completion to per-dashboard-tab × per-platform × per-product_line every-field rendering presence. Database-write completion is necessary but not sufficient for pipeline success. A make run SHALL fail if any dashboard tab renders NULL or fails declared per-element contracts (KPI thresholds, DataTable meaningful row counts excluding placeholders, Plotly trace counts, filter dropdown choices) under default state for any active platform / product_line. Three-tier enforcement: Tier 1 DRV-end lite (NULL output detection ~5s) + Tier 2 deploy-gate full contract suite (~60s) + Tier 3 CI selective per affected modules (~15s). Hard fail discipline: no soft_warn_mode toggle; the only opt-out is (a) absence of corresponding DRV target (declarative-dependency natural opt-out) or (b) per-contract severity:warning (Tier 2 reports but does not block deploy; Tier 1 ignores severity since Tier 1 only checks NULL outputs). Sister principle cluster: MP165 is the per-dashboard-tab complement to MP162 (per-bridge L4 ship-readiness axis), the orthogonal complement to MP163 (input-completeness axis), the downstream rendering layer relative to MP102 v1.3 (bridge yaml authoring contract), and operationalizes MP029 verify-before-acting at the rendering boundary. **Two-axis acceptance framework (v1.1, #648)**: orthogonal Quality axis = Step 1 (No Red Errors: zero R stop()/uncaught errors, zero [DEBUG_MODE_NULL_OUTPUT] markers, zero red error text in UI, zero JS console errors) / Step 2 (Meaningful Values: KPI > threshold, DataTable rows ≥ min after excluding placeholders, Plotly traces non-empty, dropdowns ≥ min_choices, no `-`/NULL/NA where real value expected); Context axis = Local check (dev-time iterate-friendly: warnings tolerated, critical still fail-loud; Rscript app.R + agent-browser + console grep) / Deploy check (pre-deploy gate strict: any critical fail refuses deploy push; dashboard_presence_gate.R). Tier ↔ Step mapping: Tier 1 covers Step 1 only (NULL marker scan); Tier 2 covers Step 1 + Step 2 (full contract suite); Tier 3 covers Step 1 + Step 2 (per-module subset). Step 1 is NOT a single-Tier task — no_red_error_text assertion runs across Tier 2/3 too; [DEBUG_MODE_NULL_OUTPUT] is Tier 1 fast signal but deploy-gate re-verifies. **Dual-track architecture (v1.2, #653)**: Track A declarative baseline (hand-maintained per-company yaml + dashboard_presence_gate.R, closed-world, deterministic, version-controlled — the floor of dashboard testing) + Track B adaptive overlay (/shiny-adaptive-walk skill in r-shiny-debugger plugin v1.1+, self-converging loop that discovers defects via safari-browser + LLM judge, bifurcates real_bug → /idd-issue vs test_infra_gap → skill mutates yaml/primitives, with per-iter safety gate + auto-rollback + CONVERGED/PLATEAUED/DIMINISHING verdict — the ceiling of dashboard testing). (C) Aggressive authority: Track B skill MAY edit mutable zone (98_test/e2e/**, dashboard_presence_gate.R, fn_debug_mode.R); skill MUST NOT touch immutable zone (10_rshinyapp_components/**, 16_derivations/**, fn_analysis_*.R, update_scripts/ETL/**, update_scripts/DRV/**, .qmd principle files) — files /idd-issue instead. Declarative is the floor; adaptive is the ceiling. Both axes must hold for full MP165 conformance. MP165_ADAPTIVE_BUDGET=100 env var caps LLM judge calls per session. **DRV-layer Step 2 propagation (v1.3, #668)**: Step 2 'Meaningful Values' SHALL be enforced at the DRV layer (not only at the dashboard layer) via a new `drv_output_shape_gate.R` script verifying per-company `<company>_drv.yaml` contracts at three levels: L1 table-exists (mandatory) + L2 row-count-min (mandatory) + L3 predictor-type-distribution (optional, for tables with a predictor_type column). Closes the vacuous-pass gap where DRV pipelines reported success producing empty / partial output tables (3 concrete cases: D_RACING amz table missing, QEF/MAMBA amz/cbz predictor_type-distribution incomplete). Defense in depth: dashboard-layer Step 2 (v1.1) catches consumer-side regressions; DRV-layer Step 2 (v1.3) makes producer-side vacuous-pass impossible. Sentinel rows (MP163 'unclassified'/'UNKNOWN') count toward L2/L3 by default; optional `sentinel_ratio_max` warning for opt-in detection of mask-by-sentinel. 30-day warn-mode transition (default sunset 2026-06-13) before strict-mode mandatory; matches MP102 v1.3 reviewed_by legacy sunset pattern. Per-company `strict_mode: true` opt-in available pre-sunset. Independent script (NOT `dashboard_presence_gate.R --mode drv`) but shares `contracts.R` primitive library where applicable. Independent yaml file (NOT in `app_config.yaml`)."
    file_path: "CH00_fundamental_principles/03_development_methodology/MP165_dashboard_presence_pipeline_acceptance.qmd"
    version: "1.3"
    date_created: "2026-05-10"
    date_modified: "2026-05-14"

    rule_natural: |
      Three-tier acceptance contract enforced via primitive helper library:

        (1) Tier 1: DRV-end lite (NULL output detection)
            update_scripts/DRV/_targets.R SHALL include a final target
            dashboard_smoke_lite that runs after all 5NM-layer
            derivations complete. The target SHALL launch a headless
            Shiny session in SHINY_DEBUG_MODE=TRUE, walk default
            sidebar nav state across all active platforms and
            product_lines, and inspect .shiny-debug/shiny.log for
            [DEBUG_MODE_NULL_OUTPUT] markers emitted by
            04_utils/fn_debug_mode.R::debug_log_output(). Any NULL
            render output SHALL fail the target with a structured
            (company, tab, platform, product_line, output_id) message.
            Runtime budget: target ≤ 5s typical, hard ceiling 30s per
            company. Designed cheap enough for every make run.

        (2) Tier 2: Deploy-gate full contract suite
            shared/global_scripts/23_deployment/dashboard_presence_gate.R
            SHALL run before make deploy-push invokes rsconnect. The
            gate loads per-company contract YAML at
            shared/global_scripts/98_test/e2e/contracts/<company_lowercase>.yaml,
            launches headless Shiny once per
            (active_platform, active_product_line) tuple, and
            evaluates every contract via the primitive helpers in
            contracts.R. Any severity:critical contract failure SHALL
            cause the gate to exit non-zero and refuse the deploy
            push. severity:warning SHALL be reported but SHALL NOT
            block deploy. Runtime budget: ≤ 60s per company on typical
            app data sets.

        (3) Tier 3: CI selective per pull request
            CI workflow SHALL read PR git diff --name-only between
            head and base, map changed paths to module identifiers
            via shared/global_scripts/98_test/e2e/affected_modules.R,
            and run only the corresponding contract subsets. Workflow
            SHALL complete within 30s for typical PRs touching one or
            two modules. PRs touching shared utilities consumed by
            all modules (e.g. fn_translation.R) SHALL trigger the
            full contract suite — selectivity is by reverse-
            dependency, not by file alone.

        (4) Contract primitive library
            shared/global_scripts/98_test/e2e/contracts/contracts.R
            SHALL provide at minimum five per-element-type assertion
            primitives:
              - assert_kpi_card_value(app, kpi_id, op, threshold, severity)
              - assert_datatable_meaningful_rows(app, table_id, min_rows,
                                                  exclude_placeholders=TRUE)
              - assert_plotly_has_data_points(app, plot_id, min_traces=1)
              - assert_filter_dropdown_choices(app, filter_id, min_choices)
              - assert_chart_axis_non_empty(app, plot_id, axis="x")
            The default exclude_placeholders=TRUE for
            assert_datatable_meaningful_rows is the critical
            strengthening: prior weak assert_datatable_has_rows(min_rows=1)
            incorrectly passed when QEF hsg had only 1 row (the
            'Ideal' placeholder), missing the actual data gap.

        (5) Per-company contract YAML schema
            Per-company YAML lives at
            shared/global_scripts/98_test/e2e/contracts/<company_lowercase>.yaml
            with structure:
              company: <COMPANY_NAME>
              modules:
                <module_name>:
                  enabled: true | false
                  sub_tabs:
                    <tab_id>:
                      active_product_lines: [<id>, ...]
                      contracts:
                        - selector: <ns_id>
                          assertion: "<expression>"
                          severity: critical | warning
            Companies that do not enable a module SHALL set
            enabled:false OR may omit the module entirely. The
            natural opt-out path is absence of the corresponding DRV
            target in the company's update_scripts/DRV/_targets.R —
            declarative dependency ensures the contract target does
            not run when its source DRV is absent.

        (6) Hard fail discipline
            The framework SHALL NOT support a global soft_warn_mode
            toggle that downgrades all critical contracts to
            warnings. The only opt-out paths are (a) DRV target
            absent (declarative-dependency natural opt-out) or
            (b) per-contract severity:warning. Hard fail aligns with
            user requirement '打通 + 不會紅字' (pipeline must work
            AND no red errors). Early fail-loud at DRV gate prevents
            late red errors at user's screen.

        (7) Two-axis acceptance framework (v1.1, 2026-05-13, #648)
            The principle SHALL be applied along two orthogonal axes:

            Quality axis (what to verify):
              - Step 1: No Red Errors — zero R stop()/uncaught
                errors propagating to Shiny output; zero
                [DEBUG_MODE_NULL_OUTPUT] markers in
                .shiny-debug/shiny.log; zero red error text in UI;
                zero JS console errors during default sidebar walk.
              - Step 2: Meaningful Values — KPI cards show values
                satisfying op/threshold; DataTables show >= min_rows
                AFTER excluding placeholder rows (Ideal, Rating,
                Revenue); Plotly traces non-empty; filter dropdowns
                expose >= min_choices; no '-'/NULL/NA where real
                value expected.

            Context axis (where + with what stringency):
              - Local check (dev-time): Rscript app.R + agent-browser
                + console grep; severity:critical fails loudly,
                severity:warning tolerated; developer-driven cadence
                (before each commit, after each branch switch).
              - Deploy check (pre-deploy gate): dashboard_presence_gate.R;
                any severity:critical fail refuses deploy push
                (non-zero exit); severity:warning reported but does
                not block; required gate before make deploy-push.

            Both axes use the SAME contract YAML and SAME primitives
            in contracts.R. Difference is stringency, not content.

            Step 1 is necessary but NOT sufficient for Step 2: a tab
            that renders zero errors but displays '-' for every KPI
            passes Step 1 and fails Step 2.

            Tier ↔ Step mapping (Tier = timing, Step = quality):
              - Tier 1 lite: Step 1 only (NULL marker scan)
              - Tier 2 full: Step 1 + Step 2 (full contract suite)
              - Tier 3 CI selective: Step 1 + Step 2 (per-module subset)
            Step 1 is NOT a single-Tier task. The 2x2 framework lives
            at principle layer; Tier system lives at implementation
            layer; primitives may serve either Step in any Tier.

        (8) Dual-track architecture + (C) Aggressive authority (v1.2, 2026-05-13, #653)
            The principle SHALL be enforced via two complementary tracks:

            Track A: Declarative Baseline (existing)
              - Hand-maintained per-company yaml at
                shared/global_scripts/98_test/e2e/contracts/<co>.yaml
              - Paired with contracts.R primitive library +
                dashboard_presence_gate.R runner
              - Authors explicitly declare every selector + assertion
              - Closed-world coverage (only declared selectors evaluated)
              - Reproducible CI / deploy-gate behavior
              - "Floor" of dashboard testing — known coverage

            Track B: Adaptive Overlay (new, v1.2)
              - /shiny-adaptive-walk skill in r-shiny-debugger plugin v1.1+
              - Self-converging loop (max 5 iter, MP165_ADAPTIVE_BUDGET=100
                LLM call cap):
                1. Discovery via safari-browser (real macOS renderer,
                   visible to user — narrow exception per
                   08-shiny-testing.md)
                2. LLM judge (Claude Haiku 4.5) classifies defects:
                   real_bug / test_infra_gap / acceptable
                3. Bifurcated action:
                   - real_bug → file /idd-issue with composite signature
                     <company>:<module>:<sub_tab>:<defect_class>:<key_phrase>;
                     dedup via gh issue list --search before filing
                   - test_infra_gap → skill mutates Track A yaml/primitives
                4. Per-iter safety gate (testthat::test_dir + mechanical
                   gate) + auto-rollback (git reset --hard HEAD~1) on
                   regression
                5. Convergence verdict: CONVERGED (0 new defects) /
                   PLATEAUED (same set 2 iter, AskUserQuestion) /
                   DIMINISHING (mostly filed bugs, test infra converged)
              - "Ceiling" of dashboard testing — open-world discovery

            (C) Aggressive Test-Framework Authority for Track B skill:

              Mutable zone (skill MAY edit):
                - shared/global_scripts/98_test/e2e/contracts/*.yaml
                - shared/global_scripts/98_test/e2e/contracts/contracts.R
                - shared/global_scripts/98_test/e2e/run_smoke_lite.R
                - shared/global_scripts/98_test/e2e/test-*.R
                - shared/global_scripts/23_deployment/dashboard_presence_gate.R
                - shared/global_scripts/04_utils/fn_debug_mode.R

              Immutable zone (skill MUST file /idd-issue instead):
                - shared/global_scripts/10_rshinyapp_components/** (UI)
                - shared/global_scripts/16_derivations/** (business logic)
                - shared/global_scripts/04_utils/fn_analysis_*.R
                - shared/update_scripts/ETL/**
                - shared/update_scripts/DRV/**
                - Any .qmd principle file (human-only decision)

              Pre-mutation glob check is hard-coded in skill spec.
              Mutation attempt against immutable zone is a skill bug.

            Track convergence:
              - Track B finds defect → file issue OR add contract to
                Track A # === auto-suggested === block
              - Track A contracts evaluated by dashboard_presence_gate.R
                — Track B's mechanical regression step
              - Hand-maintained yaml sections are immutable to Track B
                (sister to MP159 Layer 1 immutability for glue authoring)

            Declarative is the floor; adaptive is the ceiling.
            Both axes must hold for full MP165 conformance.

            Plugin coupling: r-shiny-debugger plugin v1.1+ in
            PsychQuant/psychquant-claude-plugins repo. Plugin version
            must be >= 1.1 for adaptive-walker skill availability.

        (9) Sister principle cross-references
            MP165 belongs to a four-principle cluster:
              - MP029 (No Fake Information): MP165 contract assertions
                verify real values rendered to users; 1-row 'Ideal'
                placeholder counts as gap to surface (operationalizes
                MP029 at rendering boundary).
              - MP102 v1.3 (ETL Output Standardization): MP102 governs
                bridge yaml authoring contract; MP165 is downstream
                rendering acceptance contract — bridge yaml correct
                + DRV pipeline complete is necessary but not
                sufficient for user-visible completeness.
              - MP162 (Bridge End-to-End Realization): MP162 governs
                per-bridge ship-readiness axis (L1-L5, L4 requires at
                least one Shiny module render > 0 rows); MP165 is
                per-dashboard-tab × per-platform × per-product_line
                complement — different unit, sister axis.
              - MP163 (Progressive Completeness): MP163 governs input-
                completeness axis (sentinel discipline when human
                inputs absent); MP165 governs rendering-acceptance
                axis (per-tab contract gate). Orthogonal — both must
                hold for user-facing completeness.

        (10) DRV-Layer Step 2 Propagation (v1.3, 2026-05-14, #668)

            The principle SHALL be enforced at the DRV layer (not only
            at the dashboard layer) via an output-shape gate script:

            (10.1) The gate script
              shared/global_scripts/23_deployment/drv_output_shape_gate.R
              is independent from `dashboard_presence_gate.R` (input
              source differs: DBI direct queries vs headless Shiny UI)
              but shares `contracts.R` primitives where applicable.

            (10.2) DRV pipelines SHALL invoke the gate as the final
              pipeline target (`verify_drv_output_shape` in
              update_scripts/_targets.R). The gate SHALL hard-fail
              (exit non-zero) on critical contract failure in
              strict-mode; warn-mode does not block.

            (10.3) Per-company contracts SHALL live at
              shared/global_scripts/98_test/e2e/contracts/<company>_drv.yaml
              (parallel to dashboard <company>.yaml, NOT in
              app_config.yaml). Schema:
                drv_contracts:
                  <platform>:
                    <table_name>:
                      l1_table_exists: true   # always true
                      l2_row_count_min: <N>   # default 1
                      l3_predictor_types:     # optional
                        required: [<type>, ...]
                        min_count_per_type: <K>
                      sentinel_ratio_max: <F> # optional, default null
                      severity: critical | warning
                strict_mode: false            # opt-in pre-sunset

            (10.4) 3-level granularity:
              - L1 table-exists (mandatory): DBI::dbExistsTable
              - L2 row-count-min (mandatory): COUNT(*) vs threshold
              - L3 predictor-type-distribution (optional): GROUP BY
                predictor_type vs declared `required` types
              Two-level (L1+L2 only) too coarse; empty time_feature
              also missed. L3 only meaningful for tables with a
              predictor_type column (Poisson-analysis tables); declared
              only where applicable.

            (10.5) MP163 sentinel boundary:
              - Sentinel-covered rows ('unclassified', 'UNKNOWN',
                per-domain MP163 markers) SHALL count toward L2 and
                L3 by default.
              - Rejecting sentinels would force pipelines to stop()
                on incomplete input, violating MP163 'always runnable'.
              - Optional `sentinel_ratio_max` per contract (default
                off) emits WARNING when sentinel ratio > threshold;
                catches mask-by-sentinel anti-pattern without breaking
                default MP163 compatibility.

            (10.6) 30-day warn-mode transition:
              - Default warn-mode until 2026-06-13 (30 days post-merge).
              - Sunset flips default to strict-mode: missing
                <company>_drv.yaml causes hard-fail.
              - Per-company opt-in via `strict_mode: true` in yaml
                before sunset.
              - Pattern matches MP102 v1.3 `reviewed_by` legacy-format
                sunset window (legacy accepted to 2026-07-31, then
                mandatory structured form).

            (10.7) Two-axis framework, v1.3 restated:
              Quality axis Step 1 enforced at dashboard layer
                ([DEBUG_MODE_NULL_OUTPUT] scan + no_red_error_text).
              Quality axis Step 2 enforced at TWO layers:
                - Dashboard layer (v1.1): assert_kpi_card_value,
                  assert_datatable_meaningful_rows, etc.
                - DRV layer (v1.3 NEW): drv_output_shape_gate.R
                  against <company>_drv.yaml.
              Defense in depth: dashboard catches consumer-side
              regressions; DRV makes producer-side vacuous-pass
              impossible.

            (10.8) Why v1.3 amendment, not sibling MP166:
              v1.1 already framed Step 2 as quality axis applicable
              across layers. Dashboard was first instance; DRV is
              second. Same principle, different enforcement points.
              A sibling MP166 would have identical Step 2 vocabulary
              and high cross-reference density — strong signal of one
              principle at two enforcement points. MP102 evolved
              similarly (v1.0 → v1.3, each amendment adding rigor
              without splitting).

      Why this rule exists:

        - GitHub issue #599 (filed 2026-05-10 as meta-issue spawned
          from #595): user observed that #595 Phase A/B/C completed
          all of (a) app_config.yaml mode fix, (b) dbConnect
          fail-loud regression test suite, (c) preflight_deploy_check
          blocking config mismatches, (d) check_production_data
          HTTP smoke against deployed URL — yet the user could still
          locally reproduce QEF BrandEdge dashboard with no data
          when launching Rscript app.R from QEF_DESIGN/.
        - The Phase A/B/C verification chain was correct in narrow
          scope (deploy mode, db connection, HTTP availability) but
          missed the actual user-reported bug class — UI-layer
          rendering failure (3 distinct root causes in this case:
          hardcoded English empty-state, AI scoring data gap producing
          50/54 NA-attribute rows, and translate() non-vectorized
          triggering 'condition has length > 1' red error).
        - The implicit architectural commitment 'pipeline complete
          means dashboard-visible to the user' was missing. MP162
          covers this axis at per-bridge L4 level (at least one
          Shiny module renders > 0 rows), but per-dashboard-tab ×
          per-platform × per-product_line granularity needed by #595
          was finer. MP163 covers different axis (input-completeness).
          MP165 fills the gap.
        - MP165 codifies the commitment so future verification
          (human or AI) does not regress to acceptance-ladder
          claims that fail to verify the actual user-facing
          rendering presence.

    rule_formal: |
      RULE MP165_DASHBOARD_PRESENCE_PIPELINE_ACCEPTANCE:

      DEFINE compliant(p: pipeline) AS:
        gate_drv_end_lite(p) AND
        gate_deploy_gate_full(p) AND
        gate_ci_selective(p) AND
        gate_hard_fail_discipline(p)

      DEFINE gate_drv_end_lite(p) AS:
        exists target t in p.targets where
          t.id = "dashboard_smoke_lite"
          AND t.depends_on = all_5nm_layer_outputs(p)
          AND t.command launches headless_shiny(SHINY_DEBUG_MODE=TRUE)
          AND t.command walks all (active_platform, active_product_line) tuples
          AND t.command inspects .shiny-debug/shiny.log for
              [DEBUG_MODE_NULL_OUTPUT] markers
          AND for all NULL outputs detected:
                t.result = failed
                AND failure_message includes
                    (company, tab, platform, product_line, output_id)
          AND t.runtime_budget_seconds <= 30

      DEFINE gate_deploy_gate_full(p) AS:
        before(make_deploy_push, dashboard_presence_gate)
        AND dashboard_presence_gate loads
            shared/global_scripts/98_test/e2e/contracts/<company_lowercase>.yaml
        AND for all (active_platform, active_product_line) tuples:
              for all contracts c in tuple:
                evaluate c via contracts.R primitive
                AND if c.severity = "critical" AND c fails:
                  exit_status != 0
                  AND deploy_push refused
        AND runtime_budget_seconds <= 60

      DEFINE gate_ci_selective(p) AS:
        on pull_request:
          affected = affected_modules.R(git_diff(head, base))
          AND for all module m in affected:
                run dashboard_presence_gate(m)
          AND total_runtime_seconds <= 30 for typical 1-2 module PRs
          AND for shared_utility u in affected:
                affected ∪= reverse_dependencies(u)

      DEFINE gate_hard_fail_discipline(p) AS:
        for all opt_out_mechanisms o in p.contract_framework:
          o ∈ {drv_target_absent, per_contract_severity_warning}
          AND o ∉ {global_soft_warn_mode_toggle,
                    skip_contract_flag,
                    disable_contract_env_var}

      INVARIANT for all production pipelines p:
        compliant(p) holds at every state of the dashboard such that
        every (tab, platform, product_line) tuple in active company
        config renders contract-pass content under default state.

      ENFORCEMENT layers:
        - PR_review_level: introducing soft_warn_mode toggle or
                           skip_contract flag is an MP165 violation;
                           weak assertions like
                           assert_datatable_has_rows(min_rows=1)
                           without exclude_placeholders SHALL be
                           replaced with
                           assert_datatable_meaningful_rows(...)
        - process_level: every dashboard tab declared in per-company
                         contract YAML SHALL have at least one
                         per-element-type contract assertion;
                         contracts.R primitive coverage MUST include
