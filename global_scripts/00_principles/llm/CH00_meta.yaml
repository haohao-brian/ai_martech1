  - id: MP150
    type: meta_principle
    name: transparency_principle
    display_name: "Transparency Principle"
    one_liner: "Every operation, data movement, and state change must leave a visible trace"
    file_path: "CH00_fundamental_principles/03_development_methodology/MP150_transparency_principle.qmd"

    rule_natural: |
      The Transparency Principle: Nothing happens silently.
      Every significant operation must produce observable evidence:
      - Data movements are logged (DM_P007: Information Flow Transparency)
      - Console output is informative (DEV_P022: Console Output Transparency)
      - UI data acquisition is traced (UI_R024: Component Dataflow Logging)
      - Errors are explicit, never swallowed
      - State changes are announced

    rule_formal: |
      RULE MP150_TRANSPARENCY:
      FOR ALL operations O:
        IF is_significant(O)
        THEN has_observable_trace(O)
      CHILDREN:
        DM_P007: data_flow_transparency
        DEV_P022: console_output_transparency
      IMPLEMENTATIONS:
        UI_R024: ui_component_dataflow_logging

    violations:
      - "Silent execution with no log output"
      - "Hidden data transformations with no lineage"
      - "Error swallowed without message"
      - "State change with no announcement"
    compliant:
      - "Every data fetch logged with source, count, columns"
      - "Every ETL step shows progress and completion"
      - "Every error produces explicit message with context"

  - id: MP151
    type: meta_principle
    name: no_fallback_principle
    display_name: "No-Fallback Principle"
    one_liner: "Never mask failures with fallback logic"
    file_path: "CH00_fundamental_principles/03_development_methodology/MP151_no_fallback_principle.qmd"

    rule_natural: |
      Do not use fallback paths for core logic when an operation fails
      or an expected resource is missing. The system must fail fast
      with an explicit error and clear remediation instructions.
      Falling back to alternate behavior hides defects and creates
      non-deterministic outcomes.

    rule_formal: |
      RULE MP151_NO_FALLBACK:
      FOR ALL core_operations O:
        IF precondition_not_met(O)
        THEN stop_with_error(O, remediation_message)
        NEVER return_default_value(O)
      SCOPE: initialization, config loading, data access, transformation
      STRICTNESS: binary (no exceptions for core workflows)

    violations:
      - "tryCatch returning empty tibble on data load failure"
      - "if-else returning default config when file missing"
      - "Silent fallback to 'all' when product_line_id is NULL"
      - "Partial batch edits continuing after step failure"
    compliant:
      - "stop() with explicit message when config file missing"
      - "Validation at entry point, fail before processing"
      - "Unit tests asserting errors for invalid preconditions"

  - id: MP152
    type: meta_principle
    name: breaking_version_principle
    display_name: "Breaking Version Principle"
    one_liner: "Major version upgrades must be explicit migrations, not implicit compatibility"
    file_path: "CH00_fundamental_principles/03_development_methodology/MP152_breaking_version_principle.qmd"

    rule_natural: |
      A new version release must define a single expected contract,
      and legacy behavior must not be silently tolerated. When
      compatibility is intentionally broken, migration must be explicit:
      inputs, configuration, and execution entry points are upgraded
      through documented migration steps before the new version is executed.

    rule_formal: |
      RULE MP152_BREAKING_VERSION:
      FOR ALL version_upgrades V:
        IF breaks_compatibility(V)
        THEN requires_explicit_migration(V)
        AND no_hidden_legacy_branches(V.new_version)
        AND migration_is_checkable(V)
      SCOPE: configs, schemas, API contracts, deployment entry files

    violations:
      - "v2 code silently falling back to v1 config format"
      - "Legacy compatibility branches without deprecation plan"
      - "Partial patching to keep old and new versions running together"
    compliant:
      - "Migration gate: stop if v2 config missing, suggest migration command"
      - "Versioned, idempotent migration artifacts"
      - "Post-migration verification with failure-injection checks"

  - id: MP153
    type: meta_principle
    name: data_type_presentation_fidelity
    display_name: "Data Type Presentation Fidelity"
    one_liner: "Present data in formats that match the semantic type of the underlying values"
    file_path: "CH00_fundamental_principles/01_general_principles/MP153_data_type_presentation_fidelity.qmd"

    rule_natural: |
      Every data value has a semantic type (integer count, percentage, currency,
      date, ratio, etc.) that dictates how it should be displayed. The presentation
      format must match the semantic type, not the storage type or the default
      rendering of the UI framework.

      When data flows through ETL, derivation, and UI layers, its storage type
      may change (e.g., an integer count stored as DOUBLE in DuckDB). The UI layer
      must explicitly format values according to their semantic type to prevent
      misleading displays (e.g., purchase count "3.0" instead of "3").

    rule_formal: |
      RULE MP153_DATA_TYPE_FIDELITY:
      FOR ALL displayed_value V in UI:
        semantic_type(V) DETERMINES format_function(V)
        format_function(V) MUST be explicitly applied before rendering
        default_rendering(V) is INSUFFICIENT
      EXAMPLES:
        integer_count → as.integer() or format(digits=0)
        currency → scales::dollar() or formatC(digits=2)
        percentage → scales::percent()
        ratio_score → round(x, 2)

    violations:
      - "Purchase count displayed as '3.0' due to DuckDB DOUBLE promotion"
      - "Customer count showing decimal points in KPI cards"
      - "Relying on default DT rendering without explicit column formatting"
    compliant:
      - "as.integer(f_value) before rendering in bs4ValueBox"
      - "scales::dollar(revenue) for currency values"
      - "scales::percent(rate, accuracy=0.1) for percentages"

  - id: MP154
    type: meta_principle
    name: side_effect_defense
    display_name: "Side Effect Defense"
    one_liner: "Operations must not silently alter the semantic meaning of data"
    file_path: "CH00_fundamental_principles/03_development_methodology/MP154_side_effect_defense.qmd"

    rule_natural: |
      Any operation that transforms data must not silently change the semantic
      meaning of existing values. When a transformation cannot fully resolve,
      the failure must be visible — either through an explicit sentinel value,
      an error, or a warning — never through silent data corruption.

      Never silently replace valid data with NA or NULL. Preserve semantic
      consistency of columns (an ID column must contain IDs, not a mix of IDs
      and raw names). Warn loudly on partial failure with actionable detail.
      Prefer crashing over silent corruption.

    rule_formal: |
      RULE MP154_SIDE_EFFECT_DEFENSE:
      FOR ALL transformation operations T on data D:
        IF T(value) cannot fully resolve:
          result := sentinel_value OR stop(error_message)
          warning(actionable_detail) MUST be emitted
        NEVER:
          result := NA  # silent data loss
          result := semantically_inconsistent_value
      COROLLARY:
        stop() is PREFERRED over silent corruption

    violations:
      - "Mapping failure silently produces NA, dropping rows in downstream joins"
      - "Type coercion returns NA without warning"
      - "Missing config key returns NULL, causing silent degraded behavior"
    compliant:
      - "Assign 'UNKNOWN' sentinel + warning() with original values listed"
      - "stop('Missing required config: ...') on absent key"
      - "tryCatch with message() logging failure reason, not silently continuing"

    siblings:
      - "MP163"     # Architectural escalation pair (added 2026-04-30 per #505): MP154 is the field-level rule; MP163 is the system-wide consequence — when MP154 is followed at every mapping site, the pipeline becomes always-runnable, gaps become visible, coverage becomes incremental

  - id: MP155
    type: meta_principle
    name: minimize_human_input
    display_name: "Minimize Human Input"
    one_liner: "資料欄位先回答 4 問判定 input/view/action surface, 預設系統 derive, 人類補卡住的"
    file_path: "CH00_fundamental_principles/04_data_management/MP155_minimize_human_input.qmd"

    rule_natural: |
      Any data field that requires human input must first prove it cannot be
      derived from existing system sources, or that derivation cannot be trusted.
      If derivable, the system derives by default; the human role is reduced to
      "review + override" rather than "first input".

      Designers must answer 4 sequential questions before adding a field:
        Q1: Where is the authoritative source? (system / human / both)
        Q2: What is the cost of being wrong? (KPI impact / cosmetic)
        Q3: Can the system detect anomalies? (yes / no)
        Q4: Can humans override? (yes / no)

      Each field is classified into exactly one of three categories:
        - System-Sourced: system decides, no human input required
        - Human-Decided: only humans know, mandatory manual entry
        - System-Suggested: system proposes, humans confirm via review

      Designs must separate three surfaces:
        - Input surface (who writes, where)
        - View surface (who reads, what)
        - Action surface (who triggers state change)

      Action operations should be implemented as input mutations (補資料 to
      input surface), not as standalone UI actions. View surfaces must be
      view-only and refresh automatically (pull-based); push notifications
      are reserved for critical alerts only.

    rule_formal: |
      RULE MP155_MINIMIZE_HUMAN_INPUT:
      FOR ALL data fields F in any system design:
        category(F) := classify_via_4_question_framework(F)
          where Q1 -> Q2 OR Q3 -> Q4 -> {System-Sourced, Human-Decided, System-Suggested}

        REQUIRE: input_surface(F) is NOT NULL
        REQUIRE: view_surface(F) is NOT NULL
        REQUIRE: action_surface(F) MUST be implemented as input_surface mutation
                 EXCEPT critical_alert(F) IS true

        REQUIRE: view_surface(F).edit_permission == FALSE
        REQUIRE: view_surface(F).refresh == auto_pull (push only IF critical_alert)

      COROLLARY:
        IF category(F) == System-Sourced THEN human_input(F) MUST be FALSE
        IF category(F) == System-Suggested THEN review_mechanism(F) MUST exist
        IF category(F) == Human-Decided THEN audit_validation(F) SHOULD exist

    violations:
      - "Putting system-knowable fields (sku, asin, product_name) in Gsheet for manual entry"
      - "Hardcoding human-only fields in code (e.g., cost = sales * 0.4 fake derivation)"
      - "System-Suggested field silently overrides human input without review surface"
      - "View surface granted edit permission, allowing business to mutate without affecting SoT"
      - "Push notification sent every ETL cycle regardless of urgency, causing notification fatigue"

    compliant:
      - "ETL derives sku/asin from sales table; Gsheet only contains Human-Decided fields"
      - "Cost field marked Human-Decided + audit warning when cost <= 0 or cost > sales * 1.5"
      - "Brand fuzzy-match results pushed to Status Gsheet review queue, not auto-applied"
      - "Status Gsheet shared as anyone-with-link VIEW-ONLY, auto-refreshed by ETL writeback"
      - "Approval flow = business adds row to Master Gsheet (input mutation), not approve button"

    siblings:
      - "MP163"     # Pipeline-tolerance corollary (added 2026-04-30 per #505): MP155 minimizes which fields humans must fill; MP163 ensures pipeline runs while humans are filling them

  - id: MP156
    type: meta_principle
    name: two_tier_normativity
    display_name: "Two-Tier Normativity"
    one_liner: "Tier-1 conceptual rules (00_principles/*.qmd) and Tier-2 implementation specs (yaml/csv/SQL configs in code chapters) are both normative; principles SHALL bind their tier-2 files via binds: + Files Bound + Change Discipline"
    file_path: "CH00_fundamental_principles/04_data_management/MP156_two_tier_normativity.qmd"

    rule_natural: |
      The codebase has two distinct levels of normativity that must be explicitly
      recognized and disciplined:

        Tier 1 — Conceptual Normativity:
          Location: 00_principles/docs/.../*.qmd
          Form: Meta-Principles, Principles, Rules
          Content: thinking rules ("how to think / how to design")
          Maintenance: DOC_R009 三層同步, principle revision discipline

        Tier 2 — Implementation Normativity:
          Location: chapter sub-dirs (e.g., 30_global_data/parameters/, 01_db/raw_schema/)
          Form: yaml / csv / SQL DDL configs
          Content: contract rules (specific schemas, paths, mapping tables)
          Maintenance: bound by Tier-1 principle's Change Discipline

      Every Tier-2 file SHALL be bound by exactly one primary Tier-1 principle
      via a three-part mechanism:
        (a) Frontmatter `binds:` field listing absolute file paths
        (b) Body `## Files Bound by This Principle` section describing each role
        (c) Body `## Change Discipline` section specifying mandatory sync actions
            (DOC_R009 triple-layer sync, IC_P002 cross-company verification, commit
            message conventions)

      Tier-2 files are classified into three categories with different binding-
      discipline strength:
        Category A: Canonical Schema Contracts (ETL output / DB table schemas)
          - Strong binding: DOC_R009 + IC_P002 required
          - Examples: core_schemas.yaml, schema_registry.yaml, transformed_schemas.yaml
        Category B: Canonical Path Registries (file paths, DB locations, API endpoints)
          - Strong binding: DOC_R009 + IC_P002 required
          - Examples: db_paths.yaml, api_registry.yaml
        Category C: Authoring Dictionaries (translations, prompts, alias mappings)
          - Medium binding: DOC_R009 only if principle changes; per-co customization OK
          - Examples: chinese_labels.yaml, brand_aliases.yaml, ai_prompts.yaml

      Both tiers are normative — the difference is abstraction level, not enforcement
      strength. AI agents and reviewers must consult the binding principle's Change
      Discipline before merging any Tier-2 file modification.

    rule_formal: |
      RULE MP156_TWO_TIER_NORMATIVITY:
      FOR ALL files F in codebase:
        tier(F) := classify({Tier-1, Tier-2, Non-normative})
          where Tier-1 IFF F matches "00_principles/docs/.../*.qmd"
          where Tier-2 IFF F is yaml/csv/SQL contract in code chapter binding system behavior
          where Non-normative OTHERWISE

        IF tier(F) == Tier-2 THEN
          REQUIRE: EXISTS principle P such that F ∈ P.binds
          REQUIRE: P contains "## Files Bound by This Principle" section listing F
          REQUIRE: P contains "## Change Discipline" section specifying sync actions

        category(F) := classify({A, B, C}) for Tier-2 files
          where A := Canonical Schema Contract
          where B := Canonical Path Registry
          where C := Authoring Dictionary

        FOR ALL changes Δ to F where tier(F) == Tier-2:
          IF category(F) ∈ {A, B} THEN
            REQUIRE: Δ.commit_message contains "Verified: ... across N companies"
            REQUIRE: DOC_R009 triple-layer sync triggered for binding principle
            REQUIRE: IC_P002 cross-company verification performed
          IF category(F) == C THEN
            REQUIRE: Δ.commit_message contains "Refs <binding-principle>"
            DOC_R009 triggered IFF binding principle itself changes

      COROLLARY:
        Existing Tier-2 files with weak/missing binding are inventoried in MP156.qmd
        and SHOULD be upgraded to strong binding via follow-up changes.

    violations:
      - "Tier-2 file changed without invoking binding principle's Change Discipline (e.g., core_schemas.yaml modified without DOC_R009 sync against MP102)"
      - "Tier-1 principle does not explicit pin Tier-2 filename (e.g., MP102 references 'schema registry pattern' but lacks `binds: core_schemas.yaml`)"
      - "Tier-2 file lives in `00_principles/docs/.../etl_schemas/` so production code does not import it, leaving spec advisory-only"
      - "Tier-2 file has multiple concept-level references but no primary binding marked, so reviewer cannot determine which Change Discipline to follow"
      - "PreToolUse hook over-blocks legitimate yaml edits (typo fix, comment addition) by requiring full Change Discipline regardless of change type"

    compliant:
      - "DM_R062 frontmatter contains `binds: [shared/.../db_paths.yaml]` and body has `## Change Discipline` section requiring IC_P002 for path additions"
      - "MP102 (after #489 amendment) explicitly binds core_schemas.yaml + schema_registry.yaml + platform_extensions/*.yaml with strong Change Discipline"
      - "product_master_fields.yaml has primary binding MP155 with cross-references to MP102 + MP154 noted in MP155 body Relationships section (single primary, multi cross-ref)"
      - "Category C dictionary changes (chinese_labels.yaml typo fix) commit with `Refs DEV_R052` trailer; no IC_P002 required"
      - "New Tier-2 file creation blocked until binding principle written first (Q3 in Decision Framework)"

  - id: MP157
    type: meta_principle
    name: two_layer_yaml_authoring
    display_name: "Two-Layer YAML Authoring"
    one_liner: "Schema authoring SHALL split into universal canonical schema yaml (Layer 1) + per-instance bridge yaml (Layer 2); neither layer absorbs the other's responsibilities; only Layer 1 participates in DDL codegen"
    file_path: "CH00_fundamental_principles/04_data_management/MP157_two_layer_yaml_authoring.qmd"
    version: "1.0"
    date_created: "2026-04-28"

    rule_natural: |
      Schema authoring uses two distinct yaml layers with non-overlapping ownership:

        Layer 1 — Canonical Schema (universal contract):
          Location: 01_db/raw_schema/_authoring/core_schemas.yaml + platform_extensions/*.yaml
          Owns: required field set, types, pattern constraints, aliases (column-name
                synonyms), sentinel values, coercion rules, universal validation rules
          Bound by: MP102 as MP156 Category A — Schema Contract
          Participates in: DDL codegen (_build.R produces _generated/*.sql)

        Layer 2 — Bridge Yaml (per-instance translation):
          Location: 01_db/raw_schema/_authoring/bridges/{COMPANY}/{platform}/{source}.bridge.yaml
          Owns: prerawdata_source identity (company/platform/source_uri/sheet_name),
                column_mapping, value_map (translates VALUES not just names),
                use_value (per-co constants), pre_filter (per-source row exclusion),
                schema_fingerprint (sha256 drift detection), reviewed_by accountability,
                ignored_columns documentation
          Bound by: MP102 as MP156 Category A (each bridge yaml itself becomes Tier-2 spec)
          Participates in: NOT DDL codegen — consumed at runtime by fn_glue_bridge

      Six structural reasons two layers are mandatory (not just naming-driven):
        1. Source identity has no home in universal contract
        2. Value translation (value_map) ≠ name translation (aliases)
        3. Per-company constants (use_value) belong with per-company config
        4. Pre-mapping data filter is per-source
        5. Drift fingerprint is per-source
        6. Reviewer accountability differs (MP102 Change Discipline vs reviewed_by guard)

      DDL codegen invariant: _build.R reads ONLY Layer 1. If Layer 2 is ever needed
      for codegen, the principle is violated — the field in question belongs in
      Layer 1.

      LLM consumption pattern: per-task work (write a new bridge, answer "how does
      QEF map ASIN") prefers Layer 2 — bounded context, single-file lookup. Universal
      questions ("what is ASIN format") prefer Layer 1. Architectural overview
      benefits from reading this principle plus glue-bridge-onboarding handbook.

      Decision rule when authoring: ask "would this fact change if I substituted
      any of the 5 consuming companies?" Yes → Layer 2 (bridge). No → Layer 1 (schema).

    rule_formal: |
      RULE MP157_TWO_LAYER_YAML:
      schema_authoring is partitioned into:
        Layer 1: canonical_schema_yaml (universal contract)
        Layer 2: bridge_yaml             (per-instance translation)

      ownership_invariants:
        Layer 1 owns:
          required_fields, types, patterns, aliases (column names),
          sentinels, coercion_rules, universal_validation
        Layer 2 owns:
          prerawdata_source_identity, column_mapping, value_map (column values),
          use_value, pre_filter, schema_fingerprint, reviewed_by, ignored_columns

      structural_invariants:
        Layer 2 MUST NOT redefine canonical types, patterns, or required-status
        Layer 1 MUST NOT contain per-instance metadata (URIs, sheet names, fingerprints)
        DDL codegen reads ONLY Layer 1
        Bridge yaml validates row data against Layer 1 contract (DDL CHECK enforces at insert)

      decision_rule(fact F):
        IF F.would_change_per_company → Layer 2
        ELSE → Layer 1

    violations:
      - "Layer 1 (core_schemas.yaml) contains per-company conditional fields (e.g., qef_value_when_missing) — DDL codegen cannot produce one CHECK constraint that varies by company"
      - "Layer 2 (bridge yaml) tries to redefine field type or required-status of a canonical field — bridge claiming authority over canonical contract"
      - "Layer 1 contains per-instance metadata like source URIs or sheet names — universal contract polluted with per-company URLs"
      - "Layer 2 introduces a new canonical field via column_mapping that the canonical schema doesn't include — INSERT fails at DDL engine"
      - "Skipping bridge yaml for the first company because 'we only have one company' — when company N=2 arrives, integration code rewritten from scratch"

    compliant:
      - "core_schemas.yaml#sales.required_fields.product_id has type=VARCHAR + pattern=^[A-Za-z0-9._-]+$ + aliases=[asin, ASIN, sku, ...] (Layer 1 universal) — same contract for QEF, MAMBA, D_RACING, WISER, kitchenMAMA"
      - "bridges/QEF_DESIGN/amz/sales.bridge.yaml has prerawdata_source.source_type=xlsx + value_map for fulfillment-channel + use_value=ATVPDKIKX0DER for amz_marketplace_id (Layer 2 per-instance) — facts that would change if substituted by another company"
      - "_build.R reads only _authoring/core_schemas.yaml + platform_extensions/*.yaml; never opens any bridge yaml — DDL codegen invariant preserved"
      - "Phase 5 PoC (#489 d5c36b2): adding three new primitives (use_value / value_map / pre_filter) all landed in bridge yaml schema, none in canonical schema — correct ownership choice"

    dependencies:
      - "MP102"  # Both yaml layers are MP102 bound Tier-2 specs
      - "MP156"  # Two-Tier Normativity binding mechanism for both layers
      - "MP155"  # Bridge column_mapping declares input surface per MP155 4-question framework
      - "MP154"  # Bridge value_map + schema fallback together produce sentinel-safe outcomes
      - "MP064"  # ETL/DRV separation context
      - "DM_R064"  # Column lookup by name + alias only

  - id: MP158
    type: meta_principle
    name: glue_driven_raw_extensibility
    display_name: "Glue-Driven Raw Layer Extensibility"
    one_liner: "New canonical raw tables SHALL be added by composing yaml-driven steps (schema enrichment + DDL codegen + per-company bridge yamls), never by writing per-table custom ETL R code; architecture supports indefinite growth without per-addition engineering effort scaling"
    file_path: "CH00_fundamental_principles/04_data_management/MP158_glue_driven_raw_extensibility.qmd"
    version: "1.0"
    date_created: "2026-04-28"

    rule_natural: |
      Adding a new canonical raw table follows a fixed 3-step composition pattern:

        Step 1 — Layer 1 (Canonical Schema):
          Edit 01_db/raw_schema/_authoring/core_schemas.yaml + platform_extensions/*.yaml
          Add a new datatype section OR enrich existing
          Cross-co verify (IC_P002): does this datatype apply to ≥ 2 companies?

        Step 2 — DDL Codegen:
          Run: Rscript shared/global_scripts/01_db/raw_schema/_build.R
          Produces _generated/core/{datatype}.sql + _generated/platforms/{p}/{datatype}.sql
          Commit the generated SQL artifacts (codegen output is git-tracked)
          Reproducibility test: rerun against unchanged _authoring/ → byte-identical

        Step 3 — Layer 2 (Bridge YAML per company × source):
          For each (company, platform, source) tuple:
            Write or generate (via /glue-bridge skill) one bridge yaml at:
            01_db/raw_schema/_authoring/bridges/{COMPANY}/{platform}/{source}.bridge.yaml
            Run via fn_glue_bridge() — populates df_{platform}_{datatype}___raw

      No new ETL *_0IM.R script. No new arbitration logic. No new resolver function.

      Three growth axes all served by the same 3-step pattern:
        Axis 1 — New datatype: Steps 1+2+3, e.g. add `warranty:` to core_schemas.yaml
        Axis 2 — New platform: Steps 1+2+3, e.g. add tkk_extensions.yaml
        Axis 3 — New company: ONLY Step 3 — canonical schema is already universal,
                              codegen output is already universal, only bridge yamls
                              per the new company's sources are needed

      The Axis 3 asymmetry is intentional: company-level growth is pure Layer 2 work.
      Adding the 6th, 7th, ... 20th consuming company costs only Step 3 per company.

      Operational cost is bounded — bridge yamls are O(50-200 lines), schema edits
      are O(10-30 lines), codegen is automated, drift detection is automated. The
      pre-#489 cost-per-addition was unbounded — each new ETL script could grow to
      thousands of lines and accrete per-company quirks.

      Five constraints that the extensibility does NOT permit:
        1. New bound files inherit MP102 + MP156 obligations (not free actions)
        2. MP157 anti-patterns still apply during growth (no per-co conditionals
           in canonical schema)
        3. DDL codegen reproducibility is non-negotiable
        4. Canonical naming `df_{platform}_{datatype}___raw` is invariant (DM_R028)
        5. Drift detection (schema_fingerprint) MUST be wired for every bridge

      Decision rule: when growing the system, ask "would I be willing to repeat
      this work for the 6th, 7th, 12th company?" Yes → following MP158.
      No → probably writing custom code that should have been a bridge yaml.

    rule_formal: |
      RULE MP158_GLUE_DRIVEN_EXTENSIBILITY:
      growth_action(new_datatype | new_platform | new_company) is decomposed:

        Step1_schema_yaml(target ∈ {core_schemas.yaml, platform_extensions/*.yaml})
          IF axis ∈ {datatype, platform} → required edit
          IF axis == company             → SKIP (canonical schema universal)

        Step2_ddl_codegen()
          Rscript _build.R
          REQUIRE: byte-identical re-run against unchanged _authoring/
          IF axis ∈ {datatype, platform} → produces new _generated/*.sql
          IF axis == company             → SKIP (codegen output universal)

        Step3_bridge_yamls(per company × platform × source)
          REQUIRE: bridges/{COMPANY}/{platform}/{source}.bridge.yaml
          REQUIRE: prerawdata_source.schema_fingerprint computed against ACTUAL source
          REQUIRE: reviewed_by = real_human_identifier (not "AI" / "TBD")
          REQUIRE: column_mapping covers all canonical required fields

      forbidden_during_growth:
        - per_company_conditional_fields_in_layer1
        - hand_written_ETL_R_script_for_new_table
        - bridge_yaml_with_fabricated_or_missing_fingerprint
        - new_table_naming_outside_df_{platform}_{datatype}___raw_pattern
        - non_deterministic_codegen (Sys.time / machine-specific paths)

      Cost(growth) = O(yaml_lines), NOT O(R_script_lines)

    violations:
      - "Adding a new datatype via custom R code (`amz_ETL_warranty_0IM.R`) instead of yaml-driven 3-step pattern — skips Step 1 (no canonical contract) and Step 2 (no DDL codegen)"
      - "Per-company schema yaml fork (e.g., `qef_specific_schemas.yaml` with company-prefix fields) — defeats Axis 3 (new company) being cheap"
      - "Skipping DDL codegen and writing CREATE TABLE by hand — hand-written DDL drifts from yaml schema; reproducibility test fails"
      - "Bridge yaml committed with `schema_fingerprint.value: TODO` or copied from another bridge — silently disables drift detection for that source"
      - "Treating bridge yaml as throw-away migration script (skipping reviewed_by accountability or fingerprint or ignored_columns documentation) — bridges are permanent runtime config bound by MP102, not migration scripts"

    compliant:
      - "#489 Phase 1-5 itself: 5 datatypes (sales/customers/orders/products/reviews) × 5 platforms with extensions × 1 first PoC bridge — entirely yaml-driven, no per-table R code beyond fn_glue_bridge interpreter"
      - "qef-product-master-redesign Phase 9 task 9.4 + 9.5: 13 bridges generated via /glue-bridge skill, all targeting same canonical `df_amz_products___raw`, no new R ETL script written"
      - "Hypothetical future: 6th company onboarding requires only writing bridges per source — schema and codegen unchanged"
      - "ARCH tracker #491 Task A: per-co bridge rollout (MAMBA / D_RACING / WISER / kitchenMAMA) is exactly Axis 3 growth, scheduled as Step 3 work only"

    dependencies:
      - "MP102"  # Step 1+2 happen against MP102 bound files
      - "MP157"  # Static layering this principle composes for growth
      - "MP156"  # New yamls added during growth become Tier-2 normative
      - "MP155"  # Bridge column_mapping during Step 3 follows MP155 input surface
      - "MP064"  # Growth happens at raw layer, not DRV
      - "DM_R028"  # Canonical naming `df_{platform}_{datatype}___raw` invariant during growth
      - "DOC_R009"  # Schema changes during Step 1 trigger triple-layer sync

  - id: MP159
    type: meta_principle
    name: glue_authoring_boundary_immutability
    display_name: "Glue Authoring Boundary Immutability"
    one_liner: "Bridge yaml authoring sessions SHALL NOT modify Layer 1 canonical schema files (core_schemas.yaml + platform_extensions/*.yaml); un-mappable parts of a prerawdata source MUST be recorded inside the bridge yaml using ignored_columns / apply_fallback / value_map / pre_filter / from_columns+merge_strategy primitives. Layer 1 changes only happen through dedicated Layer 1 refactor tasks, never as a side-effect of bridge authoring."
    file_path: "CH00_fundamental_principles/04_data_management/MP159_glue_authoring_boundary_immutability.qmd"
    version: "1.0"
    date_created: "2026-04-28"

    rule_natural: |
      A bridge authoring session is any task whose stated intent is to write or
      update a bridges/{COMPANY}/{platform}/{source}.bridge.yaml file (including
      invocations of the /glue-bridge skill). During such a session, Layer 1
      schema files are immutable.

      The decision rule when an un-mappable situation arises:

        "Is this fact per-source (this company / platform / file format)
         or universal (all 5 companies / all platforms of this datatype)?"

        Per-source   → goes in bridge yaml (Layer 2)
        Universal    → abort the bridge session, propose a Layer 1 change spec

      The discriminator is task intent, not the file path. A task explicitly
      described as "Layer 1 refactor" (e.g., qef-product-master-redesign 9.1
      thin-master refactor) is a dedicated Layer 1 task and is fully legitimate.
      MP159 applies only to bridge-authoring tasks where Layer 1 edits would be
      a side-effect.

      Five canonical anti-patterns:
        A. Source has unexpected column → DON'T add field to canonical schema;
           list it in bridge.ignored_columns
        B. Source missing canonical required field → DON'T relax required:true
           in canonical schema; use bridge.apply_fallback or bridge.use_value
        C. Source uses unusual encoding → DON'T add per-language strings to
           canonical coercion.rule; use bridge.value_map (Layer 2 translation)
        D. Source has multiple columns for one canonical field → DON'T add
           more aliases in canonical schema; use bridge.from_columns +
           merge_strategy (DM_R065)
        E. Cosmetic Layer 1 edit during bridge authoring → file a separate
           commit; do NOT pollute the bridge-authoring commit's diff

      Three reasons this rule matters:
        1. IC_P002 cross-company verification depends on Layer 1 changes going
           through dedicated paths with verified trailers; bridge-authoring
           commits silently bypass this if Layer 1 edits leak in
        2. MP158 axis-3 (new company) bounded-cost guarantee depends on
           Layer 1 stability; if company-N bridge author can edit Layer 1,
           companies 1..N-1 silently inherit the change
        3. fn_glue_bridge.R runtime determinism (LLM_CODEGEN_TIME_ONLY guard,
           audit-grep tested at #489 Phase 4) assumes canonical schema is
           the same at runtime as at bridge-authoring time

    rule_formal: |
      RULE MP159_GLUE_AUTHORING_BOUNDARY_IMMUTABILITY:

      DEFINE bridge_authoring_session AS:
        task whose stated intent ∈ {
          "write bridge yaml",
          "update bridge yaml",
          invocation of /glue-bridge skill,
          invocation of validate_bridge_yaml.R authoring loop
        }

      DEFINE layer1_files AS:
        - 01_db/raw_schema/_authoring/core_schemas.yaml
        - 01_db/raw_schema/_authoring/platform_extensions/*.yaml

      DEFINE layer2_files AS:
        - 01_db/raw_schema/_authoring/bridges/{COMPANY}/{platform}/{source}.bridge.yaml

      INVARIANT during bridge_authoring_session:
        FORALL f ∈ layer1_files: NOT mutated(f)
        EXISTS exactly_one b ∈ layer2_files: mutated(b) -- the target bridge

      LEGITIMATE Layer 1 change paths (NOT MP159 violations):
        - dedicated_layer1_refactor_task (task intent explicitly states Layer 1)
        - MP158_axis1_step1 (adding new datatype to canonical)
        - MP158_axis2_step1 (adding new platform extensions)
        - bridge_yaml_regeneration_after_layer1_changes (follow-up after a
          legitimate Layer 1 change has landed)

      ENFORCEMENT layers:
        - skill_level: glue-bridge SKILL.md Step 0 immutability preflight
        - validator_level: validate_bridge_yaml.R checks every column_mapping
                           reference exists in current canonical schema
        - runtime_level: fn_glue_bridge.R refuses bridges whose declared
                         canonical fields don't match table DDL

    violations:
      - "Bridge author finds source has internal-tracking-id column and adds tracking_id field to canonical sales datatype to absorb it (anti-pattern A) — should list in bridge.ignored_columns instead"
      - "Bridge author finds source omits unit_price and changes unit_price.required: true to false in core_schemas.yaml (anti-pattern B) — should use bridge.apply_fallback instead"
      - "Bridge author adds Chinese strings 標竿產品 / 競爭對手 directly to is_own_product.coercion.rule in canonical schema (anti-pattern C) — per-language value translation belongs in bridge.value_map"
      - "Bridge author with email_primary + email_legacy source columns adds email_primary as new alias in core_schemas.yaml (anti-pattern D) — should use bridge.from_columns + merge_strategy per DM_R065"
      - "Bridge-authoring commit's diff includes a typo fix in core_schemas.yaml description_zh (anti-pattern E) — even cosmetic Layer 1 edits violate MP159 because IC_P002 verification was not triggered and reviewers approving the bridge are not auditing Layer 1"

    compliant:
      - "qef-product-master-redesign Phase 9 task 9.1 (thin master refactor) edits core_schemas.yaml — legitimate because task intent is Layer 1 work; commit has Verified: cross-co trailer"
      - "qef-product-master-redesign Phase 9 task 9.6 (17 attribute bridges) edits ONLY bridges/QEF_DESIGN/amz/product_attributes_*.bridge.yaml — Layer 1 untouched"
      - "QEF amz sales PoC bridge handles cancelled-order exclusion via pre_filter (per-source data-quality filter) instead of changing canonical sales schema's required-field rules"
      - "QEF amz sales PoC bridge translates Amazon/Merchant -> AFN/MFN via bridge.value_map instead of adding string aliases to canonical schema"

    dependencies:
      - "MP157"  # Layer 1 immutability is MP157's implicit precondition; MP159 makes it explicit
      - "MP158"  # Axis-3 bounded-cost guarantee depends on this principle
      - "MP156"  # Tier-2 binding-discipline requires structured Layer 1 changes
      - "MP102"  # The schema files this principle protects
      - "IC_P002"  # Cross-company verification cost MP159 prevents from being silently skipped
      - "DM_R065"  # The Layer 2 dedup primitives MP159 directs un-mappable parts toward
      - "DOC_R009"  # Triple-layer sync (this principle requires its own DOC_R009 sync)

  - id: MP160
    type: meta_principle
    name: ai_schema_bridge_authoring_completeness
    display_name: "AI Schema/Bridge Authoring Completeness"
    one_liner: "When AI authors structured artifacts that have an enumerable element set (schema yaml field lists, bridge yaml column_mapping/ignored_columns/value_map, datatype declarations), the AI SHALL enumerate the set in full at authoring time. Partial-completion patterns (empty optional_fields with TODO, N-of-M completion intending to do the rest later, ignored_columns shorter than the un-mapped source set) are forbidden."
    file_path: "CH00_fundamental_principles/03_development_methodology/MP160_ai_schema_bridge_authoring_completeness.qmd"
    version: "1.0"
    date_created: "2026-04-28"

    rule_natural: |
      A "partial-completion pattern" is any of:
        - optional_fields: blocks left empty or marked "TODO" / "TBD" / "scaffold for later"
        - completing N-of-M items with intent to do the remaining M-N later
        - full content for one company / platform / datatype with "# TODO: replicate" for the rest
        - ignored_columns: lists shorter than (source columns) - (column_mapping covered)
          without explicit per-omission justification

      Decision rule before submitting an enumerable artifact:

        Q1. Are all known elements of the enumerable set listed?     -> YES
        Q2. For each per-PL / per-platform / per-datatype variant,
            is the enumeration done for every variant?                -> YES
        Q3. Is set(column_mapping.keys) ∪ set(ignored_columns)
            exactly equal to the source's column set?                 -> YES
        Q4. Does each optional_fields entry have type + description?  -> YES

      If any answer is NO, the artifact is not ready to submit.

      Three reasons this rule matters:
        1. AI authoring time is cheap; downstream rework cost is high. AI
           does not have human cognitive fatigue, so the marginal cost of
           "do the remaining 11 PLs while the schema is paged in" is minutes,
           while revisiting the artifact later costs hours.
        2. Partial scaffolding hides uncertainty behind valid syntax. An empty
           optional_fields: passes the meta-schema validator but tells
           downstream readers nothing about what fields the source has —
           and the missing fields look like they justify Layer 1 edits when
           really they were just deferred at authoring time.
        3. /spectra-propose Step 6 already enforces this for spectra artifacts
           ("No Placeholders" check). MP160 elevates the rule from
           skill-internal to principle-system normative so it applies to
           ALL AI schema authoring, not just spectra-driven changes.

      Architectural context:
        MP157 says WHERE content goes (Layer 1 vs Layer 2)
        MP158 says WHEN to extend the raw layer (3-step combinator)
        MP159 says WHAT stays immutable during bridge authoring
        MP160 says HOW COMPLETELY each artifact must be authored when
              AI is the author

      Without MP160, the prior three principles allow a half-finished
      artifact whose validator-passing structure hides authoring debt.

    rule_formal: |
      RULE MP160_AI_SCHEMA_BRIDGE_AUTHORING_COMPLETENESS:

      DEFINE enumerable_artifact AS:
        - schema_yaml.required_fields
        - schema_yaml.optional_fields
        - schema_yaml.aliases (per field)
        - bridge_yaml.column_mapping
        - bridge_yaml.ignored_columns
        - bridge_yaml.value_map (per mapped field)
        - datatype declarations under platform_extensions/

      DEFINE ai_authoring_session AS:
        author = AI agent (Claude / GPT / similar)
        artifact ∈ enumerable_artifact

      INVARIANT for every ai_authoring_session:
        FORALL bridge: set(source_columns(bridge)) ===
                       set(bridge.column_mapping.keys) ∪
                       set(bridge.ignored_columns)
        FORALL schema: optional_fields.length > 0 IFF
                       source has columns beyond required_fields
        FORALL optional_fields[i]: has(type) AND has(description)

      EXEMPTIONS (NOT MP160 violations):
        - genuinely_unknown_runtime_types: field whose source type cannot
          be determined until runtime (must still be enumerated, with
          notes: explaining the dynamism)
        - wip_subdirectory: bridges in bridges/{COMPANY}/wip/ may be
          partial (NOT consumed by runtime)
        - newly_discovered_post_merge_columns: updating bridge after
          source schema gains new columns is follow-up, not violation
          of original author

      ENFORCEMENT layers:
        - skill_level: glue-bridge SKILL.md Step 6 mandates exhaustive
                       enumeration; spectra-propose Step 6 No-Placeholders
                       check covers spectra artifacts
        - validator_level: validate_bridge_yaml.R
                           check_mp160_exhaustive_enumeration() reports
                           CRITICAL when set equality fails;
                           skip rule for /wip/ path segment
        - process_level: PRs/spectra changes touching MP160-bound files
                         SHALL include passing validator run OR explicit
                         wip/ declaration

    violations:
      - "Schema yaml products datatype has required_fields fully populated but optional_fields: empty with comment '# TODO: populate from source after pilot validates' — validator passes but downstream bridge authors must re-discover source columns, debt that compounds with each consuming company"
      - "qef_product_profile.yaml authors the blb PL fully (~100 fields enumerated) then leaves jhb..wgs (11 PLs) with '# TODO: replicate the blb structure for the other 11 PLs' — fails union-equality check for 11/12 PLs and forces subsequent passes to re-do the enumeration without original author's context"
      - "Bridge column_mapping covers only the canonical-required fields (8 entries) for an 80-column source while ignored_columns: is left as [] — silently drops 72 columns at runtime"
      - "Bridge ignored_columns: is shorter than the un-mapped source set (e.g. source has 80, mapped 30, ignored only lists 40, leaving 10 source columns silently lost) — fails the mechanical equality set(source) === set(mapped) ∪ set(ignored)"

    compliant:
      - "qef-product-master-redesign Phase 9 task 9.2 authors all 12 product-line attribute datatypes' optional_fields in full in one session, no scaffolding between PLs"
      - "QEF amz sales PoC bridge authored with 30 ignored_columns: entries each containing per-entry reason: field, exhaustive coverage of every source column not in column_mapping (spectra change qef-product-master-redesign verified)"
      - "platform_extensions/amz_extensions.yaml enumerates every AMZ-specific optional field with type + description + notes(if special handling) — bridge authors for new companies open the schema and see complete picture, no TODO gaps"

    dependencies:
      - "MP029"     # Sibling: MP029 forbids fabrication, MP160 forbids omission via scaffolding
      - "MP157"     # MP160 governs how completely each of MP157's two layers must be authored
      - "MP158"     # MP160 hardens MP158 Step 1 to mean "FULLY add", not "scaffold and iterate"
      - "MP159"     # MP160 strengthens MP159's premise: full Layer 1 makes "I need to mutate Layer 1" reduce to "I need a Layer 2 ignored_columns entry"
      - "MP162"     # Sister: MP160 governs authoring-time exhaustiveness (write side); MP162 governs consumption-time exhaustiveness (run side); both are needed for end-to-end correctness
      - "DM_R065"   # Companion: dedup ensures no duplicates; MP160 ensures no omissions
      - "SO_R038"   # Companion: naming rules apply only to enumerated fields; MP160 ensures all fields are enumerated to be named
      - "MP102"     # The schema files MP160 governs the authoring discipline for
      - "DOC_R009"  # Triple-layer sync (this principle requires its own DOC_R009 sync)

    siblings:
      - "MP162"     # Authoring-time exhaustiveness (write side) ↔ Consumption-time exhaustiveness (run side)

  - id: MP161
    type: meta_principle
    name: company_scoped_schema_recognition
    display_name: "Company-Scoped Schema Recognition"
    one_liner: "Schema yamls and generated DDL artifacts SHALL be classified as either UNIVERSAL (used by all consuming companies) or COMPANY-SCOPED (used by exactly one company's data). Universal artefacts live at _authoring/{core_schemas.yaml,platform_extensions/} and _generated/{core,platforms}/. Company-scoped artefacts live at _authoring/companies/{COMPANY}/... and _generated/companies/{COMPANY}/.... Decision rule: 'If a different company onboards tomorrow, would they reuse this exact shape?' YES -> universal; NO -> company-scoped."
    file_path: "CH00_fundamental_principles/04_data_management/MP161_company_scoped_schema_recognition.qmd"
    version: "1.0"
    date_created: "2026-04-28"

    rule_natural: |
      Universal territory:
        - _authoring/core_schemas.yaml (5 universal datatypes + company_product_extension)
        - _authoring/_meta_schema.yaml (validator vocabulary)
        - _authoring/transformed_schemas.yaml (2TR layer schemas)
        - _authoring/platform_extensions/{platform}_extensions.yaml (per-platform fields)
        - _authoring/r_definitions/ (legacy R-defined schemas)
        DDL emission: _generated/core/ + _generated/platforms/{platform}/

      Company-scoped territory:
        - _authoring/companies/{COMPANY}/{schema}.yaml
        - Co-located generators (_authoring/companies/{COMPANY}/gen_*.R)
        - Co-located translation maps (_authoring/companies/{COMPANY}/{translation}.yaml)
        DDL emission: _generated/companies/{COMPANY}/platforms/{platform}/{datatype}.sql

      Currently only QEF_DESIGN has company-scoped schemas (12 per-PL attribute
      datatypes derived from eyewear product profile Gsheet exports). Other 4
      companies (D_RACING, MAMBA, WISER, kitchenMAMA) currently have no
      company-scoped schemas.

      Decision rule when classifying a new schema:
        Q: "If a different company onboards tomorrow, would they reuse this
            exact shape?"
        YES -> Universal (place at _authoring/{core_schemas.yaml |
                          platform_extensions/})
        NO  -> Company-scoped (place at _authoring/companies/{COMPANY}/)

      Boundary case promotion (company-scoped -> universal):
        - Triggered when 2nd consuming company adopts the same shape
        - Process: spectra change + IC_P002 verification + git mv +
          _build.R update + bridge ref updates
        - Commit message includes Verified: trailer naming all 5 companies

      Boundary case demotion (universal -> company-scoped):
        - Triggered when schema turns out to only be used by one company
        - Same process as promotion (in reverse)
        - Rarer than promotions but possible

      Why this rule exists:
        - GitHub issue #499: user review caught _generated/platforms/amz/
          mixing 5 universal core datatype DDL with 13 QEF-eyewear-specific
          DDL files; bridges/{COMPANY}/ already correctly company-scoped
          but DDL layer was not
        - Implicit assumption "all Layer 1 schemas are universal" broke when
          13 datatypes shipped in qef-product-master-redesign 9.2/9.3
          turned out to be QEF-eyewear-specific
        - 5th implicit-to-explicit principle in Phase 9 (after MP159/MP160/
          DEV_R056); each prior elevation paid for itself in 1-2 future
          failure-prevention rounds

    rule_formal: |
      RULE MP161_COMPANY_SCOPED_SCHEMA_RECOGNITION:

      DEFINE schema_classification(s: schema_yaml) AS:
        if exists_company c such that
            "fields of s derive from c's specific data shape" AND
            "no other consuming company has data of this exact shape":
          return COMPANY_SCOPED(c)
        else:
          return UNIVERSAL

      DEFINE expected_authoring_path(s: schema_yaml) AS:
        match schema_classification(s):
          UNIVERSAL          -> _authoring/{core_schemas.yaml |
                                            platform_extensions/{p}.yaml}
          COMPANY_SCOPED(c)  -> _authoring/companies/{c}/{s.name}.yaml

      DEFINE expected_ddl_output_path(s: schema_yaml,
                                       p: platform | None) AS:
        match schema_classification(s):
          UNIVERSAL:
            if p is None: _generated/core/{s.datatype}.sql
            else:         _generated/platforms/{p}/{s.datatype}.sql
          COMPANY_SCOPED(c):
            _generated/companies/{c}/platforms/{p}/{s.datatype}.sql

      INVARIANT for all schema yamls s:
        location(s) == expected_authoring_path(s)

      INVARIANT for all DDL output o emitted by _build.R:
        location(o) == expected_ddl_output_path(source_schema(o), platform(o))

      ENFORCEMENT layers:
        - codegen_level: _build.R discovers schemas at three locations
                         (top-level + platform_extensions + companies/) and
                         emits DDL accordingly; misplacement -> wrong output
                         path -> reproducibility check failure
        - validator_level: validate_bridge_yaml.R schema-aware check looks
                          in companies/{bridge.company}/ in addition to
                          core_schemas.yaml + platform_extensions/{platform}/;
                          missing datatype -> CRITICAL
        - process_level: PR/spectra changes adding new schemas SHALL state
                        classification explicitly in commit message

      EXEMPTIONS (NOT MP161 violations):
        - company_product_extension stays UNIVERSAL even though only QEF
          currently uses it (schema fields are generic accounting concepts;
          Chinese source col names live in QEF's bridge yaml)
        - existing bridges/{COMPANY}/{platform}/ layout (already correctly
          company-scoped at different path; migration to companies/{COMPANY}/
          bridges/ is out of scope)
        - r_definitions/ legacy R-defined schemas (pre-yaml authoring,
          retroactive classification not required)
        - 99_archived/ generated artifacts (per MP030 archive immutability)

    violations:
      - "Authoring product_attribute_schemas.yaml (12 QEF eyewear datatypes) at _authoring/product_attribute_schemas.yaml because 'Layer 1 schemas live at the top level' (anti-pattern A) — should be _authoring/companies/QEF_DESIGN/product_attribute_schemas.yaml; the 12 datatypes' fields derive from QEF's specific eyewear product line catalog"
      - "Authoring company_product_extension at _authoring/companies/QEF_DESIGN/financial_schema.yaml because 'currently only QEF has financial data' (anti-pattern B) — should stay in _authoring/core_schemas.yaml; schema fields ARE generic accounting concepts, only the source data is currently QEF-only"
      - "_build.R emits company-scoped schema DDL to _generated/platforms/amz/ instead of _generated/companies/QEF_DESIGN/platforms/amz/ (anti-pattern C) — output path lies about scope; reader cannot tell from file tree which is universal vs company-specific"
      - "Authoring _authoring/QEF_DESIGN/... directly at top-level without companies/ prefix (anti-pattern D) — mixes scope-tagged with universal-tagged at same level; same readability problem MP161 was created to fix"

    compliant:
      - "qef-product-master-redesign Phase 9 task 4.1 git mv product_attribute_schemas.yaml + 3 sibling files from _authoring/ to _authoring/companies/QEF_DESIGN/ — preserves history, reflects QEF-specific scope"
      - "qef-product-master-redesign Phase 9 task 3.1 _build.R replaces hardcoded Per-PL block with Per-company iteration — discovers schemas at companies/*/ and emits to _generated/companies/{COMPANY}/platforms/{platform}/"
      - "company_product_extension stays in _authoring/core_schemas.yaml (universal) — schema fields are generic financial concepts (sku/marketplace/cost/fee/profit); QEF's Chinese source col mapping (商品成本-廠價, etc.) lives in bridges/QEF_DESIGN/amz/company_product_extension.bridge.yaml's column_mapping"
      - "validate_bridge_yaml.R schema-aware check finds product_attributes_rpl in companies/QEF_DESIGN/product_attribute_schemas.yaml (post-MP161 extension) — the previous INFO 'canonical field existence check skipped' no longer fires"

    dependencies:
      - "MP157"     # Refines MP157's Layer 1 by splitting into universal-Layer-1 vs company-scoped-Layer-1
      - "MP158"     # Strengthens axis-3 onboarding bounded-cost guarantee by classifying schemas
      - "MP159"     # Sibling: implicit-convention-to-explicit-rule pattern (WHAT-stays-immutable + WHERE-it-lives)
      - "MP160"     # Sibling: implicit-to-explicit pattern (HOW completely + WHERE)
      - "MP102"     # Tier-2 Schema Contract — both classifications are Category A bound files
      - "MP029"     # Sibling at meta-level — both prevent assuming incorrect classification
      - "SO_P018"   # Companion — extends 29_company_examples concept to schema authoring + DDL
      - "DOC_R009"  # Triple-layer sync (this principle requires its own DOC_R009 sync)

    metadata:
      created: "2026-04-28"
      triggered_by: "Issue #499 — user review of qef-product-master-redesign 9.5 acceptance outputs caught _generated/platforms/amz/ mixing universal vs QEF-specific DDL; bridges/{COMPANY}/ already correctly company-scoped but DDL layer was not"

  - id: MP162
    type: meta_principle
    name: bridge_end_to_end_realization
    display_name: "Bridge End-to-End Realization"
    one_liner: "Bridge ship-readiness is staged across 5 levels (L1 yaml lint, L2 raw INSERT, L3 DRV runs, L4 dashboard renders, L5 retention audit) but eventual completion at L5 is mandatory; there is no permanent stopping point at any earlier level. Sister principle to MP160 — MP160 governs authoring-time exhaustiveness, MP162 governs consumption-time exhaustiveness (the AI must drive each bridge to L5, no resting at intermediate levels)."
    file_path: "CH00_fundamental_principles/04_data_management/MP162_bridge_end_to_end_realization.qmd"
    version: "1.0"
    date_created: "2026-04-29"

    rule_natural: |
      Five staged levels of bridge ship-readiness:

        L1 — yaml lint clean
             validate_bridge_yaml.R passes; reviewed_by structured;
             no MP159/MP160/MP161 violations; sibling review log
             with CONVERGED or DIMINISHING verdict.

        L2 — raw INSERT works
             fn_glue_bridge() runs to completion against the source;
             the canonical raw table at the appropriate layer
             (raw_data / staged / transformed) ends up populated;
             rowcount > 0; type checks pass.

        L3 — DRV runs against bridge output
             For bridges that feed a derivation (transactional path),
             the downstream DRV scripts (16_derivations/, all_D*_*.R)
             run to completion using the bridge-produced table; the
             DRV output (df_*_processed / df_*_cleansed) ends up
             populated. For reference / lookup bridges that are read
             directly by Shiny, L3 is satisfied vacuously (no DRV
             intermediary).

        L4 — dashboard renders
             At least one Shiny module that consumes the bridge's
             eventual output renders without empty-state fallback,
             without missing-data warnings, with > 0 rows
             contributing. For reference bridges, this means a
             dropdown / map / lookup actually shows the bridge's
             values. For transactional bridges, this means a chart /
             KPI / table reflects rows that flowed bridge -> raw ->
             DRV -> app_data.

        L5 — retention audit
             End-to-end row-count audit:
                 rows_at_source ?=
                 rows_at_raw_after_bridge ?=
                 rows_at_app_data_after_DRV
             modulo intentional drops (pre_filter applied,
             ignored_columns dropped fields, dedupe collapses).
             Every drop must be EXPLAINABLE — no silent loss.

      Mandatory completion at L5:

        - The 5 levels are STAGED (you may ship a bridge at L1 short
          term while iterating on L2-L5) but NOT terminal (you may
          NOT decide "L1 is good enough forever").
        - Every bridge in production SHALL eventually reach L5.
        - "Eventually" has a default 30-day envelope from L1 ship to
          L5 audit; longer requires explicit project tracking
          (GitHub issue with `bridge-rung:Lk-stale` label).
        - The ratchet property: once a bridge has reached Lk, it
          SHALL NOT regress below Lk (modifications that drop a
          bridge below its prior level are CRITICAL violations
          unless the regression is explicit + documented).

      Why this rule exists:

        - "Bridge yaml ship-ready" is means, not end. The actual
          goal is data fully reaching the dashboard with no loss.
        - The /glue-bridge skill currently terminates at L1 (yaml
          lint + ensemble review). Tasks beyond L1 are ad-hoc,
          which leads to L2 silently failing in CI / L3 not being
          tested when a bridge ships / L5 audit never happening.
        - MP160 (AI authoring completeness, sister principle)
          ensures the bridge yaml is exhaustive at WRITE time. MP162
          ensures the bridge realization is exhaustive at RUN time.
          Both are needed — exhaustive write without exhaustive run
          gives shelf-ware; exhaustive run without exhaustive write
          gives untracked partial coverage.
        - Without MP162, the AI agent has no principled reason to
          push past L1; "bridge yaml looks good" reads as a
          stopping condition, when it should read as "milestone 1
          of 5 reached".

    rule_formal: |
      RULE MP162_BRIDGE_END_TO_END_REALIZATION:

      DEFINE level(b: bridge) AS:
        max k in {1, 2, 3, 4, 5} such that
            for all j <= k: gate_j(b) holds
        else 0

      DEFINE gate_1(b) AS:
        validate_bridge_yaml.R(b) returns ok AND
        sibling_review_log(b) exists AND
        sibling_review_log(b).verdict in {"CONVERGED", "DIMINISHING"}

      DEFINE gate_2(b) AS:
        fn_glue_bridge(b) succeeds AND
        rowcount(target_raw_table(b)) > 0

      DEFINE gate_3(b) AS:
        if has_drv(b):
          all DRV scripts in drv_chain(b) succeed AND
          rowcount(drv_output(b)) > 0
        else:
          true                          # vacuously satisfied

      DEFINE gate_4(b) AS:
        exists shiny_module m such that
            m consumes terminal_output(b) AND
            render(m) has > 0 contributing rows AND
            no empty-state fallback fired

      DEFINE gate_5(b) AS:
        retention_audit(b) holds where
            rows_at_source(b) ==
            rows_at_raw(b) + intentional_drops_at_raw(b) AND
            (if has_drv(b))
            rows_at_raw(b) ==
            rows_at_app_data(b) + intentional_drops_at_drv(b)

      INVARIANT for all bridges b in production:
        eventually(level(b) == 5)            # in 30-day envelope by default

      INVARIANT (ratchet) for all bridges b across time t:
        level(b, t+1) >= level(b, t)
        UNLESS regression is logged in `bridge-rung:Lk-regression`
               GitHub issue with explicit reason

      ENFORCEMENT layers:
        - skill_level: /glue-bridge SKILL.md SHALL surface current
                       Lk after each invocation and propose next-level
                       work; agents SHALL NOT mark a bridge "done"
                       before L5 unless an explicit deferral issue
                       exists
        - validator_level: validate_bridge_yaml.R MAY emit INFO
                          findings showing current Lk + days-since-L1
                          (advisory)
        - process_level: bridges still at L < 5 after 30 days SHALL
                        have a `bridge-rung:Lk-stale` GitHub issue
                        opened (default; production ceiling 90 days);
                        L5-reached bridges are exempt
        - principle_level: this MP162 + co-located in glue-bridge
                          SKILL convergence reference

      EXEMPTIONS (NOT MP162 violations):
        - Bridges in bridges/{COMPANY}/wip/ subdirectory (per
          MP160 escape hatch — explicitly out of production)
        - Reference bridges with no DRV (L3 vacuously satisfied
          per gate_3 definition)
        - Bridges deferred via explicit GitHub issue with
          `bridge-rung:Lk-stale` label and target date (deferral
          is normal; silent stagnation is the violation)

    violations:
      - "Bridge ships at L1 (yaml lint + reviewed_by structured) and the AI agent declares the work done; no L2 raw INSERT verification ever runs; the bridge sits in the repo for months while the source data drifts and silently breaks at runtime — agent should have surfaced 'L1 reached, L2 next' instead of 'done'"
      - "Bridge passes L2 (raw INSERT works) but the DRV chain that consumes the produced raw table fails because the DRV expects a column the bridge doesn't emit; nobody notices because the DRV runs nightly without alerting on an empty output table — L3 was never explicitly verified"
      - "Bridge passes L3 (DRV runs) and produces a populated app_data table, but the corresponding Shiny module renders empty because of a JOIN mismatch with another lookup; user sees blank dashboard, opens a ticket, dev team rediscovers the join issue weeks later — L4 was never gated as part of bridge ship-readiness"
      - "Bridge has reached L4 (dashboard renders) but the row count discrepancy between source (10000 rows) and dashboard (3000 rows) is never reconciled; user assumes 'everything is showing' when in fact 70% of source rows are silently dropped at the staged → transformed boundary — L5 retention audit was never performed"
      - "Regression violating ratchet property: bridge previously at L4 (dashboard rendered correctly) is modified to add a new ignored_columns entry without updating the consuming Shiny module; dashboard regresses to L3 + missing-data warning fires — change should have shipped together with the consuming-module update or been blocked at validation"

    compliant:
      - "After /glue-bridge skill ships product_attributes_blb.bridge.yaml at L1 (CONVERGED at iteration 2), the agent immediately surfaces 'L1 reached. Next: L2 raw INSERT verification — run fn_glue_bridge against the actual source CSV and confirm rowcount > 0 in df_QEF_DESIGN_amz_product_attributes_blb___raw' rather than declaring the bridge done"
      - "Issue #503 (umbrella) tracks 4 sub-scopes that map exactly to L2-L5 gates for the 13 ad-hoc-reviewed bridges; each sub-scope has a target completion date within 30 days of L1 ship to satisfy the staleness clock"
      - "MP162 ratchet property enforced: when QEF amz product_attributes_blb bridge is modified to extend ignored_columns, the consuming D03 derivation + positioning Shiny tab are tested to confirm L4 dashboard render still works before merge — preventing the L4-to-L3 regression class"
      - "Reference bridge df_platform_translations.bridge.yaml shipped at L1 + L2 (raw INSERT) + L4 (Shiny dropdown shows translations) skips L3 (no DRV intermediary, vacuously satisfied) and reaches L5 by audit (source rows == raw rows == dropdown rows) — full L5 reached for a reference bridge in 1 day, not 30"

    dependencies:
      - "MP160"     # Sister: MP160 governs authoring-time completeness (write side); MP162 governs consumption-time completeness (run side)
      - "MP102"     # Bridges are MP102 Tier-2 Schema Contracts; MP162 extends MP102's "ship-ready" definition from yaml-lint to end-to-end realization
      - "MP156"     # Both bridges (Layer 2) and DRV scripts (Layer N) are bound implementations; MP162 spans this multi-layer chain
      - "MP157"     # Two-Layer YAML Authoring — Layer 2 bridge yaml is what MP162 says must reach L5 in production
      - "MP159"     # Layer 1 immutability is preserved during L2-L5 work — MP162 enforcement does not unblock Layer 1 mutation
      - "MP161"     # Bridge scope (universal vs company-scoped) determines which Shiny modules count for L4 verification
      - "MP064"     # ETL/Derivation separation defines the L2 → L3 boundary in the 5-level model
      - "MP029"     # Sibling at meta-level — both prevent assuming readiness without verification (don't claim L4 without rendering)
      - "DOC_R009"  # Triple-layer sync (this principle requires its own DOC_R009 sync)
      - "IC_P002"   # Cross-company verification: a bridge change reaching L4 in QEF must not regress L4 in MAMBA / D_RACING / WISER / kitchenMAMA
      - "MP165"     # Sister back-edit (added 2026-05-10 per dashboard-presence-verification): MP162 per-bridge unit ↔ MP165 per-dashboard-tab × per-platform × per-product_line unit; complementary axes both required

    siblings:
      - "MP160"     # Authoring-time exhaustiveness (write side) ↔ Consumption-time exhaustiveness (run side)
      - "MP163"     # Time/ship-readiness axis (MP162) ↔ Human-input-completeness axis (MP163) — orthogonal pair
      - "MP165"     # Per-bridge axis (MP162) ↔ Per-dashboard-tab axis (MP165) — complementary unit pair (sister back-edit 2026-05-10)

    metadata:
      created: "2026-04-29"
      modified: "2026-05-10 (MP165 sibling back-edit per spectra change dashboard-presence-verification, GitHub issue #599; previously: 2026-04-30 MP163 sibling back-edit per spectra change mp163-progressive-completeness-principle, GitHub issue #505)"
      triggered_by: "Issue #503 — after blb iter 2 ensemble verified bridge yaml correctness (max severity dropped CRITICAL → MEDIUM via #502 spectra change), user observed: 'bridge yaml correct' is means, not end; the actual goal is data fully reaching dashboard with no loss. /glue-bridge skill currently terminates at L1 (yaml lint), leaving L2-L5 ad-hoc. MP162 codifies the staged-but-mandatory 5-level framing so AI agents do not rest at L1."

  - id: MP163
    type: meta_principle
    name: progressive_completeness
    display_name: "Progressive Completeness"
    one_liner: "Pipelines and derivations SHALL run end-to-end regardless of human-input completeness; gaps materialize as visible sentinels (e.g. 'unclassified', 'UNKNOWN'), surface to a business-accessible attention loop (coverage audit table / derived Gsheet / dashboard panel), and coverage improves asymptotically as humans incrementally fill inputs — with no code change, schema migration, or redeploy required. Sister principle cluster: MP163 is the architectural escalation of MP154 (field-level sentinel rule), the pipeline-tolerance corollary of MP155 (minimize human input), the human-input-completeness orthogonal complement to MP162 (time-axis ship-readiness), and is compatible with MP029 (sentinels are explicit gap markers, NOT fabricated data)."
    file_path: "CH00_fundamental_principles/03_development_methodology/MP163_progressive_completeness.qmd"
    version: "1.0"
    date_created: "2026-04-30"

    rule_natural: |
      Five-bullet contract:

        (1) Always-runnable pipeline
            ETL / DRV scripts SHALL run to completion regardless of
            human-input completeness in upstream sources (Gsheets,
            master data files, manual classification tables). Scripts
            SHALL NOT call stop() / abort() solely because human-
            curated input is missing or incomplete. Hard failures are
            reserved for engineering failures (DB connectivity loss,
            schema corruption, code defects), NOT absent business
            inputs.

        (2) Visible-gap sentinel materialization
            When human-input gaps cause a row to lack a categorical
            value, the pipeline SHALL materialize the gap as an
            explicit sentinel value ('unclassified' / 'UNKNOWN' /
            domain-specific marker). The pipeline SHALL NOT silently
            drop affected rows, SHALL NOT replace missing categorical
            values with NULL/NA in user-facing tables, and SHALL NOT
            obscure the gap by aggregating it into another bucket.
            This is the architectural escalation of MP154's field-
            level sentinel rule.

        (3) Surface-to-attention gaps
            Pipelines SHALL expose human-input gaps to a business-
            accessible attention surface so maintainers can act on
            them. Acceptable surfaces: coverage audit tables (e.g.
            df_amz_product_line_coverage_audit), derived Gsheets
            filtered to incomplete rows, dashboard alert panels, or
            scheduled email digests. The pipeline SHALL NOT bury gap
            information in log files or runtime warnings only.

        (4) Asymptotic completeness without redeploy
            When human maintainers add missing input (a new row in a
            Gsheet, a new entry in a master file), the next pipeline
            run SHALL automatically incorporate the addition and
            reduce the sentinel-bucketed row count. The system SHALL
            NOT require code changes, schema migrations, or
            redeployment to absorb new human input.

        (5) Sister principle cross-references
            MP163 belongs to a four-principle cluster:
              - MP029 (No Fake Information): MP163 sentinels are
                explicit gap markers, NOT fabricated data; the two
                principles work in the same direction.
              - MP154 (Side Effect Defense): MP163 is the
                architectural escalation of MP154's field-level
                sentinel rule.
              - MP155 (Minimize Human Input): MP163 is the corollary
                that defines pipeline behavior when MP155's input
                minimization is not yet 100% complete.
              - MP162 (Bridge End-to-End Realization): MP163 covers
                the human-input-completeness axis; MP162 covers the
                time/ship-readiness axis. Orthogonal and complementary.

      Why this rule exists:

        - QEF's 19,079 unclassified rows (2026-04-30 /spectra-discuss
          re-evaluation of issues #460/#461/#462/#504) were not a bug
          — they were the principle working as intended (88 self
          ASINs unmapped → sentinel bucket → derived Gsheet surface →
          business backfill loop).
        - But the architectural commitment was implicit. Without an
          explicit Tier-1 principle, new developers and AI agents
          mis-classified the working-as-intended sentinel pathway as
          an "ETL JOIN bug" and proposed code changes; existing ETL
          scripts had inconsistent stop()/sentinel choices; gaps
          surfaced to log files in some pipelines and dashboards in
          others.
        - MP163 codifies the commitment so future ETL/DRV authoring
          (human or AI) defaults to the always-runnable + visible-
          sentinel + surface + asymptotic pattern, and so the
          principle is grep-able as a justification when reviewers
          ask "why doesn't this stop() on missing data?"

    rule_formal: |
      RULE MP163_PROGRESSIVE_COMPLETENESS:

      DEFINE compliant(p: pipeline) AS:
        gate_always_runnable(p) AND
        gate_visible_gap_sentinel(p) AND
        gate_surface_to_attention(p) AND
        gate_asymptotic_completeness(p)

      DEFINE gate_always_runnable(p) AS:
        for all scripts s in p.etl_scripts ∪ p.drv_scripts:
          for all calls to stop() / abort() in s:
            cause(call) ∈ {engineering_failure, code_defect,
                            schema_corruption, db_unreachable}
            AND cause(call) ∉ {missing_human_curated_input,
                               incomplete_gsheet_row,
                               unmapped_categorical_value}

      DEFINE gate_visible_gap_sentinel(p) AS:
        for all transformations t in p that produce categorical
            columns consumed by user-facing tables:
          if exists row r in t.input where r.categorical_value
              cannot be resolved via human-curated mapping:
            t.output.row_for(r).categorical_value ∈
                domain_meaningful_sentinels
            AND t.output.row_for(r).categorical_value ∉ {NULL, NA}
            AND r is not silently dropped from t.output

      DEFINE gate_surface_to_attention(p) AS:
        for all gap-producing transformations t in p:
          exists at least one surface s such that
            s ∈ {coverage_audit_table, derived_gsheet,
                 dashboard_panel, email_digest}
            AND s.refresh_cadence is scheduled
            AND s.audience includes human_maintainer_for(t)
        AND p.surfaces ∉ {log_file_only, runtime_warning_only}

      DEFINE gate_asymptotic_completeness(p) AS:
        for all gap-producing transformations t in p:
          if human_maintainer adds entry e to mapping_source(t):
            next_run(p) reduces sentinel_bucket_count(t) by
                |rows_in_input(t) where r matches e|
            AND no code change required to incorporate e
            AND no schema migration required to incorporate e
            AND no redeploy required to incorporate e

      INVARIANT for all production pipelines p:
        compliant(p) holds at every state of human-input completeness
        (0% to 100% of MP155-required inputs filled)

      ENFORCEMENT layers:
        - PR_review_level: introducing stop() on missing human input
                           is an MP163 violation unless commit message
                           contains explicit engineering-correctness
                           justification (not "we want this filled in")
        - process_level: every gap-producing transformation SHALL have
                         a corresponding df_*_coverage_audit table
                         (canonical naming) that downstream tools can
                         discover
        - architectural_level: MP163 binds shared/update_scripts/ETL/
                              **/*.R, shared/global_scripts/16_
                              derivations/fn_D*_core.R, and shared/
                              global_scripts/05_etl_utils/**/*.R
        - validator_level: future linter (out of scope for v1.0) may
                           flag stop() calls in mapping functions
                           where input may legitimately be missing

      EXEMPTIONS (NOT MP163 violations):
        - Engineering failures: stop() on DB connectivity loss /
          schema corruption / code defects is correct
        - Genuinely required structural columns: stop() if the source
          schema lacks order_id (a coding contract, not a business
          input) is correct
        - Pipelines explicitly out of production: archive/ trees,
          one-off backfill scripts, exploratory notebooks

    violations:
      - "ETL script calls stop('Missing PL classification') when an ASIN has no entry in df_amz_competitor_product_id; pipeline halts; downstream DRV produces no output for any PL — Gate 1 violation"
      - "ETL transform writes product_line_id = NA when mapping fails; downstream GROUP BY silently drops NA rows; dashboard shows 0 customers in 'unclassified' slice (it doesn't exist) — Gate 2 violation"
      - "Coverage audit information is logged via Rprintf only and never surfaces to a business-accessible table or Gsheet; business team has no idea which ASINs are unmapped; gaps persist for months — Gate 3 violation"
      - "Mapping table is hardcoded in R source (e.g. asin_to_pl_map <- c('B0001' = 'hsg', ...)); each new ASIN requires a code change + commit + redeploy; business team cannot complete mappings autonomously — Gate 4 violation"
      - "Shiny app gates rendering on 100% mapping completeness (e.g. shows 'Data not ready' until every ASIN is classified); 88 unmapped ASINs block 280,842 orders' worth of dashboard from ever showing — Gate 4 violation (combined with Gate 1: pipeline effectively halted by completeness gating)"

    compliant:
