    one_liner: "Never assume; always verify before acting"
    file_path: "CH00_fundamental_principles/04_data_management/MP029_no_fake_information.qmd"

    rule_natural: |
      All information must be verified, not assumed:

      1. DATA - No fake data
         - Never generate synthetic production data
         - Use real data sources
         - Sample real data for testing

      2. FUNCTIONS - Verify before creating
         - Search existing functions before creating new
         - Check global_scripts/ for similar implementations
         - Extend existing if appropriate (see DEV_R012)

      3. FILES - Trace before modifying
         - Search for actual source()/import statements
         - Verify which file is ACTUALLY being used
         - Do not assume based on file name alone (see DEV_R017)

