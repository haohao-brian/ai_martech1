  - id: MP102
    type: meta_principle
    name: etl_output_standardization
    display_name: "ETL Output Standardization"
    one_liner: "Standardize ETL output format; binds canonical schema authoring files (Tier-2) per MP156; v1.3 adds structured reviewed_by + self-converging review (#500); v1.4 reinforces bridge yaml as schema mapping locality (etl-architecture-roadmap Requirement 3+4)"
    file_path: "CH00_fundamental_principles/04_data_management/MP102_etl_output_standardization.qmd"
    version: "1.4"
    last_amended: "2026-05-10"
    migration_cutoff: "2026-07-31"   # Legacy string reviewed_by accepted until this date
    glue_era_amendment: true

    # MP156 Two-Tier Normativity binding (added by spectra change
    # `glue-layer-prerawdata-bridge`, issue #489; extended by
    # `glue-bridge-self-converging-review`, issue #500).
    binds:
      - path: "01_db/raw_schema/_authoring/core_schemas.yaml"
        category: "A"
      - path: "01_db/raw_schema/_authoring/schema_registry.yaml"
        category: "A"
      - path: "01_db/raw_schema/_authoring/transformed_schemas.yaml"
        category: "A"
      - path: "01_db/raw_schema/_authoring/platform_extensions/"
        category: "A"
      - path: "01_db/raw_schema/_authoring/r_definitions/"
        category: "A"
      - path: "01_db/raw_schema/_authoring/IMPLEMENTATION_GUIDE.md"
        category: "A"
      # v1.3 additions (#500):
      - path: "00_principles/.claude/skills/glue-bridge/SKILL.md"
        category: "A"
      - path: "00_principles/.claude/skills/glue-bridge/scripts/run_ensemble_review.R"
        category: "A"
      - path: "00_principles/.claude/skills/glue-bridge/scripts/findings_hash.R"
        category: "A"
      - path: "00_principles/.claude/skills/glue-bridge/scripts/validate_bridge_yaml.R"
        category: "A"
      - path: "05_etl_utils/glue/fn_glue_bridge.R"
        category: "A"
      - path: "01_db/raw_schema/_authoring/bridges/_template/SOURCE.bridge.review.md"
        category: "A"

    rule_natural: |
      ETL outputs standardized:
      - Consistent column names
      - Standard data types
      - df_ prefix for tables
      - Documented schema (canonical authoring files at
        `01_db/raw_schema/_authoring/`, relocated 2026-04-27 from
        `00_principles/docs/.../etl_schemas/`)

      MP156 Tier-2 binding (added 2026-04-27 amendment):
      The principle binds 6 spec files / directories under
      `01_db/raw_schema/_authoring/` as Category A — Schema Contracts.
      Changes to bound files require:
      1. DOC_R009 triple-layer sync when semantics change
      2. IC_P002 cross-company verification (5 consumers: QEF_DESIGN,
         D_RACING, MAMBA, WISER, kitchenMAMA)
      3. Codegen regeneration via `_build.R` (byte-identical when
         spec unchanged)
      4. Per-company bridge yaml review (Phase 5+ of #489)
      5. Quarto chapter narrative review for staleness
      Commit message SHALL include `Verified:` trailer when bound
      file changes ship.

      v1.3 amendment (2026-04-29, per #500): bridge yaml `reviewed_by`
      gate accepts two forms (transition until 2026-07-31):
      - Structured (canonical): yaml mapping with required fields
        human_reviewer / review_mode / ai_reviewers / findings_summary /
        approved_at / review_artifacts. findings_summary.critical AND
        findings_summary.high SHALL both equal 0 for ship-ready. A
        sibling {source}.bridge.review.md SHALL exist with
        `## Verdict: CONVERGED` or `## Verdict: DIMINISHING` line.
        findings_resolutions: block SHALL cover every remaining
        MEDIUM/LOW finding when findings_summary.medium + low > 0.
      - Legacy string (deprecated): non-empty string outside placeholder
        blacklist. Validator emits WARNING. After 2026-07-31 both
        validator and runtime gate reject.
      Self-converging loop terminates by content-based convergence
      (CONVERGED / DIMINISHING / PLATEAUED / INSTABILITY), not by
      max-iteration cap. Loop is implemented in
      `/glue-bridge` SKILL.md Step 6 (sub-steps 6a-6e) with
      `run_ensemble_review.R` orchestration helper.

    rule_formal: |
      RULE MP102_OUTPUT:
      etl_output has:
        consistent_columns
        standard_types
        df_prefix
        documented_schema

      RULE MP102_BINDING (added 2026-04-27 per MP156):
      mp102 binds 6 tier2_files in 01_db/raw_schema/_authoring/
      change_to bound_file requires:
        doc_r009_sync IF semantic_change
        ic_p002_cross_co_verify
        codegen_regenerate
        bridge_yaml_review IF core_schema_change AND phase5_or_later
        quarto_chapter_review IF semantic_change

      RULE MP102_REVIEWED_BY (added 2026-04-29 per #500, v1.3):
      bridge.reviewed_by is_a (struct OR legacy_string)
      IF struct: requires_fields {human_reviewer, review_mode,
                                   ai_reviewers, findings_summary,
                                   approved_at, review_artifacts}
                 AND findings_summary.critical == 0
                 AND findings_summary.high == 0
                 AND sibling_review_log_exists
                 AND sibling_review_log contains
                       (verdict_converged OR verdict_diminishing)
      IF legacy_string AND today <= 2026-07-31:
                 requires_value_outside placeholder_blacklist
                 emit WARNING deprecation
      IF legacy_string AND today > 2026-07-31:
                 stop runtime_gate

    violations:
      - "Inconsistent ETL outputs"
      - "Missing df_ prefix"
      - "Tier-2 schema file modified without `Verified:` commit trailer (post-2026-04-27)"
      - "Schema yaml change shipped without regenerating `_generated/` SQL DDL"
      - "Production R code referencing legacy `00_principles/docs/.../etl_schemas/` path (must point at `01_db/raw_schema/_authoring/`)"
      # v1.3 additions:
      - "Bridge yaml with structured reviewed_by but findings_summary.critical > 0 OR high > 0 (not ship-ready, runtime gate stops)"
      - "Bridge yaml with structured reviewed_by but missing sibling {source}.bridge.review.md or no `## Verdict:` line"
      - "findings_summary.medium + low > 0 but findings_resolutions: block missing or empty"
      - "Bridge yaml with legacy string reviewed_by after 2026-07-31 (rejected by runtime gate)"
    compliant:
      - "Standardized output format"
      - "Commit message has `Verified: schema change against 5 consuming companies` trailer when core_schemas.yaml changes"
      - "`Rscript shared/global_scripts/01_db/raw_schema/_build.R` produces byte-identical `_generated/` against unchanged `_authoring/`"
      # v1.3 additions:
      - "Bridge yaml with structured reviewed_by + 0 critical + 0 high + sibling review.md with `## Verdict: CONVERGED at iteration N`"
      - "Bridge yaml with `findings_summary.medium: 2` and matching `findings_resolutions:` block listing 2 entries with acceptance rationale"
      - "Legacy string `reviewed_by: \"che (kiki830621)\"` accepted with deprecation WARNING until 2026-07-31"

    dependencies:
      - "MP156"  # Provides the binding mechanism
      - "MP064"  # ETL-Derivation separation foundation
      - "MP154"  # Sentinel over NA for bridge fallback
      - "MP159"  # Sibling: Layer 1 immutability — what stays unchanged
      - "MP160"  # Sibling: AI authoring completeness — how thoroughly AI authors
      - "MP161"  # Sibling: company scope classification — where schemas live
      - "MP165"  # Sister back-edit (added 2026-05-10 per dashboard-presence-verification): MP102 v1.3 upstream bridge yaml authoring contract ↔ MP165 downstream rendering acceptance contract; necessary-not-sufficient relationship
      - "DOC_R009"  # Triple-layer sync (Layer 1 .qmd → Layer 2 yaml → Layer 3 rules)
      - "IC_P002"  # Cross-company verification (Verified: trailer)
      - "DOC_R009"  # Triple-layer sync discipline
      - "IC_P002"  # Cross-company verification

