# For practical application, start with index.yaml core principles.

principles:

  # ====================
  # 01_GENERAL_PRINCIPLES
  # ====================

  - id: MP001
    type: meta_principle
    name: axiomatization_system
    display_name: "Axiomatization System"
    one_liner: "Establish formal foundations for the principles system"
    file_path: "CH00_fundamental_principles/01_general_principles/MP001_axiomatization_system.qmd"

    rule_natural: |
      The principles system must be built on formal foundations:
      - Define primitive terms clearly
      - Establish axioms as starting points
      - Derive rules from axioms
      - Maintain consistency across principles

    rule_formal: |
      RULE MP001_AXIOM:
      principles_system has:
        primitive_terms (defined)
        axioms (foundational)
        derived_rules (from axioms)
        consistency (verified)

    violations:
      - "Undefined terms in principles"
      - "Circular definitions"
    compliant:
      - "Clear term definitions"
      - "Traceable rule derivations"

  - id: MP002
    type: meta_principle
    name: primitive_terms_and_definitions
    display_name: "Primitive Terms and Definitions"
    one_liner: "Define core terminology precisely"
    file_path: "CH00_fundamental_principles/01_general_principles/MP002_primitive_terms_and_definitions.qmd"

    rule_natural: |
      Core terms must be precisely defined:
      - Meta-Principle (MP): Architectural foundation
      - Principle (P): Implementation guideline
      - Rule (R): Specific implementation pattern
      - Each level has clear scope

    rule_formal: |
      RULE MP002_TERMS:
      term_hierarchy = {
        meta_principle: "system architecture foundation",
        principle: "implementation guideline",
        rule: "specific pattern"
      }
      priority: MP > P > R

    violations:
      - "Using undefined terms"
      - "Mixing term levels"
    compliant:
      - "Consistent terminology usage"

  - id: MP003
    type: meta_principle
    name: structural_blueprint
    display_name: "Structural Blueprint"
    one_liner: "Follow the defined structural patterns"
    file_path: "CH00_fundamental_principles/01_general_principles/MP003_structural_blueprint.qmd"

    rule_natural: |
      System structure follows blueprints:
      - Directory structure is prescribed
      - File organization is standardized
      - Component relationships defined
      - Changes follow evolution patterns

    rule_formal: |
      RULE MP003_BLUEPRINT:
      system_structure follows prescribed_blueprint
      AND changes follow evolution_patterns

    violations:
      - "Ad-hoc directory structures"
      - "Unplanned file organization"
    compliant:
      - "Following documented structure"

  - id: MP004
    type: meta_principle
    name: sensible_defaults
    display_name: "Sensible Defaults"
    one_liner: "Provide sensible defaults that work out of box"
    file_path: "CH00_fundamental_principles/01_general_principles/MP004_sensible_defaults.qmd"

    rule_natural: |
      Systems should work with sensible defaults:
      - Default values are production-ready
      - Configuration optional, not required
      - Defaults documented clearly
      - Override mechanism provided

    rule_formal: |
      RULE MP004_DEFAULTS:
      FOR ALL configuration C:
      has_sensible_default(C)
      AND default_is_documented(C)
      AND can_be_overridden(C)

    violations:
      - "Required configuration without defaults"
      - "Undocumented defaults"
    compliant:
      - "Works out of box with defaults"

  - id: MP005
    type: meta_principle
    name: statute_law_analogy
    display_name: "Statute Law Analogy"
    one_liner: "Principles system works like statutory law"
    file_path: "CH00_fundamental_principles/01_general_principles/MP005_statute_law_analogy.qmd"

    rule_natural: |
      Principles are like statutes:
      - Higher principles override lower
      - Later principles amend earlier
      - Interpretation follows precedent
      - Changes require formal process

    rule_formal: |
      RULE MP005_STATUTE:
      principle_system follows:
        hierarchy (higher overrides lower)
        amendment_process (formal changes)
        precedent (consistent interpretation)

    violations:
      - "Ignoring principle hierarchy"
      - "Informal principle changes"
    compliant:
      - "Following formal amendment process"

  - id: MP006
    type: meta_principle
    name: parsimony
    display_name: "Parsimony"
    one_liner: "Prefer simpler solutions over complex ones"
    file_path: "CH00_fundamental_principles/01_general_principles/MP006_parsimony.qmd"

    rule_natural: |
      Simplicity is preferred:
      - Simplest solution that works
      - Avoid unnecessary complexity
      - Complexity must be justified
      - Refactor toward simplicity

    rule_formal: |
      RULE MP006_PARSIMONY:
      prefer simple_solution > complex_solution
      IF complexity THEN must_be_justified

    violations:
      - "Over-engineered solutions"
      - "Unnecessary abstractions"
    compliant:
      - "Minimal viable implementation"

  - id: MP007
    type: meta_principle
    name: cognitive_distinction
    display_name: "Cognitive Distinction"
    one_liner: "Maintain clear cognitive boundaries"
    file_path: "CH00_fundamental_principles/01_general_principles/MP007_cognitive_distinction.qmd"

    rule_natural: |
      Keep concepts clearly separated:
      - Each module has clear purpose
      - Boundaries are explicit
      - Overlaps are documented
      - Changes respect boundaries

    rule_formal: |
      RULE MP007_COGNITIVE:
      FOR ALL module M:
      has_clear_purpose(M)
      AND has_explicit_boundary(M)

    violations:
      - "Modules with mixed concerns"
      - "Unclear boundaries"
    compliant:
      - "Single-purpose modules"

  - id: MP008
    type: meta_principle
    name: replicability_principle
    display_name: "Replicability Principle"
    one_liner: "Results must be reproducible"
    file_path: "CH00_fundamental_principles/01_general_principles/MP008_replicability_principle.qmd"

    rule_natural: |
      All results should be reproducible:
      - Same inputs produce same outputs
      - Random seeds are set
      - Environment is documented
      - Steps are recorded

    rule_formal: |
      RULE MP008_REPLICATE:
      FOR ALL process P:
      same_inputs(P) produces same_outputs(P)
      AND environment_documented(P)

    violations:
      - "Non-reproducible analyses"
      - "Undocumented random seeds"
    compliant:
      - "set.seed() before random ops"

  - id: MP100
    type: meta_principle
    name: utf8_encoding_standard
    display_name: "UTF-8 Encoding Standard"
    one_liner: "Use UTF-8 encoding for all files"
    file_path: "CH00_fundamental_principles/01_general_principles/MP100_utf8_encoding_standard.qmd"

    rule_natural: |
      All files must use UTF-8:
      - Source files in UTF-8
      - Data files in UTF-8
      - Output files in UTF-8
      - BOM when needed for Excel

    rule_formal: |
      RULE MP100_UTF8:
      FOR ALL file F:
      encoding(F) = UTF-8
      IF for_excel THEN include_BOM

    violations:
      - "Latin-1 encoded files"
      - "Mixed encodings"
    compliant:
      - "Consistent UTF-8 encoding"

  # ====================
  # 02_STRUCTURE_ORGANIZATION
  # ====================

  - id: MP009
    type: meta_principle
    name: default_deny
    display_name: "Default Deny"
    one_liner: "Deny by default, grant explicitly"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP009_default_deny.qmd"

    rule_natural: |
      Access control defaults to deny:
      - No implicit permissions
      - Grant access explicitly
      - Document all grants
      - Review periodically

    rule_formal: |
      RULE MP009_DENY:
      default_permission = DENY
      access requires explicit_grant

    violations:
      - "Open by default"
      - "Implicit permissions"
    compliant:
      - "Explicit access grants"

  - id: MP010
    type: meta_principle
    name: operating_modes
    display_name: "Operating Modes"
    one_liner: "Support distinct operating modes"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP010_operating_modes.qmd"

    rule_natural: |
      System supports multiple modes:
      - Development mode (local)
      - Testing mode (validation)
      - Production mode (deployed)
      - Each mode has specific behavior

    rule_formal: |
      RULE MP010_MODES:
      operating_modes = {development, testing, production}
      FOR ALL mode M: has_specific_behavior(M)

    violations:
      - "No mode distinction"
      - "Development code in production"
    compliant:
      - "Clear mode separation"

  - id: MP011
    type: meta_principle
    name: documentation_organization
    display_name: "Documentation Organization"
    one_liner: "Organize documentation systematically"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP011_documentation_organization.qmd"

    rule_natural: |
      Documentation follows structure:
      - README at each level
      - API documentation with functions
      - User guides separate from technical
      - Keep docs near code

    rule_formal: |
      RULE MP011_DOCS:
      documentation structure:
        readme_per_directory
        api_with_functions
        separate_user_guides

    violations:
      - "Scattered documentation"
      - "Outdated READMEs"
    compliant:
      - "Organized, current documentation"

  - id: MP012
    type: meta_principle
    name: change_tracking
    display_name: "Change Tracking"
    one_liner: "Track all changes systematically"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP012_change_tracking.qmd"

    rule_natural: |
      All changes must be tracked:
      - CHANGELOG for significant changes
      - Git commits with clear messages
      - Issue tracking for bugs/features
      - Documentation updates

    rule_formal: |
      RULE MP012_TRACK:
      FOR ALL change C:
      logged_in_changelog(C)
      OR in_git_history(C)
      AND has_clear_description(C)

    violations:
      - "Undocumented changes"
      - "Vague commit messages"
    compliant:
      - "Clear change documentation"

  - id: MP013
    type: meta_principle
    name: currency_principle
    display_name: "Currency Principle"
    one_liner: "Keep everything current and up-to-date"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP013_currency_principle.qmd"

    rule_natural: |
      Information must be current:
      - Documentation reflects current state
      - Deprecated code is marked
      - Old patterns are updated
      - Review periodically

    rule_formal: |
      RULE MP013_CURRENCY:
      FOR ALL documentation D:
      reflects_current_state(D)
      AND deprecated_is_marked(D)

    violations:
      - "Outdated documentation"
      - "Unmarked deprecated code"
    compliant:
      - "Current, accurate docs"

  - id: MP014
    type: meta_principle
    name: modularity
    display_name: "Modularity"
    one_liner: "Build systems from independent modules"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP014_modularity.qmd"

    rule_natural: |
      Systems are modular:
      - Each module is independent
      - Clear interfaces between modules
      - Modules can be tested alone
      - Changes isolated to modules

    rule_formal: |
      RULE MP014_MODULE:
      FOR ALL module M:
      is_independent(M)
      AND has_clear_interface(M)
      AND testable_in_isolation(M)

    violations:
      - "Tightly coupled modules"
      - "Hidden dependencies"
    compliant:
      - "Loosely coupled modules"

  - id: MP015
    type: meta_principle
    name: package_consistency
    display_name: "Package Consistency"
    one_liner: "Use packages consistently throughout"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP015_package_consistency.qmd"

    rule_natural: |
      Package usage is consistent:
      - Choose one package per purpose
      - Document package choices
      - Avoid conflicting packages
      - Update together

    rule_formal: |
      RULE MP015_PACKAGE:
      FOR ALL purpose P:
      one_package_choice(P)
      AND documented_choice(P)

    violations:
      - "Multiple packages for same purpose"
      - "Undocumented package choices"
    compliant:
      - "Consistent package ecosystem"

  - id: MP016
    type: meta_principle
    name: concept_documents
    display_name: "Concept Documents"
    one_liner: "Document concepts before implementation"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP016_concept_documents.qmd"

    rule_natural: |
      Major features need concept docs:
      - Design before implementation
      - Document trade-offs
      - Get review before building
      - Update as implementation evolves

    rule_formal: |
      RULE MP016_CONCEPT:
      FOR major_feature F:
      has_concept_doc(F)
      AND reviewed_before_impl(F)

    violations:
      - "Implementation without design"
      - "No trade-off documentation"
    compliant:
      - "Concept doc before coding"

  - id: MP017
    type: meta_principle
    name: config_driven_ui_composition
    display_name: "Config-Driven UI Composition"
    one_liner: "Compose UI from configuration"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP017_config_driven_ui_composition.qmd"

    rule_natural: |
      UI is configured, not hard-coded:
      - app_config.yaml defines UI structure
      - Components loaded based on config
      - Easy to modify without code changes
      - Configuration validates

    rule_formal: |
      RULE MP017_CONFIG_UI:
      ui_structure defined_in app_config.yaml
      components loaded_from config
      changes without code_modification

    violations:
      - "Hard-coded UI structure"
      - "UI changes require code edits"
    compliant:
      - "Config-driven UI composition"

  - id: MP018
    type: meta_principle
    name: functor_module_correspondence
    display_name: "Functor-Module Correspondence"
    one_liner: "Map commands to modules systematically"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP018_functor_module_correspondence.qmd"

    rule_natural: |
      Commands map to modules:
      - Each command has corresponding module
      - Module named after command pattern
      - Clear mapping documented
      - Consistent naming

    rule_formal: |
      RULE MP018_FUNCTOR:
      command(verb, object) maps_to module(M_verb_ing_object)
      mapping is documented

    violations:
      - "Commands without clear modules"
      - "Inconsistent module naming"
    compliant:
      - "M01_summarizing_database for 'summarize database'"

  - id: MP019
    type: meta_principle
    name: neighborhood_principle
    display_name: "Neighborhood Principle"
    one_liner: "Related code should be located together"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP019_neighborhood_principle.qmd"

    rule_natural: |
      Related code stays together:
      - Functions in same domain in same module
      - Related files in same directory
      - Reduces cognitive load
      - Easier to find code

    rule_formal: |
      RULE MP019_NEIGHBOR:
      IF related(code_A, code_B)
      THEN same_location(code_A, code_B)

    violations:
      - "Related code scattered"
      - "Domain logic spread across files"
    compliant:
      - "Cohesive code organization"

  - id: MP020
    type: meta_principle
    name: ui_server_correspondence
    display_name: "UI-Server Correspondence"
    one_liner: "UI and server logic correspond one-to-one"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP020_ui_server_correspondence.qmd"

    rule_natural: |
      UI and server match:
      - Each UI element has server counterpart
      - IDs match between UI and server
      - Organized in same structure
      - Changes update both

    rule_formal: |
      RULE MP020_CORRESPOND:
      FOR ALL ui_element U:
      has_server_counterpart(U)
      AND matching_ids(U, server(U))

    violations:
      - "Orphan UI elements"
      - "Mismatched IDs"
    compliant:
      - "UI-server alignment"

  - id: MP021
    type: meta_principle
    name: computation_allocation
    display_name: "Computation Allocation"
    one_liner: "Allocate computation to appropriate layer"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP021_computation_allocation.qmd"

    rule_natural: |
      Computation in right place:
      - Aggregations in database
      - Business logic in derivation
      - Display logic in UI layer
      - Heavy compute server-side

    rule_formal: |
      RULE MP021_COMPUTE:
      aggregation_computation in database_layer
      business_logic in derivation_layer
      display_logic in ui_layer

    violations:
      - "Aggregation in R when DB can do it"
      - "Business logic in UI"
    compliant:
      - "Appropriate layer allocation"

  - id: MP022
    type: meta_principle
    name: connected_component_principle
    display_name: "Connected Component Principle"
    one_liner: "Components should be connected through clear interfaces"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP022_connected_component_principle.qmd"

    rule_natural: |
      Components connect via interfaces:
      - Clear input/output contracts
      - No hidden dependencies
      - Interface changes documented
      - Versioned interfaces

    rule_formal: |
      RULE MP022_CONNECT:
      component_connection via clear_interface
      no hidden_dependencies
      interface_changes documented

    violations:
      - "Components with hidden coupling"
      - "Undocumented interfaces"
    compliant:
      - "Well-defined component interfaces"

  - id: MP023
    type: meta_principle
    name: package_documentation
    display_name: "Package Documentation"
    one_liner: "Document package usage and dependencies"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP023_package_documentation.qmd"

    rule_natural: |
      Package usage documented:
      - List all required packages
      - Document why each is needed
      - Version requirements noted
      - Update when dependencies change

    rule_formal: |
      RULE MP023_PKG_DOC:
      FOR ALL package P:
      documented_usage(P)
      AND documented_purpose(P)
      AND version_requirement(P)

    violations:
      - "Undocumented dependencies"
      - "No version pinning"
    compliant:
      - "Complete package documentation"

  - id: MP024
    type: meta_principle
    name: app_dynamics
    display_name: "App Dynamics"
    one_liner: "Understand and design for app runtime behavior"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP024_app_dynamics.qmd"

    rule_natural: |
      Design for runtime:
      - Understand initialization order
      - Plan reactive dependencies
      - Consider state changes
      - Handle lifecycle events

    rule_formal: |
      RULE MP024_DYNAMICS:
      app_design considers:
        initialization_order
        reactive_dependencies
        state_transitions
        lifecycle_events

    violations:
      - "Ignoring initialization order"
      - "Race conditions in reactives"
    compliant:
      - "Well-designed app lifecycle"

  - id: MP025
    type: meta_principle
    name: ui_separation
    display_name: "UI Separation"
    one_liner: "Separate UI definition from logic"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP025_ui_separation.qmd"

    rule_natural: |
      UI code is separated:
      - UI definition in separate files
      - Server logic separate from UI
      - Styling in CSS files
      - Configuration in YAML

    rule_formal: |
      RULE MP025_UI_SEP:
      ui_definition separate_from server_logic
      styling in css_files
      config in yaml_files

    violations:
      - "UI and logic mixed"
      - "Inline styles"
    compliant:
      - "Clean separation"

  - id: MP026
    type: meta_principle
    name: interactive_visualization_preference
    display_name: "Interactive Visualization Preference"
    one_liner: "Prefer interactive visualizations"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP026_interactive_visualization_preference.qmd"

    rule_natural: |
      Interactive visuals preferred:
      - Use plotly over ggplot when possible
      - Enable tooltips and zoom
      - Support filtering interactions
      - Fall back to static when needed

    rule_formal: |
      RULE MP026_INTERACTIVE:
      prefer interactive_visualization > static
      enable tooltips, zoom, filter

    violations:
      - "Static plots when interactive possible"
    compliant:
      - "Plotly with full interaction"

  - id: MP093
    type: meta_principle
    name: script_separation_principle
    display_name: "Script Separation Principle"
    one_liner: "Separate update scripts from global scripts"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP093_script_separation_principle.qmd"

    rule_natural: |
      Clear script separation:
      - update_scripts/ for execution
      - global_scripts/ for reusable code
      - No execution in global_scripts
      - No reusable code in update_scripts

    rule_formal: |
      RULE MP093_SCRIPT_SEP:
      update_scripts contains execution_scripts
      global_scripts contains reusable_code
      NO cross_contamination

    violations:
      - "Execution code in global_scripts"
      - "Business logic in update_scripts"
    compliant:
      - "Clear separation maintained"

  - id: MP097
    type: meta_principle
    name: principle_implementation_separation
    display_name: "Principle-Implementation Separation"
    one_liner: "Separate principle definition from implementation"
    file_path: "CH00_fundamental_principles/01_general_principles/MP097_principle_implementation_separation.qmd"

    rule_natural: |
      Principles and implementation separate:
      - Principles in 00_principles/
      - Implementation in relevant directories
      - Principles reference implementations
      - Implementations cite principles

    rule_formal: |
      RULE MP097_SEPARATION:
      principles in 00_principles/
      implementations in domain_directories/
      cross_references maintained

    violations:
      - "Implementation details in principles"
      - "Principles without implementation references"
    compliant:
      - "Clear separation with references"

  - id: MP119
    type: meta_principle
    name: ui_block_separation
    display_name: "UI Block Separation"
    one_liner: "Separate UI into logical blocks"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP119_ui_block_separation.qmd"

    rule_natural: |
      UI organized in blocks:
      - Header block
      - Navigation block
      - Content blocks
      - Footer block
      - Each block independent

    rule_formal: |
      RULE MP119_BLOCKS:
      ui_structure = [header, navigation, content, footer]
      blocks are independent

    violations:
      - "Monolithic UI code"
    compliant:
      - "Block-based UI organization"

  - id: MP120
    type: meta_principle
    name: theme_consistency
    display_name: "Theme Consistency"
    one_liner: "Maintain consistent theming"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP120_theme_consistency.qmd"

    rule_natural: |
      Theming is consistent:
      - Single theme definition
      - Applied uniformly
      - Colors from theme
      - Typography from theme

    rule_formal: |
      RULE MP120_THEME:
      single_theme_definition
      uniform_application
      all_styles from theme

    violations:
      - "Ad-hoc colors"
      - "Inconsistent typography"
    compliant:
      - "Unified theme system"

  - id: MP121
    type: meta_principle
    name: issue_authorization_control
    display_name: "Issue Authorization Control"
    one_liner: "Control issue creation and modification"
    file_path: "CH00_fundamental_principles/02_structure_organization/MP121_issue_authorization_control.qmd"

    rule_natural: |
      Issue tracking controlled:
