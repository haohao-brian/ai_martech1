canonical_target:
  datatype: sales
  platform: amz
  table: df_amz_sales___raw
  schema_yaml_path: 01_db/raw_schema/_authoring/core_schemas.yaml
  platform_extension_yaml_path: 01_db/raw_schema/_authoring/platform_extensions/amz_extensions.yaml
pre_filter:
- column: order-status
  exclude_values:
  - Cancelled
  - Pending
- column: quantity
  exclude_values: '0'
field_extractors:
  order_id:
    type: column
    name: amazon-order-id
    coercion: as.character + trimws
  customer_id:
    type: column
    name: amazon-order-id
    coercion: as.character + trimws
    notes: |
      Amazon's All Orders Report does not expose buyer email. order_id is
      used as a stable per-purchase customer surrogate; identity dedup
      happens at DRV layer (D01 customer DNA). This is consistent with
      QEF_DESIGN's pre-glue ETL behavior — see
      shared/global_scripts/05_etl_utils/amz/205g_process_amazon_sales.R.
  product_id:
    type: column
    name: asin
    coercion: as.character + trimws + toupper
  order_date:
    type: column
    name: purchase-date
    coercion: format(., '%Y-%m-%d') from POSIXct
  quantity:
    type: column
    name: quantity
    coercion: as.integer
  unit_price:
    type: column
    name: item-price
    coercion: as.numeric
    notes: |
      Amazon's item-price is the per-unit gross price. total_amount below
      is derived from quantity * unit_price since the source export does
      not provide a separate line subtotal.
  amz_marketplace_id:
    type: const
    value: ATVPDKIKX0DER
    notes: |
      QEF_DESIGN sells exclusively in amazon.com (US). Hardcoded literal
      via the bridge's use_value mechanism (per-company constants belong
      in the bridge yaml, not the schema yaml). If QEF expands to other
      Amazon marketplaces, regenerate this bridge with a from_column
      mapping or per-source bridge per marketplace.
  amz_fulfillment_channel:
    type: column
    name: fulfillment-channel
    coercion: as.character + toupper
    notes: |
      Source format: "Amazon" or "Merchant" (mixed case in raw data).
      Canonical pattern: ^(AFN|MFN)$.
      Value map keys are post-coercion (toupper) per DM_R065 rule 3 — no
      case-variant brute force. Identity mappings ("AFN"->"AFN" / "MFN"->
      "MFN") preserved for sources that already use canonical short codes.
    value_map:
      AMAZON: AFN
      MERCHANT: MFN
      AFN: AFN
      MFN: MFN
  amz_amazon_order_id:
    type: column
    name: amazon-order-id
    coercion: as.character + trimws
    notes: |
      Same source column as order_id but kept as a separate column for
      explicit Amazon-specific lineage. Matches pattern
      ^[0-9]{3}-[0-9]{7}-[0-9]{7}$.
  amz_seller_sku:
    type: column
    name: sku
    coercion: as.character + trimws
  amz_shipping_service_level:
    type: column
    name: ship-service-level
    coercion: as.character + trimws
  amz_promotion_ids:
    type: column
    name: promotion-ids
    coercion: as.character
    notes: |
      Source column is logical (all NA) in 2024 monthly files because
      QEF_DESIGN doesn't run Amazon promotions. Coerced to empty-string
      sentinel via canonical schema's fallback for optional VARCHAR.
  amz_is_business_order:
    type: column
    name: is-business-order
    coercion: as.logical
  ship_country:
    type: column
    name: ship-country
    notes: ISO-2 alpha-2 country code (e.g. 'US', 'JP'). Optional — most QEF amz orders
      are US.
  ship_state:
    type: column
    name: ship-state
    notes: USPS 2-letter state code for US orders (e.g. 'CA', 'NY'); blank/NULL for
      international.
  ship_city:
    type: column
    name: ship-city
    notes: Free-text city name. DRV layer normalizes via tolower(trimws). worldMap
      us_cities view JOINs against us_cities_geo.yaml lat/lon lookup.
  total_amount:
    type: derive
    expression: unit_price * quantity
    notes: 'Per-row: total_amount = unit_price * quantity. Recognized by apply_fallback''s
      regex match (#609). Source xlsx has no separate line subtotal column.'
  platform_id:
    type: derive
    expression: canonical_target.platform
    notes: Derives from bridge canonical_target.platform = 'amz'. Recognized by apply_fallback's
      regex match.
  import_timestamp:
    type: derive
    expression: Sys.time()
    notes: Captures wall-clock at INSERT time. Recognized by apply_fallback's regex
      match.
  import_source:
    type: const
    value: glue_bridge:QEF_DESIGN:amz:sales
    notes: Runtime fn_glue_bridge overrides to this_source_id; const provides a placeholder
      so apply_mapping doesn't fall back to UNKNOWN_SOURCE before override.
