# us_cities_geo.yaml — Top 45 US cities lat/lon for #418 city map drill-down
#
# Purpose: lookup table for plotly scattergeo bubble rendering in worldMap
# component when drilled into us_cities view.
#
# Source: US Census 2020 city centroids (rounded to 4 decimals — ~11 m precision).
#         Top 45 by population, ordered alphabetically by city name within
#         state for stable git diffs. (Reconciled count to actual entries
#         per #565 item 4 — yaml said "top 50" but had 45 entries.)
#
# Future enhancement (out-of-scope for #418): replace with R `maps::us.cities`
# or US Census API at runtime. Hardcoded yaml is MVP per Plan tier 2026-05-04.
#
# Format: cities[N].state (USPS 2-letter), cities[N].city (canonical English),
# cities[N].lat / .lon (decimal degrees, WGS84). Match key in worldMap.R is
# lower-trimmed city + state filter (selected_state), to avoid Springfield-style
# multi-state collisions.
#
# Following: MP155 (minimize human input — auto-load on demand),
#            MP163 (graceful no-op if file missing — render emits empty state),
#            DEV_R052 (English keys; UI-side translate only).

