    one_liner: "Use JSON for complex data serialization"
    file_path: "CH02_data_management/rules/DM_R026_json_serialization_strategy.qmd"

    rule_natural: |
      Complex R objects stored as JSON:
      - Use jsonlite::toJSON() for serialization
      - Use jsonlite::fromJSON() for deserialization
      - Store in VARCHAR column
      - Include auto_unbox = TRUE for scalars

    rule_formal: |
      RULE DM_R026_JSON:
