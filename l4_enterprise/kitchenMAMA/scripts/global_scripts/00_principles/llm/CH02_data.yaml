  - id: DM_R028
    type: rule
    name: etl_data_type_separation
    display_name: "ETL Data Type Separation"
    one_liner: "Separate ETL by data type (0IM, 1ST, 2TR); 0IM dual form (R script OR bridge yaml) post-glue. **v2.4 amendment (2026-05-14, #670)**: explicit scope clarification — this rule applies to ETL layer only; the `_ETL_` token in the prescribed pattern signals ETL-only intent; the `{platform}_` prefix is justified at ETL layer because source schemas truly differ per platform. **DRV layer naming governed by DM_R066 (DRV Platform Agnosticism)** — DRV operates on canonical schema, algorithm is platform-invariant, per-platform DRV files are pure naming duplication. DM_R028 v2.4 disambiguates against de-facto extension into DRV layer; no normative behavior change for ETL itself."
    file_path: "CH02_data_management/rules/DM_R028_etl_data_type_separation.qmd"
    version: "2.4"
    glue_era_amendment: true

    rule_natural: |
      ETL scripts organized by data type:
      - 0IM (Import): Raw data ingestion
        - Legacy form: <platform>_ETL_<datatype>_0IM.R (R script in update_scripts/ETL/<platform>/)
        - Post-glue form: <datatype>.bridge.yaml (in bridges/<COMPANY>/<platform>/, interpreted by fn_glue_bridge.R)
      - 1ST (Structure): Data structuring/quality validation (post-migration: no schema mapping)
      - 2TR (Transform): Business transformations (post-migration: post-canonical only, no schema mapping)
      - Each type has separate scripts; 0IM may use bridge yaml form

    rule_formal: |
      RULE DM_R028_DATA_TYPE:
      etl_types = {0IM, 1ST, 2TR}
      FOR ALL etl_script S:
      data_type(S) IN etl_types
      0IM_FORM in {legacy_r_script, post_glue_bridge_yaml}
      RAW_LAYER_SCHEMA = canonical (post-glue, per MP064 v2.2)

    violations:
      - "Mixing import and transform in one script"
      - "Undefined data type prefix"
      - "Schema mapping in post-migration 1ST/2TR (should be in bridge yaml only)"
    compliant:
      - "cbz_ETL_sales_0IM.R, cbz_ETL_sales_1ST.R, cbz_ETL_sales_2TR.R (legacy form)"
      - "bridges/QEF_DESIGN/amz/sales.bridge.yaml + amz_ETL_sales_1ST.R + amz_ETL_sales_2TR.R (post-glue form)"

