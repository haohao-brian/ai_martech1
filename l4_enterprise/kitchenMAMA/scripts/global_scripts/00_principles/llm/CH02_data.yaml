      - Input Source Documentation: all available data sources MUST be catalogued
        in schema_registry.yaml under input_sources (Section 6)
      - Google Sheets tabs: document tab_name, tab_category, etl_source_key
      - Rawdata files: document rawdata_pattern or rawdata_path, etl_source_key
      - Unmapped sources marked with etl_source_key: "unmapped"

    rule_formal: |
      RULE DM_R037_ETL_NAME:
      etl_filename = "{platform}_ETL_{datatype}_0IM.R"
      source_profile IN app_config.yaml > etl_sources.{datatype}
      platform IN {cbz, eby, amz}

      RULE DM_R037_SOURCE_DOC:
      FOR ALL company C:
      schema_registry.yaml CONTAINS input_sources(C)
      AND FOR ALL data_source S in C:
      S HAS {source_type, etl_source_key, description, status}
      AND etl_source_key(S) IN keys(etl_sources) OR "unmapped"

    violations:
