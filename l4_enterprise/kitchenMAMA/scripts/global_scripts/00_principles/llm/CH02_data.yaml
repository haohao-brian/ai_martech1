  - id: DM_R047
    type: rule
    name: multi_platform_synchronization
    display_name: "Multi-Platform Synchronization"
    one_liner: "Synchronize data structure changes across all platforms — schema, fields, metadata MUST be identical across cbz/eby/amz/all. **v1.1 amendment (2026-05-14, #670)**: normative invariant unchanged; enforcement mechanism revised — wrapper script `update_all_platforms_poisson.R` (v1.0 enforcement vehicle) deleted per DM_R066 (DRV Platform Agnosticism). Synchronization now enforced by (1) single-source platform-agnostic DRV scripts (algorithm identical for all platforms by construction; e.g. `DRV/D04/D04_02.R` replaced `cbz_D04_02.R` + `eby_D04_02.R`) + (2) `_targets.R` orchestrator declarative iteration over enabled platforms × scripts (MAMBA_PLATFORM env var spawn pattern, resolve_drv_platform() reads). D04 migrated as pilot; D01/D03/D05/D11 continue with original per-platform structure during incremental rollout, sync enforced by code review until each group migrates."
    file_path: "CH02_data_management/rules/DM_R047_multi_platform_synchronization.qmd"
    version: "1.1"
    related: [DM_R046, DM_R066, MP135, R120, MP102, MP029]

    rule_natural: |
      Data structure changes must sync across platforms:
      - Apply to ALL platforms simultaneously
      - Verify consistency after change
      - Document changes

      Enforcement (v1.1, 2026-05-14):
      - Refactored DRV groups (post-DM_R066): single platform-agnostic script
        guarantees identical output by construction. Adding a platform =
        config-line change in app_config.yaml; no new script needed.
      - Legacy DRV groups (pre-DM_R066, D01/D03/D05/D11): per-platform scripts
        still exist; sync enforced by code review + orchestrator iteration.
        Each group migrates to DM_R066 in follow-up spectra changes.

    rule_formal: |
      RULE DM_R047_SYNC:
      FOR ALL schema_change C across all enabled_platforms P:
        apply(C, P) AND verify_consistency(P_set)

      ENFORCEMENT v1.1:
        IF DRV_group refactored per DM_R066:
          synchronization is automatic (single source)
        ELSE:
          synchronization enforced by code review + orchestrator iteration

    violations:
      - "Schema change on one platform only (DRV output divergence)"
      - "Inconsistent column names across platforms"
      - "Creating new <platform>_<group>_<seq>.R for D04 (post-refactor) — should edit single DRV/D04/D04_02.R instead per DM_R066"
    compliant:
      - "Single platform-agnostic DRV script (e.g. DRV/D04/D04_02.R) refactored per DM_R066"
      - "Orchestrator iteration in _targets.R spawns same script per platform"
      - "Legacy per-platform scripts (D01/D03/D05) kept in sync via code review until DM_R066 migration"

    change_summary:
      - "v1.1 (2026-05-14, #670): enforcement mechanism revised — wrapper script deleted, replaced by DM_R066 single-source DRV + orchestrator iteration"
      - "v1.0 (2025-11-14): initial release"

  - id: DM_R052
    type: rule
    name: cross_platform_product_identification
    display_name: "Cross-Platform Product Identification"
    one_liner: "Use surrogate key pattern for M:N product-to-platform mappings"
    file_path: "CH02_data_management/rules/DM_R052_cross_platform_product_identification.qmd"

    rule_natural: |
      Cross-platform product identification uses surrogate keys:
      - product_mapping_id: Auto-incremented surrogate key
      - sku: Company internal SKU (natural key part 1)
      - eby_item_id: eBay item number (natural key part 2)
      - Supports M:N relationships (one SKU → multiple eBay IDs)
      - Source priority for deduplication when merging
      - Maintains product line and category metadata

    rule_formal: |
      RULE DM_R052_CROSS_PLATFORM_ID:
      FOR product_mapping table:
        primary_key = product_mapping_id (surrogate, INTEGER)
        natural_key = (sku, eby_item_id) (composite)
        relationship = M:N (sku ↔ eby_item_id)

      schema = {
        product_mapping_id: INTEGER PRIMARY KEY,
        sku: VARCHAR NOT NULL,
        eby_item_id: VARCHAR,
        product_name: VARCHAR,
        product_category: VARCHAR,
        product_line: VARCHAR,
        source: VARCHAR NOT NULL,
        created_at: TIMESTAMP
      }

    violations:
      - "Using only SKU as unique key (ignores M:N)"
      - "Hardcoding platform-specific logic in derivations"
      - "No source tracking for data origin"
    compliant:
      - "Surrogate key + composite natural key"
      - "Source column for priority-based deduplication"
      - "Platform-agnostic derivation queries"

  - id: DM_R053
    type: rule
    name: multi_source_etl_priority_pattern
    display_name: "Multi-Source ETL Priority Pattern"
    one_liner: "Use source naming and priority ordering for multi-source data integration"
    file_path: "CH02_data_management/rules/DM_R053_multi_source_etl_priority_pattern.qmd"

    rule_natural: |
      When integrating data from multiple sources:

      1. Source Naming Convention:
         - Prefix indicates source type: excel_, google_sheet_, api_, manual_
         - Suffix adds specificity: google_sheet_sku_eby, google_sheet_inventory
         - Company-specific sources use company code: cbz_erp, eby_api

      2. Priority Ordering:
         - Alphabetically later sources override earlier ones
         - Example: google_sheet_sku_eby > google_sheet > excel
         - Implement via: arrange(desc(source)) %>% group_by(key) %>% slice_head(n=1)

      3. Dynamic Column Mapping:
         - Use janitor::clean_names() for standardization
         - Pattern-based column discovery with regex
         - Never hardcode column names from external sources

      4. Company-Specific Configuration:
         - Source definitions in app_config.yaml
         - Priority order configurable per company
         - Column mappings defined in config, not code

    rule_formal: |
      RULE DM_R053_MULTI_SOURCE_PRIORITY:

      source_naming:
        pattern = "{type}_{specificity}"
        type IN {excel, google_sheet, api, manual, erp}

      priority_resolution:
        FOR duplicate_key K across sources S1, S2:
        IF alphabetical_order(S2) > alphabetical_order(S1)
        THEN use_value_from(S2)

      column_mapping:
        standardize = janitor::clean_names(df)
        find_column = grep(pattern, names(df))
        NOT hardcode_names()

      configuration:
        sources IN app_config.yaml
        priority_order IN app_config.yaml
        column_patterns IN app_config.yaml

    violations:
      - "Hardcoded column names like 'eBay Item Number'"
      - "Fixed priority order in code instead of config"
      - "No source column to track data origin"
      - "Using last-write-wins without explicit priority"
    compliant:
      - "Dynamic column discovery with regex patterns"
      - "Source priority via arrange(desc(source))"
      - "Configuration-driven source definitions"
      - "Company-specific priority in app_config.yaml"

  - id: DM_R054
    type: rule
    name: metadata_table_storage_pattern
    display_name: "Metadata Table Storage Pattern"
    one_liner: "Metadata tables live EXCLUSIVELY in meta_data.duckdb (the 7th layer, non-rebuildable, survives app_data rebuild)"
    file_path: "CH02_data_management/rules/DM_R054_metadata_table_storage_pattern.qmd"

    version_history:
      - "v1.0 (2025-12-26): metadata → app_data.duckdb"
      - "v2.0 (2026-04-19): REVISED — metadata → meta_data.duckdb (7th layer, non-rebuildable, survives app_data rebuild). Motivation: #422 + spectra change metadata-to-meta-data-duckdb. v1 had an operational blind spot: app_data.duckdb is rebuildable (DM_R061), so `rm app_data.duckdb` would destroy metadata as side effect."
      - "v2.1 (2026-04-19): ADDENDUM — (a) Runtime MAY NOT read CSV seeds; (b) Readers SHALL reach meta_data.duckdb through fn_load_product_lines; (c) APP_MODE autoinit() SHALL populate db_path_list$meta_data. Motivation: #424 + spectra change dm-r054-v2-migration-complete. Closes the gap between v2's spec and runtime reality (legacy writers + CSV fallback)."
      - "v2.1.1 (2026-04-20): HOTFIX — mode-aware canonical. §7/§8 relaxed to cover app_config.yaml > database.mode = supabase deployments (Posit Connect). Canonical runtime source is whichever backend dbConnectAppData() returns (DuckDB locally, Supabase in production). fn_load_product_lines gains mode=c('auto','duckdb','supabase') argument. APP_MODE autoinit no longer fail-fasts on missing meta_data.duckdb — it's optional when Supabase mode is active. meta_data.duckdb is NOT shipped in the deploy bundle. §6 no-CSV rule unchanged. Motivation: MAMBA Posit Connect startup error triggered by hardcoded DuckDB-only assumption in a8d9aab; fixed in c90c540 + deploy commit 4daed19."

    rule_natural: |
      Metadata tables (reference, lookup, mapping, dictionary data like
      df_platform and df_product_line) MUST live in meta_data.duckdb —
      a dedicated non-rebuildable DB parallel to raw_data.duckdb.

      Metadata MUST NOT be written to:
      - app_data.duckdb (rebuildable, would destroy metadata on rebuild)
      - any of the 6-layer ETL files (raw / staged / transformed /
        processed / cleansed)

      Each metadata table has exactly ONE canonical physical location;
      no duplication across DBs.

      meta_data.duckdb is "the 7th layer" — parallel to the 6-layer
      transaction flow, not through it:

        raw (0IM, non-rebuildable)
           ↓
        staged → transformed → processed → cleansed → app_data
                (all rebuildable)

        meta_data.duckdb  (parallel, non-rebuildable; survives rebuilds)

      Canonical metadata tables include:
      - df_platform (platform dictionary, sourced from app_config.yaml)
      - df_product_line (sourced from df_product_line.csv seed)
      - df_product_mapping (cross-platform ID mapping)
      - df_category_hierarchy (category tree)
      - df_customer_labels (segment labels)
      - df_variable_metadata (UI display names)
      - df_config_* (application configs)
      - df_*___COMPANY suffix diagnostic artefacts (preserved per DM_R037 v3.0)

      Reader pattern: direct connection OR DuckDB ATTACH (for cross-DB JOIN).
      Quote the path with DBI::dbQuoteString() (never raw sprintf) and reference
      attached tables via dbplyr::in_schema() (never "schema.table" string literal,
      DM_R023 v1.2):
        attach_sql <- paste0("ATTACH DATABASE ",
                             DBI::dbQuoteString(con, db_path_list$meta_data),
                             " AS meta (READ_ONLY)")
        dbExecute(con, attach_sql)
        tbl2(con, dbplyr::in_schema("meta", "df_platform")) %>% collect()

      Producer contract: exactly one ETL script owns metadata production
      (e.g., all_ETL_meta_init_0IM.R), declares CONSUMES/PRODUCES per MP140,
      idempotent, leaves ___COMPANY-suffixed diagnostic tables untouched
      (triple underscore per DM_R037 v3.0).

      v2.1 runtime contract (addendum, mode-aware in v2.1.1):

      1. Runtime MAY NOT read CSV seeds. CSV files at
         data/app_data/parameters/scd_type1/*.csv are bootstrap inputs
         consumed ONLY by producer ETLs (all_ETL_meta_init_0IM.R for
         local DuckDB, upload ETL for Supabase). Every other code path
         (Shiny entry, UPDATE_MODE init, DRV, ETL consumers) MUST read
         the canonical metadata backend — there is no CSV fallback.

      2. Readers SHALL reach the canonical metadata backend through
         fn_load_product_lines. The helper routes via dbConnectAppData()
         and picks the backend based on app_config.yaml > database.mode:
           - duckdb    → local meta_data.duckdb
           - supabase  → live Supabase public.df_product_line
           - auto      → DuckDB if reachable, else Supabase
         Direct dbReadTable(meta_con, "df_product_line") from non-library
         scripts is forbidden. Cross-DB JOINs via ATTACH still OK inside
         SQL, but any in-memory R assignment of df_product_line uses
         fn_load_product_lines (single schema-validation point).

      3. APP_MODE autoinit() SHALL populate db_path_list$meta_data IF
         meta_data.duckdb is reachable on disk (DuckDB mode). In
         Supabase-only deploys the file is absent and db_path_list$meta_data
         is skipped — fn_load_product_lines(mode = "auto") will fall
         through to dbConnectAppData() and reach Supabase without the
         local path. app_data remains a hard requirement with fail-fast.
         UPDATE_MODE already populates all paths via pipeline init and is
         unaffected.

    rule_formal: |
      RULE DM_R054_METADATA_STORAGE (v2):

      data_partition (by rebuildability, DM_R061):
        non_rebuildable = {raw_data, meta_data}
        rebuildable     = {staged, transformed, processed, cleansed, app_data}

      metadata_classification:
        metadata = {reference, lookup, mapping, dictionary, config tables}

      storage_rule:
        FOR EVERY metadata table M:
          M SHALL live EXCLUSIVELY in meta_data.duckdb
          M SHALL NOT exist in app_data.duckdb
          M SHALL NOT flow through 6-layer ETL

      single_canonical_location:
        FOR EVERY metadata table M:
          EXISTS exactly one physical location(M) = meta_data.duckdb

      rebuild_safety:
        FOR EVERY operation O in {rm app_data, tar_destroy(app_data),
                                   make run FORCE=1}:
          O SHALL NOT modify or delete meta_data.duckdb

      producer_contract:
        EVERY metadata table M has exactly one producer ETL
        producer declares CONSUMES + PRODUCES (MP140)
        producer is idempotent
        producer SHALL NOT drop tables it does not own (e.g. ___COMPANY suffix)

      reader_contract:
        reader SHALL access meta_data.duckdb at canonical path (DM_R062)
        reader MAY use direct connection OR DuckDB ATTACH
        reader SHALL NOT read from app_data.table for metadata tables

      // v2.1 addendum (2026-04-19), mode-aware in v2.1.1 (2026-04-20)

      runtime_csv_seed_rule:
        FOR EVERY process P in runtime(Shiny | UPDATE_MODE | DRV | ETL-consumer):
          P SHALL NOT read metadata CSV seed files
        ONLY a canonical producer ETL MAY read CSV seeds (bootstrap):
          - all_ETL_meta_init_0IM.R (DuckDB mode producer)
          - upload ETL for Supabase (Supabase mode producer, separate)
        no CSV fallback at runtime: canonical backend missing → stop()

      canonical_reader_rule (v2.1.1):
        runtime_canonical_source(mode) =
          CASE mode
            WHEN "duckdb"   THEN meta_data.duckdb via DBI
            WHEN "supabase" THEN live Supabase public.df_* via dbConnectSupabase
            WHEN "auto"     THEN DuckDB IF reachable ELSE Supabase
        FOR EVERY runtime consumer C of df_product_line:
          C SHALL call fn_load_product_lines(conn, meta_data_path, mode, ...)
          C SHALL NOT open a direct connection and call DBI::dbReadTable
                   for df_product_line outside fn_load_product_lines
        CROSS-DB JOIN via ATTACH permitted in SQL; in-memory R assignment
                   of df_product_line MUST route through fn_load_product_lines

      app_mode_autoinit_rule (v2.1.1):
        IN APP_MODE:
          autoinit() SHALL populate db_path_list$app_data (HARD, fail-fast if missing)
          autoinit() SHALL populate db_path_list$meta_data IFF file.exists(meta_data)
                     (soft/optional — absent in Supabase-mode deploys)
        UPDATE_MODE pipeline init already populates all paths (unchanged)

      deploy_bundle_rule (v2.1.1):
        meta_data.duckdb SHALL NOT ship in the Posit Connect deploy bundle.
        Supabase deploys read metadata from the live Supabase backend;
        the CSV seed ships (not required at runtime but small, kept for
        accidental fallback prevention via upload ETL).

    violations:
      - "Writing metadata to app_data.duckdb (v1 pattern, now forbidden)"
      - "Duplicating same metadata table across app_data and meta_data"
      - "Metadata going through 6-layer ETL (raw → staged → ...)"
      - "Adding fallback branches to read metadata from multiple paths"
      - "Producer ETL dropping ___COMPANY diagnostic tables it does not own"
      - "Runtime reader silently falling back to CSV when canonical backend missing (v2.1 §6)"
      - "Non-library script calling DBI::dbReadTable(meta_con, 'df_product_line') directly, bypassing fn_load_product_lines (v2.1 §7)"
      - "Shiny entry doing read.csv('.../df_product_line.csv') at startup (v2.1 §6)"
      - "fn_load_product_lines hardcoded to meta_data.duckdb only (ignores database.mode, breaks Supabase deploys) — v2.1.1 regression"
      - "Shipping meta_data.duckdb in the Posit Connect deploy bundle (v2.1.1 deploy_bundle_rule)"
      - "APP_MODE autoinit fail-fasting on missing meta_data.duckdb when Supabase mode is active (v2.1.1 app_mode_autoinit_rule)"
    compliant:
      - "all_ETL_meta_init_0IM.R writes df_platform + df_product_line to meta_data.duckdb (single canonical producer)"
      - "DRV script reads metadata via ATTACH DATABASE 'meta_data.duckdb' AS meta"
      - "rm app_data.duckdb → make run: app_data rebuilt from upstream, meta_data untouched"
      - "Removing duplicate df_platform from app_data.duckdb (canonical remains in meta_data)"
      - "Shiny entry calls fn_load_product_lines(conn, meta_data_path = db_path_list$meta_data, mode = 'auto') — picks DuckDB locally, Supabase in production (v2.1 §7 + v2.1.1)"
      - "APP_MODE autoinit() populates db_path_list$meta_data only when the file exists; Supabase deploys skip it (v2.1.1)"
      - "Producer ETL is the ONLY caller of read.csv('.../df_product_line.csv'); all other code paths read the canonical metadata backend via fn_load_product_lines (v2.1 §6)"
      - "Makefile deploy-sync excludes *.duckdb; meta_data.duckdb stays local — Supabase is the production canonical (v2.1.1)"

    dependencies:
      - "MP064"   # ETL-Derivation Separation — metadata is outside both
      - "DM_R061" # Rebuildability — metadata belongs to non-rebuildable partition
      - "DM_R062" # Canonical path enforcement — no fallback branches
      - "MP140"   # Pipeline orchestration — producer declares PRODUCES
      - "MP029"   # No fake information — canonical location is fact

    metadata:
      revised: "2026-04-20"
      revised_by: "spectra changes metadata-to-meta-data-duckdb (v2) + dm-r054-v2-migration-complete (v2.1 + v2.1.1 hotfix)"
      motivation_issue: "#422 (v2) / #424 (v2.1 + v2.1.1)"
      breaking_change: true
      migration_guide: "See spectra changes metadata-to-meta-data-duckdb (v2 foundation) and dm-r054-v2-migration-complete (v2.1 runtime cleanup + v2.1.1 mode-aware hotfix for Posit Connect Supabase deploys)"

  - id: DM_R060
    type: rule
    name: etl_independence_requirements
    display_name: "ETL Independence Requirements"
    one_liner: "ETL scripts must be independently runnable"
    file_path: "CH02_data_management/rules/DM_R040_etl_independence_requirements.qmd"
    note: "Renumbered from DM_R040 to DM_R060 to resolve ID collision with DM_R040 (Structural Join Pattern) and DM_R055 (App Data Aggregation Preference). QMD file retains old filename."

    rule_natural: |
      Each ETL script must be independent:
      - Self-contained execution
      - Own initialization
      - Clear input/output contract
      - No hidden dependencies

    rule_formal: |
      RULE DM_R060_INDEPENDENCE:
      FOR ALL etl_script S:
      is_self_contained(S)
      AND has_own_init(S)
      AND documents_io(S)

    violations:
      - "ETL relying on global state"
      - "Undocumented dependencies"
    compliant:
      - "Standalone script with all deps sourced"

  - id: DM_R057
    type: rule
    name: unit_suffix_column_naming
    display_name: "Unit Suffix Column Naming"
    one_liner: "Include unit suffix in column names when values contain specific units"
    file_path: "CH02_data_management/rules/DM_R057_unit_suffix_column_naming.qmd"

    rule_natural: |
      When a column contains values with specific units, include unit suffix:
      - Time: _secs, _minutes, _hours, _days, _weeks, _months, _years
      - Size: _bytes, _kb, _mb, _gb
      - Ratio: _pct, _ratio, _bps
      - Currency: _usd, _twd, _jpy
      - MANDATORY for difftime conversions
      - Prevents unit confusion and ambiguity

    rule_formal: |
      RULE DM_R057_UNIT_SUFFIX:
      FOR ALL column C with unit U:
      column_name(C) = base_name + "_" + unit_suffix(U)

      unit_suffix_mapping = {
        seconds -> "secs",
        minutes -> "minutes",
        hours -> "hours",
        days -> "days",
        bytes -> "bytes",
        percentage -> "pct"
      }

      MANDATORY: difftime_conversion REQUIRES unit_suffix

    violations:
      - "as.numeric(difftime(...)) without unit suffix"
      - "processing_time without _secs or _minutes"
      - "file_size without _bytes or _mb"
    compliant:
      - "execution_time_secs = as.numeric(difftime(..., units='secs'))"
      - "customer_tenure_days"
      - "file_size_bytes"

  - id: DM_R058
    type: rule
    name: product_line_id_semantics
    display_name: "Product Line ID Semantics"
    one_liner: "Define product_line_id field semantics and 'all' handling"
    file_path: "CH02_data_management/rules/DM_R058_product_line_id_semantics.qmd"

    rule_natural: |
      product_line_id is a categorical identifier with three naming layers (v2):
      - UI Layer: product_line_id_chosen (user-selected value in sidebar, cfg$filters$product_line_id_chosen)
      - Slice Layer: product_line_id_sliced (DRV pre-computed data slice, cfg$filters$product_line_id_sliced)
      - DB Layer: product_line_id_filter (DuckDB WHERE column)
      - ETL Source: product_line_id (original column, unchanged)
      Data flow: chosen → sometimes equals sliced, sometimes equals filter
      Special value 'all' represents aggregate across all lines
      Works with platform_id in hierarchical relationship
      Position components read cfg$filters$product_line_id_chosen
      Micro/Poisson components prefer product_line_id_sliced, fallback to product_line_id_chosen

    rule_formal: |
      RULE DM_R058_PRODUCT_LINE:
      product_line_id is categorical identifier

      naming_layers = {
        ui_layer -> filters.product_line_id_chosen,
        slice_layer -> filters.product_line_id_sliced,
        db_layer -> product_line_id_filter,
        etl_source -> product_line_id
      }

      data_flow:
        product_line_id_chosen -> product_line_id_sliced | product_line_id_filter

      value_domain = {
        "all" -> meta_value (aggregate),
        "PL001", "PL002", ... -> specific lines
      }

      hierarchy:
        platform_id > product_line_id

      drv_handling:
        IF script.header.ALL_SUPPORT THEN allow "all"
        IF script.header.FORBIDS_ALL THEN reject "all"

    violations:
      - "Using 'all' without ALL_SUPPORT declaration"
      - "Missing product_line_id in standardized output"
      - "No validation for invalid product_line_id values"
      - "Shiny component reading bare cfg$filters$product_line_id (must use _chosen or _sliced)"
      - "Using cfg$product_line_id instead of cfg$filters$product_line_id_chosen"
    compliant:
      - "Header declares ALL_SUPPORT: product_line_id"
      - "Validates product_line_id parameter"
      - "Supports both 'all' and specific values"
      - "Position components read cfg$filters$product_line_id_chosen"
      - "Micro/Poisson components prefer product_line_id_sliced, fallback to product_line_id_chosen"

  - id: DM_R059
    type: rule
    name: drv_output_schema_contract
    display_name: "DRV Output Schema Contract"
    one_liner: "DRV output tables must have identical schema across all backends"
    file_path: "CH02_data_management/rules/DM_R059_drv_output_schema_contract.qmd"

    rule_natural: |
      DRV output schema must be a cross-backend contract:
      - Each DRV output table has ONE canonical column name set
      - Canonical names are the single source of truth
      - No aliases or compatibility shims in final DRV output
      - All downstream consumers (UI components, APIs) use canonical names only
      - ensure_dna_fields() style alias functions are migration aids, not permanent solutions

      Canonical naming conventions for DRV columns:
      - Raw metrics: short lowercase (cai, clv, cri, be2, pcv, ni)
      - ECDF-derived scores: dna_{dimension}_score (dna_r_score, dna_f_score, dna_m_score)
      - Raw dimension values: {dimension}_value (r_value, f_value, m_value)
      - Status/category: {concept}_status or {concept}_segment (nes_status, dna_segment)
      - Filter dimensions: {dimension}_filter (product_line_id_filter)
      - Counts: {noun} or {noun}_count (times, ni)
      - Temporal: {metric}_mean or {metric}_median (ipt_mean)

      Optional columns (may not exist in all backends):
      - Components must check column existence before use
      - Use dbListFields() or tryCatch() pattern
      - Provide graceful fallback when column absent

    rule_formal: |
      RULE DM_R059_SCHEMA_CONTRACT:
      FOR EACH drv_output_table T:
        T.schema MUST BE identical across {DuckDB, Supabase, any_future_backend}
        T.columns = canonical_names ONLY (no aliases)

      NAMING_CONVENTION:
        raw_metric -> lowercase_short: cai, clv, cri, be2, pcv
        ecdf_score -> dna_{dim}_score: dna_r_score, dna_f_score, dna_m_score
        raw_value -> {dim}_value: r_value, f_value, m_value
        status -> {concept}_status: nes_status
        filter -> {dim}_filter: product_line_id_filter

      OPTIONAL_COLUMN_HANDLING:
        IF column MAY NOT exist in backend:
          consumer MUST check existence BEFORE use
          consumer MUST provide graceful fallback

      ALIAS_DEPRECATION:
        ensure_dna_fields() alias pattern -> DEPRECATED
        New code MUST NOT create column aliases
        Existing aliases -> migrate to canonical names

    violations:
      - "Creating alias columns (e.g., both cai and cai_value)"
      - "Component SQL using non-canonical names"
      - "Assuming optional column exists without check"
      - "Different column names in DuckDB vs Supabase for same data"
    compliant:
      - "DRV writes canonical names only (cai, not cai_value)"
      - "Component uses canonical name in SQL SELECT"
      - "Optional columns checked with dbListFields() before use"
      - "Schema identical across all configured backends"

  - id: DM_R061
    type: rule
    name: database_rebuildability_classification
    display_name: "Database Rebuildability Classification"
    one_liner: "Every DuckDB must be classified as rebuildable (derived) or non-rebuildable (raw data)"
    file_path: "CH02_data_management/rules/DM_R061_database_rebuildability_classification.qmd"
    derived_from: MP064

    rule_natural: |
      Every DuckDB file must be classified as rebuildable or non-rebuildable.
      Non-rebuildable: contains raw data (raw_data.duckdb) — delete = data loss.
      Rebuildable: derived from upstream (staged, transformed, processed, cleansed,
      app_data) — re-run pipeline to restore.
      Rebuild chain: raw -> staged -> transformed -> processed -> cleansed -> app_data.
      If a rebuildable DB has schema drift, re-run pipeline — do not manually patch.

    rule_formal: |
      RULE DM_R061_REBUILDABILITY:
      FOR ALL duckdb files D in data pipeline:
        classify(D) IN {REBUILDABLE, NON_REBUILDABLE}
      NON_REBUILDABLE: raw_data.duckdb, external source files
      REBUILDABLE: staged, transformed, processed, cleansed, app_data
      ON schema_drift(D) WHERE rebuildable(D): rerun_pipeline(upstream(D))

    violations:
      - "Hesitating to rebuild app_data because 'it might lose data'"
      - "Manually patching a derived table instead of re-running pipeline"
      - "Deleting raw_data.duckdb thinking it can be regenerated"
    compliant:
      - "Schema upgrade: modify DDL, re-run D00 + D01_04, data regenerated"
      - "Corrupted cleansed_data: re-run D01_02 from transformed_data"
      - "raw_data backed up separately, never deleted"

    dependencies:
      - "MP064"   # ETL-Derivation Separation defines the 6-layer chain
      - "MP154"   # Side Effect Defense — rebuilding derived data is deterministic

    metadata:
      created: "2026-03-30"
      triggered_by: "QEF_DESIGN p_alive schema upgrade — concern about data loss during rebuild"

  - id: DM_R062
    type: rule
    name: canonical_db_path_enforcement
    display_name: "Canonical DB Path Enforcement"
    one_liner: "DB files SHALL live at paths declared in db_paths.yaml; move misplaced files, do NOT add code fallbacks"
    file_path: "CH02_data_management/rules/DM_R062_canonical_db_path_enforcement.qmd"
    derived_from: MP029

    rule_natural: |
      Every .duckdb file must reside at the path declared in db_paths.yaml
      (databases: or domain: section). If a file is found at a non-canonical
      location, MOVE the file to the canonical path — do NOT change code to
      accommodate the wrong location. autoinit() and the pipeline-smart-cache
      helper both report missing when canonical path is empty, even if copies
      exist elsewhere. Archive misplaced files to data/archived/wrong_location/.

    rule_formal: |
      RULE DM_R062_CANONICAL_PATH:
      FOR EVERY .duckdb file D declared in db_paths.yaml:
        expected_path(D) := file.path(project_root, db_paths_yaml[D])
        IF NOT file.exists(expected_path(D)):
          STOP with actionable message (see autoinit-failfast-policy)
      WHEN misplaced(D) detected:
        MOVE D to expected_path(D)  # canonical
        ARCHIVE old_path TO data/archived/wrong_location/<name>_YYYYMMDD.duckdb
      FORBID: add fallback branches in sc_Rprofile.R or any helper

    violations:
      - "Adding `if-else` in sc_Rprofile.R to try multiple DB path candidates"
      - "Editing db_paths.yaml to point to a non-canonical location where a stale copy lives"
      - "Deleting both copies of a misplaced file without archiving"
    compliant:
      - "QEF_DESIGN had raw_data.duckdb at data/ root; moved to data/archived/wrong_location/"
      - "Helper reports missing → user moves file or runs ETL; code unchanged"
      - "New DB layer added: updated db_paths.yaml + ETL PRODUCES, no other changes"

    dependencies:
      - "MP029"   # No fake information — data location is fact, not assumption
      - "DM_R028" # ETL Data Type Separation — canonical 6-layer structure
      - "DM_R056" # Mode-Specific DB Paths — paths defined in db_paths.yaml
      - "SO_P018" # Directory Governance — no ad-hoc file locations

    metadata:
      created: "2026-04-19"
      triggered_by: "#421 autoinit-failfast-smart-cache debugging — QEF_DESIGN raw_data.duckdb found at data/ root, canonical is data/local_data/raw_data.duckdb"

  - id: DM_R063
    type: rule
    name: deploy_bundle_purity
    display_name: "Deploy Bundle Purity"
    one_liner: "Hosted Shiny deploys SHALL NOT ship local DB files; APP_MODE autoinit tolerates their absence; runtime routes via mode-aware backends"
    file_path: "CH02_data_management/rules/DM_R063_deploy_bundle_purity.qmd"
    derived_from: MP142

    rule_natural: |
      Posit Connect / Shinyapps.io deploy bundles carry only application
      code, CSV/YAML seeds, and deployment metadata — never `*.duckdb` or
      `*.wal` or `data/local_data/**`. Production Shiny reads canonical
      metadata from live remote backends (Supabase et al.) via
      `dbConnectAppData()`; the local DuckDB canonical (`meta_data.duckdb`)
      is dev-only.

      APP_MODE `autoinit()` running inside a deploy bundle tolerates
      absence of every local DB path. The fail-fast precheck from
      `autoinit-failfast-policy` (#421) is scoped to UPDATE_MODE and
      GLOBAL_MODE — those modes expect the ETL pipeline to have produced
      the files locally. APP_MODE on Posit Connect has no ETL pipeline;
      missing files are the expected state.

      Makefile `deploy-sync` targets use `--exclude='*.duckdb'` without
      negated exceptions. `.rsconnectignore` keeps `*.duckdb` unqualified.
      If a specific DB file is structurally necessary in the bundle
      (not encountered to date), document the exemption in the
      principle's exemption_list section.

    rule_formal: |
      RULE DM_R063_DEPLOY_BUNDLE_PURITY:

      bundle_allowlist:
        {app.R, *.Rmd, *.qmd, scripts/global_scripts/**, scripts/nsql/**,
         www/**, data/app_data/parameters/**/*.csv, app_config.yaml,
         manifest.json, rsconnect/**, .Rprofile, .rsconnectignore}

      bundle_denylist:
        {*.duckdb, *.wal, data/local_data/**, data/app_data/*.duckdb,
         _targets/**, *.log, _cache/**, renv/**}

      deploy_sync_rule:
        FOR EVERY Makefile deploy-sync target:
          rsync SHALL include --exclude='*.duckdb'
          cp commands SHALL NOT match *.duckdb
        FORBID: cp data/*/*.duckdb $(DEPLOY_DIR)/...

      rsconnectignore_rule:
        `.rsconnectignore` SHALL contain `*.duckdb` as an unqualified line.
        FORBID: `!data/*/*.duckdb` or any negated DuckDB path.

      app_mode_autoinit_rule:
        IN sc_Rprofile.R autoinit fail-fast precheck:
          run_precheck := (OPERATION_MODE != "APP_MODE")
          IF run_precheck: check every db_path_list entry exists
          ELSE: skip the check entirely
        UPDATE_MODE and GLOBAL_MODE still fail-fast (unchanged).

      runtime_reader_rule:
        APP_MODE readers SHALL route metadata reads via mode-aware helpers
        (fn_load_product_lines(mode="auto"), dbConnectAppData()) — these
        honor app_config.yaml > database.mode and reach the configured
        remote backend when local DuckDB is absent.

    violations:
      - "Makefile deploy-sync: `cp data/local_data/meta_data.duckdb $(DEPLOY_DIR)/...`"
      - "rsync in deploy-sync missing `--exclude='*.duckdb'`"
      - ".rsconnectignore has `!data/local_data/meta_data.duckdb` negated exception"
      - "sc_Rprofile.R fail-fast precheck runs in APP_MODE (no OPERATION_MODE guard)"
      - "Shiny entry opens DBI::dbConnect(duckdb::duckdb(), db_path_list$meta_data) directly — breaks on Posit Connect"
      - "Shipping data/local_data/**/*.duckdb, data/app_data/*.duckdb, or _targets/** in deploy bundle"

    compliant:
      - "MAMBA/.rsconnectignore: `*.duckdb` unqualified; no negated exceptions"
      - "MAMBA/Makefile deploy-sync: rsync with `--exclude='*.duckdb'`; explicit NOTE that meta_data.duckdb stays local (Supabase canonical)"
      - "sc_Rprofile.R: `run_precheck <- !identical(.InitEnv$OPERATION_MODE, 'APP_MODE')`"
      - "fn_load_product_lines(mode='auto') + dbConnectAppData() route Supabase in production, DuckDB locally"
      - "Posit Connect live MAMBA serves via Supabase without any bundled DuckDB (deploy commit 1014f7b, 2026-04-20)"

    dependencies:
      - "MP142"    # Configuration-Driven Pipeline — database.mode drives backend selection
      - "DM_R054"  # Metadata Table Storage Pattern (v2.1.1 mode-aware canonical)
      - "DM_R056"  # Mode-Specific DB Paths — precheck scope
      - "DM_R062"  # Canonical DB Path Enforcement — canonical paths are local, bundle has none
      - "SEC_R001" # Credential Management — Supabase creds via Posit env vars

    metadata:
      created: "2026-04-20"
      triggered_by: "#424 three-layer fix chain (a8d9aab → c90c540 → 4daed19 → 1014f7b): fn_load_product_lines hardcoded DuckDB + bundle shipped meta_data.duckdb + autoinit fail-fast in APP_MODE, all independently failed on MAMBA Posit Connect (Supabase canonical). Codified to prevent rediscovery."
      motivation_issue: "#431"

  # ============================================================================
  # DM_R064: Column-Name Access Over Positional Access
  # ============================================================================
  - id: DM_R064
    type: rule
    name: column_name_access_over_positional
    display_name: "Column-Name Access Over Positional Access"
    one_liner: "讀取 tabular 資料必須用 header/欄位名,不可用 positional index"
    parent_principle: MP064
    related: [DM_R023, DM_R028, IC_P002, MP029, MP154]
    triggered_by: "Issue #403, #457"
    scope: "all tabular data reads (Google Sheets, Excel, CSV, DataFrames, SQL)"
    file_path: "CH02_data_management/rules/DM_R064_column_name_access_over_positional.qmd"

    rule_natural: |
      When reading tabular data (Google Sheets, Excel, CSV, DataFrames, SQL
      results), columns MUST be accessed by header name, never by positional
      index. Positional arithmetic (col_idx + N, df[[4]], SELECT column_4)
      creates silent bugs when column order shifts or block layout changes.

    rule_formal: |
      RULE DM_R064_column_name_access_over_positional:
        WHEN reading tabular data (sheet / csv / dataframe / sql result)
        THEN MUST access columns by name
        PROHIBITED:
          - integer_index_access: df[[N]] where N is integer literal or arithmetic
          - offset_arithmetic: col_idx + N as column resolver
          - unnamed_sql_column: SELECT column_N FROM tbl (no alias)
          - positional_pivot: pivot_longer(cols = c(4, 5, 6))
        COMPLIANT:
          - named_index: df[["brand"]] or df$brand
          - header_resolver: which(names(df) == "brand")
          - named_sql: SELECT brand FROM tbl
          - named_pivot: pivot_longer(cols = c("Q1", "Q2", "Q3"))
          - row_bind_blocks: build named data.frame per block, bind_rows, query by name
        EXCEPTIONS:
          - genuinely_headerless_data (raw matrix, pixel array)
          - positional_is_the_semantic (ordered rankings)
          - parse_time_resolution (resolve position → name once at boundary)

    violations:
      - "amz_ETL_competitor_ids_0IM.R: brand_idx = col_idx + 4 (#403 root cause)"
      - "df[[4]] to grab brand column by assumed position"
      - "SELECT column_4 FROM sales without alias"
      - "pivot_longer(cols = c(4, 5, 6)) when names are known"

    compliant:
      - "df$brand / df[['brand']] for direct access"
      - "brand_col_name <- names(sheet)[grep('^品牌', names(sheet))[1]]; then use by name"
      - "row_bind blocks: per product line extract 5 named cols, bind_rows, query by name"
      - "tbl2(con, 'df_competitors') %>% select(brand) %>% collect()"

    case_study_403: |
      Sheet block layout was [品牌][ASIN][產品編碼][銷售][評論] (brand first).
      ETL assumed [ASIN][sales][review][?][brand] (brand 4 positions after ASIN).
      Result: rpl (last line) → col_idx + 4 > 60 cols → 100% UNKNOWN;
      other lines → brand column actually belongs to *next* product line block,
      silent mis-mapping that looks like valid data. Same bug across 5 consuming
      companies (QEF_DESIGN, D_RACING, MAMBA, WISER, kitchenMAMA).
      Fix: row_bind blocks with named columns; no more positional arithmetic.

    enforcement:
      current: "manual code review; grep self-check before commit"
      planned: "pre-commit hook scanning for col_idx + N and df[[integer]] patterns (warn not block)"

  # ============================================================================
  # DM_R065: Schema Dedup Discipline
  # ============================================================================
  - id: DM_R065
    type: rule
    name: schema_dedup_discipline
    display_name: "Schema Dedup Discipline"
    one_liner: "Schema authoring SHALL enforce alias dedup at Layer 1 (within-field normalize + cross-field collision ban) and multi-column merge syntax at Layer 2 (bridge yaml from_columns + merge_strategy); Layer 1 schema yaml SHALL NOT enumerate per-source column lists"
    parent_principle: MP102
    related: [MP157, MP158, MP159, MP102, MP154, DM_R028, DOC_R009]
    triggered_by: "GitHub issue #493 — Phase 9 review surfaced 13+ within-field alias dups + 1 cross-field SKU collision in core_schemas.yaml; needed multi-column merge syntax for upcoming 18 attribute bridges in qef-product-master-redesign Phase 9"
    scope: "core_schemas.yaml + platform_extensions/*.yaml + bridges/{COMPANY}/{platform}/{source}.bridge.yaml + validate_bridge_yaml.R linter"
    file_path: "CH02_data_management/rules/DM_R065_schema_dedup_discipline.qmd"
    version: "1.0"
    date_created: "2026-04-28"

    rule_natural: |
      Three dedup rules SHALL be enforced together:

        Rule 1 — Within-field aliases (Layer 1):
          aliases lists are treated as set-of-normalized-string.
          Normalization: lowercase + trimws + strip non-alphanumerics.
          Two yaml entries producing the same normalized form are duplicates;
          only one representative SHALL be kept.

        Rule 2 — Cross-field aliases (Layer 1):
          A single normalized alias key SHALL NOT appear in two different
          fields' aliases lists within the same datatype. Resolution heuristics:
          (a) field-name suffix match wins (alias "sku" -> sku.aliases),
          (b) source-canonical match wins (alias "asin" -> product_id.aliases at amz),
          (c) most-specific field wins.

        Rule 3 — Multi-column merge (Layer 2):
          When a prerawdata source has multiple columns mapping to a single
          canonical field, the bridge yaml SHALL use:
            from_columns: [<col1>, <col2>, ...]
            merge_strategy: <coalesce | concat | first_non_null>
          Layer 1 canonical schema SHALL NOT enumerate per-source column lists.

      Decision rule: "Is this fact about THIS source's column structure, or
      about ALL canonical sources of this datatype?" Per-source -> Layer 2
      from_columns; universal -> Layer 1 alias entry.

      The merge_strategy is mandatory when from_columns is used (no implicit
      default) — bridge author must make the choice explicit. The existing
      from_column: <single> syntax remains valid for the 1:1 mapping case.

    rule_formal: |
      RULE DM_R065_SCHEMA_DEDUP_DISCIPLINE:

      DEFINE normalize(s) AS:
        s |> tolower() |> trimws() |> gsub("[^a-z0-9]", "")

      INVARIANT 1 (within-field dedup):
        FORALL datatype d, FORALL field f in d.required_fields ∪ d.optional_fields:
          LET aliases_norm = { normalize(a) : a in f.aliases }
          REQUIRE: |aliases_norm| == |f.aliases|  -- no duplicates after normalize

      INVARIANT 2 (cross-field collision ban):
        FORALL datatype d:
          LET pairs = { (normalize(a), f.name) : f in d.fields, a in f.aliases }
          REQUIRE: no two pairs share the same first element with different second elements

      INVARIANT 3 (Layer 2 multi-column merge):
        FORALL bridge yaml b, FORALL canonical_field cf in b.column_mapping:
          IF cf.from_columns is set THEN
            REQUIRE: cf.merge_strategy in {coalesce, concat, first_non_null}
            REQUIRE: cf.from_column is NOT set (mutually exclusive)
            REQUIRE: |cf.from_columns| >= 2
          ELSE IF cf.from_column is set THEN
            REQUIRE: cf.from_columns is NOT set (mutually exclusive)

      ENFORCEMENT:
        validate_bridge_yaml.R SHALL include:
          - within_field_dup_detector (load aliases, normalize, fail on dup) -> CRITICAL
          - cross_field_collision_detector (build map, fail on second-seen) -> CRITICAL
          - value_map_normalize_detector (case-variant brute force) -> WARNING

    violations:
      - "products.product_id.aliases lists both 'asin' and 'ASIN' (within-field dup; both normalize to 'asin')"
      - "alias 'SKU' appears in both products.product_id.aliases AND products.sku.aliases (cross-field collision)"
      - "Bridge author adds 'email_primary' and 'email_archive' as new aliases in core_schemas.yaml to handle a multi-column source (violates rule 3 + MP159)"
      - "value_map ships with both 'Amazon': 'AFN' AND 'AMAZON': 'AFN' (case-variant brute force; should use coercion.rule tolower then keep one canonical key)"

    compliant:
      - "products.product_id.aliases keeps only 'asin' (one representative for normalized 'asin') after dedup sweep"
      - "alias 'sku' resolved to products.sku.aliases (field-name suffix match wins); products.product_id.aliases keeps only 'asin' / 'ASIN' equivalents"
      - "Bridge yaml maps email_primary + email_archive via from_columns: ['email_primary', 'email_archive'] + merge_strategy: 'coalesce' (Layer 2 multi-column merge)"
      - "value_map uses coercion.rule: 'tolower' + single canonical entry 'amazon': 'AFN' instead of listing all case variants"

    migration_path:
      pre_existing_within_field_dups: |
        1. Run linter; collect normalized-form duplicate list.
        2. For each dup, choose representative (most natural source-form;
           prefer lowercase if all variants are merely casing differences).
        3. Remove others; commit as single sweep with IC_P002 Verified: trailer.

      pre_existing_cross_field_collisions: |
        1. Apply resolution heuristics (suffix match / source-canonical /
           most-specific).
        2. If still ambiguous, remove from BOTH fields, require explicit
           bridge.from_column: mapping.
        3. Document decision in datatype-level # comment block.

    dependencies:
      - "MP102"   # Layer 1 schema files this rule binds
      - "MP157"   # Layer 1 vs Layer 2 boundary this rule preserves
      - "MP158"   # 3-step extensibility this rule supports (Step 1 + Step 3 separation)
      - "MP159"   # Layer 1 immutability — DM_R065 is MP159's safety valve for un-mappable per-source structures
      - "MP154"   # Avoiding silent ambiguity in alias resolution
      - "DM_R028" # Table naming this rule preserves
      - "DOC_R009" # This rule itself follows DOC_R009 (Layer 1 .qmd + Layer 2 yaml + Layer 3 .claude/rules)

  - id: DM_R066
    type: rule
    name: drv_platform_agnosticism
    display_name: "DRV Platform Agnosticism"
    one_liner: "DRV scripts (`update_scripts/DRV/**/*.R`) SHALL NOT embed platform identifiers in filenames, paths, headers, SQL templates, or output table literals. Platform identity SHALL flow from runtime via Sys.getenv('DRV_PLATFORM') primary -> Sys.getenv('MAMBA_PLATFORM') fallback -> --platform CLI flag last; absent platform = fail-fast stop(). Scope: all DRV groups (D01-D11) across 5 consuming companies. Sibling to DM_R028 (which prescribes per-platform naming for ETL layer — DM_R066 explicitly proscribes the same for DRV layer where algorithm operates on canonical schema and per-platform variation has no algorithmic justification). The de-facto extension of DM_R028 into DRV is convention drift; DM_R028 v2.4 amendment adds scope-clarification clause cross-referencing DM_R066."
    parent_principle: MP064
    related: [DM_R028, DM_R042, DM_R047, MP064, MP140, MP165]
    triggered_by: "GitHub issue #670 — surfaced during #668 (MP165 v1.3) close-out conversation on 2026-05-14. Third layer of #661 root cause analysis: adding a platform to DRV requires writing a near-100% duplicate `<platform>_<group>_<seq>.R` file, compounded by hard-coded `PLATFORMS` list in `update_all_platforms_poisson.R` (DM_R047)."
    scope: "shared/update_scripts/DRV/**/*.R (all DRV groups, all consuming companies) + shared/update_scripts/_targets.R (orchestrator dispatch path resolution) + shared/global_scripts/04_utils/fn_resolve_drv_platform.R (helper) + DM_R028 .qmd (scope-clarification amendment)"
    file_path: "CH02_data_management/rules/DM_R066_drv_platform_agnosticism.qmd"
    version: "1.0"
    date_created: "2026-05-14"

    rule_natural: |
      Three contracts SHALL hold together:

        Contract 1 — Forbidden hard-coding surfaces:
          DRV scripts SHALL NOT embed platform identifiers (cbz, amz, eby, shp,
          tiktok, etc.) in:
            - Filenames
            - Directory paths (DRV/cbz/, DRV/eby/)
            - Header `# PLATFORM: <platform>` tags
            - SQL templates (sprintf("df_cbz_%s", ...))
            - Output table literals (dbWriteTable(con, "df_eby_*", ...))
            - Any other surface that becomes a structural feature of the script

          Only acceptable occurrence: inside an explicit `valid_platforms`
          whitelist constant that the script consults at runtime for
          validation purposes.

        Contract 2 — Required resolution mechanism:
          DRV scripts SHALL resolve platform identity at startup via three
          fallback sources in priority order:
            1. Sys.getenv("DRV_PLATFORM")           — primary (new env var)
            2. Sys.getenv("MAMBA_PLATFORM")          — fallback (existing
                                                       orchestrator env var,
                                                       backward compat)
            3. --platform <code> CLI flag           — last resort (direct
                                                       Rscript invocation)

          Absent platform from all three sources -> stop() fail-fast with
          structured error message naming the script + all three sources
          tried.

          Invalid platform (not in get_platform_config() active list) ->
          stop() fail-fast with valid platforms listed.

          Resolution SHALL happen in a single helper (resolve_drv_platform())
          called once per script — NO inline Sys.getenv() reads scattered
          through SQL templates.

        Contract 3 — Filesystem structure:
          DRV scripts SHALL live in group-based subdirectories (DRV/D04/,
          DRV/D01/, DRV/all/, etc.) — NOT per-platform subdirectories
          (DRV/cbz/, DRV/eby/, DRV/amz/).

          Orchestrator (_targets.R) `resolve_script_path()` SHALL try
          group-based path first, fall back to per-platform path for
          backward compat during incremental rollout.

      Scope: universal across all DRV groups (D01-D11) and 5 consuming
      companies (QEF_DESIGN / D_RACING / MAMBA / WISER / kitchenMAMA).

      Decision rule: "Does this DRV operate on canonical schema (input is
      df_<platform>_*___transformed in canonical column names)?" YES (default
      for DRV layer) -> SHALL be platform-agnostic per DM_R066. NO (e.g.,
      pre-canonical staging logic) -> consider whether the script belongs in
      ETL layer instead.

    rule_formal: |
      RULE DM_R066_DRV_PLATFORM_AGNOSTICISM:

      DEFINE platform_literal(s, platform_list) AS:
        s contains exact match of any code in platform_list (case-sensitive)

      DEFINE active_platforms AS:
        names(get_platform_config()) intersected with status:active

      DEFINE valid_platforms_whitelist(script) AS:
        the constant `valid_platforms` declared in the script body, if any

      INVARIANT 1 (no platform-name structural literals):
        FORALL script s in shared/update_scripts/DRV/**/*.R:
          FORALL surface in {filename, directory_path, header_comment,
                              sql_template, table_literal}:
            FORALL platform p in active_platforms:
              REQUIRE: NOT platform_literal(surface, {p})
              UNLESS surface is inside valid_platforms_whitelist(s)

      INVARIANT 2 (resolution chain):
        FORALL script s in shared/update_scripts/DRV/**/*.R:
          s SHALL call resolve_drv_platform() exactly once at startup
          resolve_drv_platform() SHALL try Sys.getenv("DRV_PLATFORM"),
                                            Sys.getenv("MAMBA_PLATFORM"),
                                            --platform CLI flag,
                                            in that order
          resolve_drv_platform() SHALL stop() if all three are empty
          resolve_drv_platform() SHALL stop() if platform NOT in active_platforms

      INVARIANT 3 (filesystem structure):
        FORALL script s in shared/update_scripts/DRV/**/*.R:
          dirname(s) SHALL match shared/update_scripts/DRV/<group>/
          where <group> in {D01, D02, D03, D04, D05, ..., all}
          NOT in {cbz, eby, amz, shp, ...} (platform-based subdirs deprecated)

        Transition period: orchestrator resolve_script_path() handles both
        group-based and per-platform paths; per-platform paths phased out
        as each DRV group migrates.

      ENFORCEMENT:
        Code review level — PRs touching DRV/**/*.R reviewed against this
          rule's invariants
        Orchestrator level — _targets.R dispatch contract requires platform
          via env var; direct invocation requires --platform flag
        Architectural level — refactoring per-platform DRV file = spectra
          change (e.g., this issue #670 establishes pattern on D04)

    violations:
      - "shared/update_scripts/DRV/cbz/cbz_D04_02.R (filename embeds platform 'cbz' + lives in per-platform subdir 'cbz/')"
      - "Header tag `# PLATFORM: cbz` inside DRV script body"
      - "sprintf('df_cbz_poisson_analysis_%s', pl) in SQL template (literal 'cbz' in formatted string)"
      - "dbWriteTable(con_app, 'df_cbz_poisson_analysis_all', merged_table) (output table literal contains platform)"
      - "PLATFORMS <- c('cbz', 'eby') in shared/update_scripts/DRV/update_all_platforms_poisson.R (meta-coupling — wrapper script encodes platform list)"
      - "fn_D03_01_core.R hard-codes amz-specific SQL columns (sister #671 — column-level rather than name-level; out of DM_R066 scope but same anti-pattern family)"

    compliant:
      - "shared/update_scripts/DRV/D04/D04_02.R (single platform-agnostic file in group-based subdir)"
      - "platform <- resolve_drv_platform() once at startup; subsequent SQL templates parameterized on `platform` variable"
      - "sprintf('df_%s_poisson_analysis_%s', platform, pl) (platform variable injection, no literal)"
      - "MAMBA_PLATFORM=cbz make run LAYER=drv TARGET=D04_02 (orchestrator passes platform via env var)"
      - "Rscript shared/update_scripts/DRV/D04/D04_02.R --platform eby (direct invocation with CLI flag)"

    migration_path:
      pilot_phase: |
        1. Audit one DRV group's per-platform files for hard-coding sites
        2. Consolidate <plat>_<group>_<seq>.R files into single group/<group>_<seq>.R
        3. Implement resolve_drv_platform() helper in 04_utils/
        4. Update _targets.R resolve_script_path() to try group-based first
        5. Cross-co verify byte-identical output via make verify-drv
        6. git rm legacy per-platform files
        7. Delete update_all_platforms_poisson.R (if applicable)

      rollout_phase: |
        After pilot succeeds, extend to remaining DRV groups in follow-up
        spectra changes. Each group audited independently for per-platform
        variation (legitimate vs naming duplication).

      backward_compat: |
        _targets.R dispatch handles both group-based and per-platform paths
        during transition. Non-refactored DRV groups continue to work via
        legacy path. No big-bang requirement.

    dependencies:
      - "DM_R028"  # Sibling: ETL prescribes per-platform; DM_R066 proscribes same for DRV
      - "DM_R042"  # Orchestrator Makefile invokes DRV scripts via env-var contract
      - "DM_R047"  # Revised/sunset alongside this rule (wrapper script deleted)
      - "MP064"    # Parent: ETL-Derivation Separation establishes DRV operates on canonical schema
      - "MP140"    # _targets.R orchestrator iterates platforms × scripts; resolution rides this iteration
      - "MP165"    # v1.3 gate validates DRV output shape; uniform naming simplifies the gate
      - "DOC_R009" # This rule itself follows DOC_R009 (Layer 1 .qmd + Layer 2 yaml + Layer 3 .claude/rules)

