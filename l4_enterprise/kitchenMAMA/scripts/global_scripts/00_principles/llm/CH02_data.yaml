      - "No input_sources section in schema_registry.yaml"
      - "Unmapped tab without documentation"
    compliant:
      - "amz_ETL_sales_0IM.R (reads config for source_type)"
      - "schema_registry.yaml with input_sources.google_sheets and input_sources.rawdata"

