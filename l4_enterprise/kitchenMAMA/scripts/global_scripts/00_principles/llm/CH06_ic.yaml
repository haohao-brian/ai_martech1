    name: "Universal Immediate Sync Principle"
    description: "Defines the universal sync pattern for all repositories"
    implements: MP014

  - level: principle
    id: IC_P002
    name: "Cross-Company Verification Principle"
    description: "Shared subrepo change must be verified against all consuming companies before commit"
    implements: MP122
    related: [IC_P001, MP029, TD_P002, TD_R007]

  - level: rule
    id: IC_R001
    name: "Global Scripts Synchronization Rule"
    description: "Strict implementation for global_scripts shared repo"
    implements: IC_P001

  - level: rule
