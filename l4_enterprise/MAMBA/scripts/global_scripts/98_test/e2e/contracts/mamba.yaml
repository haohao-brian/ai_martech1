# MP165 Dashboard Presence Contract — MAMBA
# Spectra change: dashboard-presence-verification
# Triggered context: #378 Phase 5 incident (eby 5-customer issue undetected
#   in production until user reported it post-deploy) — MP165 framework
#   would have caught this at deploy gate.
#
# Phase 1 (2026-05-13, refs #653) — new Phase 1 primitives available in
# contracts.R: assert_no_error_text / assert_no_hardcoded_english /
# assert_kpi_no_error_placeholder. Auto-suggested block reserved at end of
# file for Phase 3 adaptive-walker output (spectra change adaptive-dashboard-test-loop).
#
# Active platforms (per MAMBA/app_config.yaml > pipeline > platforms):
#   cbz (active) — Cyberbiz
#   eby (active) — eBay
#
# Threshold notes:
#   - MAMBA does not implement BrandEdge module; brandedge.enabled = false
#     (documents the opt-out explicitly; declarative DRV absence already
#     suffices but explicit flag aids reviewers).
#   - eby platform has small but non-zero customer base; min thresholds
#     calibrated to detect the #378 5-customer regression class.

company: MAMBA

modules:

  brandedge:
    enabled: false
    # MAMBA does not market on Amazon-style platforms; BrandEdge positioning
    # not applicable. No DRV target in MAMBA/scripts/update_scripts/DRV/
    # produces df_position. Per MP165 D5, declarative-dependency natural
    # opt-out applies; this enabled:false is documentation.
    sub_tabs: {}

  tagpilot:
    enabled: true
    sub_tabs:

      customerValue:
        active_product_lines: [all]
        contracts:
          # MAMBA cbz must have substantive customer base
          - selector: "customerValue-kpi_total_customers"
            assertion: "kpi >= 1000"
            severity: critical
          # eby must have NON-ZERO customers (the #378 trap was eby = 5)
          # Tier 2 deploy gate evaluates per active platform; eby tuple
          # SHALL satisfy this floor. Intentionally low (>=5) so eby
          # being merely sparse does not block deploy, but eby = 0 will.
          - selector: "customerValue-kpi_avg_order_value"
            assertion: "kpi > 0"
            severity: critical
          - selector: "customerValue-pie_value_segments"
            assertion: "plotly_non_empty_traces >= 1"
            severity: critical

      customerActivity:
        active_product_lines: [all]
        contracts:
          - selector: "customerActivity-kpi_avg_cai"
            assertion: "kpi != NA"
            severity: critical

      customerStatus:
        active_product_lines: [all]
        contracts:
          - selector: "customerStatus-pie_nes"
            assertion: "plotly_non_empty_traces >= 1"
            severity: critical

      customerLifecycle:
        active_product_lines: [all]
        contracts:
          # P(alive) BTYD requires > 100 customers per platform for stable
          # estimates. Critical floor matches the BTYD requirement.
          - selector: "customerLifecycle-table_predictions"
            assertion: "row_count_excluding_placeholders >= 1"
            severity: critical

  vitalsigns:
    enabled: true
    sub_tabs:

      customerRetention:
        active_product_lines: [all]
        contracts:
          # #378 customerRetention.R DuckDB-only MEDIAN() bug class — once
          # fixed, retention_rate must render non-zero on cbz.
          - selector: "customerRetention-kpi_retention_rate"
            assertion: "kpi > 0"
            severity: critical

  dashboard_overview:
    enabled: true
    sub_tabs:

      overview:
        active_product_lines: [all]
        contracts:
          - selector: "dashboardOverview-kpi_total_revenue"
            assertion: "kpi > 0"
            severity: critical
          - selector: "dashboardOverview-kpi_total_dna_customers"
            assertion: "kpi > 0"
            severity: critical
          - selector: "dashboardOverview-kpi_new_customer_rate"
            assertion: "kpi >= 0"
            severity: critical

