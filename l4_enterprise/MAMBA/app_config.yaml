# MAMBA Enterprise Platform Configuration
# L4 Enterprise Application
# Created: 2025-07-29
# Company: MAMBA

app:
  name: "MAMBA Enterprise Platform"
  version: "1.0.0"
  tier: "l4_enterprise"
  description: "AI-powered precision marketing solution for enterprise clients"

theme:
  version: 5
  bootswatch: cosmo
layout: navbar

brand_name: "MAMBA"
language: "zh_TW.UTF-8"
RAW_DATA_DIR: "./data/local_data/rawdata_MAMBA"
parameters_folder: "default"

# Environment variables should be in .env file
# OPENAI_API_KEY: [set in .env]

# Database connection configuration (MP142: Configuration-Driven Pipeline)
# Mode options:
#   - "duckdb": Force use local DuckDB file (for local development)
#   - "supabase": Force use Supabase PostgreSQL (for deployment testing)
#   - "auto": Auto-detect (DuckDB if valid local file exists, else Supabase)
database:
  mode: "supabase"
  duckdb:
    path: "data/app_data/app_data.duckdb"
    read_only: true
  # Supabase credentials are configured in the 'supabase:' section below

# Platform definitions (MP065)
platforms:
  cbz:
    status: "active"
  eby:
    status: "active"

# Pipeline orchestration (MP140-MP142) — required by update_scripts/Makefile
# Issue #371: MAMBA had no pipeline: section, so make run was a no-op.
pipeline:
  platforms:
    cbz:
      enabled: true
      # D03 re-enabled (Refs #671): fn_D03_01_core.R now accepts column_spec
      # parameter, mapping cbz source columns to canonical output names.
      # See `derivations.D03_01.column_spec.cbz` below for the mapping.
      # D04 added (#374 Tier 2): Poisson precision marketing
      drv_groups: ["D00", "D01", "D03", "D04", "D05"]
    eby:
      enabled: true
      # D03 re-enabled (Refs #671): see `derivations.D03_01.column_spec.eby`.
      drv_groups: ["D00", "D01", "D03", "D04", "D05"]
    all:
      enabled: true
      depends_on_platforms:
        - cbz
        - eby
      # NOTE (#374): D05 re-enabled with cross-platform-safe write helper.
      # D03 (worldMap) re-enabled (Refs #671) — fn_D03_01_core.R now reads
      # per-platform column_spec from `derivations.D03_01.column_spec.<platform>`
      # so multi-platform aggregation can run without amz-specific column
      # hardcoding. all_D03_01.R orchestrator iterates active platforms and
      # invokes run_D03_01() with the resolved spec per platform.
      drv_groups:
        - D01
        - D03
        - D05
    precision:
      enabled: false   # Poisson precision marketing — not currently used by MAMBA dashboard

  execution:
    # #378: Changed from 2 to 1 because DuckDB does not support concurrent
    # writers to the same file. Parallel 0IM targets (orders/sales/customers/
    # products all writing to raw_data.duckdb) caused last-write-wins data loss.
    parallel_workers: 1

  scheduling:
    mode: "manual"
    schedule: "0 2 * * 0"  # Sunday 2:00 AM (not actually scheduled, manual only)

# Per-derivation config blocks (Refs #671)
#
# Maps SOURCE column names (per-platform standardized schema) → canonical
# OUTPUT column names that downstream UI consumes (ship_country, ship_state).
#
# Schema:
#   derivations.<derivation_id>.column_spec.<platform_id> = named list with:
#     order_id : column with one row per order line (COUNT DISTINCT for order_count)
#     revenue  : pre-computed line revenue (unit_price × qty)
#     country  : geo country dimension → output as `ship_country`
#     state    : geo state/province → output as `ship_state` (NULL skips state aggregation)
#     quantity : line quantity (AVG quantity stat)
#
# When platform has no column_spec entry, fn_D03_01_core.R falls back to
# default_amz_column_spec() (preserves amz backward compatibility).
derivations:
  D03_01:
    column_spec:
      cbz:
        # 台灣 Cyberbiz — billing address is the only geo dim (Taiwan domestic).
        # Province (台北/新北/etc) used as state surrogate for drill-down.
        order_id: order_id
        revenue: lineproduct_price        # already canonical (post-ETL standardization)
        country: billing_address_detail_address_country
        state: billing_address_detail_address_province
        quantity: quantity
      eby:
        # eBay — international, has explicit country_name + state_or_province.
        order_id: order_id
        revenue: lineproduct_price
        country: country_name
        state: state_or_province
        quantity: quantity
      # amz: no entry — falls back to default_amz_column_spec()

googlesheet:
  product_profile: "1DADOOtwUuWqB3azFPmTcFSDunyACx_RsNpKlGoL2ta4"
  comment_property: "1-esqSKUQ9MF1My8XIw1pG4MNfuDu_b6t8NXac39iGuc"

# Metadata sources (required by all_ETL_metadata_0IM.R)
# Issue #371: MAMBA does not use GSheet-sourced metadata for ETL,
# so all platforms are disabled. This section exists solely to satisfy
# the metadata ETL target's schema check.
metadata_sources:
  cbz:
    enabled: false
    sheet_id: ""
    sheet_name: "metadata_CBZ"
  eby:
    enabled: false
    sheet_id: ""
    sheet_name: "metadata_EBY"

# Components with their data sources - using all standard patterns
components:
  micro:
    microCustomer:
      primary: customer_details
      history: customer_history
    sales: sales_by_customer_dta
  
  macro:
    trends:
      data_source: sales_trends
      parameters:
        show_kpi: true
        refresh_interval: 300

# Supabase configuration (app_data deployment)
# Values are pulled from environment variables at runtime.
supabase:
  db:
    host_env: "SUPABASE_DB_HOST"
    port_env: "SUPABASE_DB_PORT"
    name_env: "SUPABASE_DB_NAME"
    user_env: "SUPABASE_DB_USER"
    password_env: "SUPABASE_DB_PASSWORD"
    sslmode: "require"

# Startup flags — metadata must come from Supabase on Connect (DM_R054 v2.1.1).
# Set to true ONLY for emergency bootstrap without DB.
startup:
  allow_missing_metadata: false

# Deployment settings
deployment:
  main_file: "scripts/global_scripts/10_rshinyapp_components/unions/union_production_test.R"  # 主要應用檔案
  target: "posit_connect"
  url: "https://connect.posit.cloud"
  app_name: "mamba-enterprise"
  app_id: "mamba-enterprise"
  title: "MAMBA Enterprise Platform"
