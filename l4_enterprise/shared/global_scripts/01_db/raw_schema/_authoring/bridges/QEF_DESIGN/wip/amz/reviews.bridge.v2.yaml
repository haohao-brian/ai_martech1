    notes: Review headline / title.
  amz_verified_purchase:
    type: column
    name: VP评论
    notes: 'Source uses ''Y'' (385/400 in B07KRVMT5Y.xlsx) or NA (15/400). ''Y'' →
      true; NA → optional/missing (canonical extension field is required: false, no
      sentinel needed).'
  amz_vine_review:
