    name: 星级
    notes: Numeric 1-5, observed distribution well-spread across all 5 levels. Canonical
      caps to [0, 5].
  review_date:
    type: column
    name: 评论时间
    notes: Already in %Y-%m-%d format (e.g. '2026-03-17'). No coercion needed; canonical
      formatter passes through.
  platform_id:
    type: const
    value: amz
    notes: Three-letter platform_id from canonical_target.platform; matches schema
      pattern ^[a-z]{3}$.
